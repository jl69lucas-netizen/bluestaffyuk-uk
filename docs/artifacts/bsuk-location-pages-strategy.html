# Location pages strategy — 2026-09-25

Scope: the 28 pages in `data/locations.json` (project 5), plus the comparison and guide pages the research supports as their link targets. This replaces the 2026-09-23 pilot strategy, which rested on three competitor reports; this one rests on all 21 registry entries.

How the research was read:

- **Breadth.** The matrix now has a report for every registry entry. Two limits remain. petsforlove is homepage-gated (site down), so it counts as "not fetched" in every row and gives no gaps. The tier-5 entry (staffordshirebullterrierkennel) has a homepage-only report: its keywords and page types are NOT FETCHED, but its cities (none) and schema were read. So the matrix's keyword and page-type counts (`/19`) leave the tier-5 report out, while its city and schema counts (`/20`) include it. The tier-5 report lists no city, so it adds to no city's N; its schema does list Person, so the Person 5/20 row counts it. The tier-5 entry appears below only as a risk, never as a model or a link.
- **The keyword-gap file is not provisional.** Its BSUK source is the BSUK profile (`bsuk.json`), not the page-map fallback. It no longer carries the pilot's "how much will a pet cost" row, so that row is not carried over. Its location-bound high rows are London, Manchester, Liverpool (two rows), Essex and Dundee. The file matched a stub for Essex only: the London, Liverpool, Manchester and Dundee headings carry extra words ("dogs", "near me", "0 ads", the run-together "salein"), so the script scored them as word topics. They are quoted as printed and not re-scored. For London, Liverpool and Manchester, the profile lists no page and the page map holds a stub at that city, so each row is a **project 5 rebuild of that stub**, never a new URL. Dundee's page is indexable (the profile lists it), so its row is a refresh of the existing page.
- **Stubs versus indexable pages.** The profile's indexable location pages are Aberdeen, Dundee, Edinburgh, Hull, Inverness, Middlesbrough, Oxford, Sunderland and York, plus the UK page and the Glasgow breeding-dogs page. Every other page in `data/locations.json` is a `noindex, follow` stub (`defects: stub`), and each stub is a project 5 rebuild of its existing URL. The matrix marks every city "BSUK has it: yes" because the pages *name* all 25 cities (the "Cities We Serve" block). Those rows are quoted as printed and not re-marked. For a stub city, the gap is the page, not the name.
- **LLM intel.** There are three `page_source.kind`s, and bands are compared only within one kind. **dist** covers the indexable pages (not provisional). **page-map** covers the stubs that have no question file (provisional, checked against the page map's headings). **question-file** covers Manchester and Leeds (provisional). The UK page (dist) and the licensed-breeder stub (page-map) share one question, and so do the two Glasgow pages (dist and page-map). Each pair is one answer read against two different page sources, so its bands are never compared. `bsuk_cited` is `false` in every file. The `local_businesses` lists hold breed clubs, rescues, adoption listings and other breeds' kennels; only registry competitors are counted as competitors here.
- **Scales.** The matrix's "high / medium / low" is a share of competitors. The keyword-gap's "high / medium" is a points score. Each use below says which one, and the two are never merged.
- **No traffic figures.** GSC and GA4 are not fetched until project 6, so no traffic, ranking or volume figure appears here.
- **Flag for the architect, outside the build order.** `bsuk.md` (Conversion) records that the older indexable location pages still print terms the rebuilt pages have retired. All nine city pages print a flat delivery fee. Aberdeen, Edinburgh, the UK hub and the Glasgow breeding-dogs page print a price band for puppies that are no longer listed. Hull calls the deposit non-refundable. `bsuk.md` (Trust) adds that the older UK hub still calls the business council-licensed, which is an unconfirmed licence claim. These are live, indexable defects under the facts rules, whichever strategy runs. Correcting them is a fix, not a page build, so it is not ranked in the order below.

<script type="text/markdown" data-title="Strategy A — Contest order: city pages ranked by the research">
**Thesis.** The most contested cities are the stubs. London (12/20), Manchester (11/20) and Birmingham (9/20) top the matrix city gaps, and every city at 8/20 is a noindex stub too. The location-bound high keyword-gap rows (London, Manchester, Liverpool, Essex) all land on stubs, each scored 10 (3+2+3+2). The competitor pages that hold those rows are marketplace town pages. The Preloved report finds its Manchester Staffy page "shows the same seven UK-wide adverts" as its national page. UKPets's town pages are "one national Staffy feed" under a swapped town name. Forever Puppy's Bristol page "returned exactly the same national list" as its hub. Gumtree's Liverpool hub has no adverts of its own and is marked noindex. Every one of those reports names the same counter: a real local page from one breeder. So A builds or refreshes all 28 pages in the order the research ranks them. Keyword-gap high rows come first, then matrix city share. Within one share, a stub goes before an indexable page, and ties follow the matrix's printed order. Each page is built deep from its own outline. The guides follow.

**Target clusters.**
- Full-breed-name buying phrases on city pages (keyword-gap, high band, points): "staffordshire bull terrier puppies and dogs for sale in london", "staffordshire bull terrier puppies for salein manchester greater manchester" (the row's own spelling), "staffordshire bull terrier puppies for sale near me in liverpool merseyside", "staffordshire bull terrier puppies for sale in essex" and "staffordshire bull terrier dogs and puppies for sale in dundee".
- Breed-plus-town phrases from the matrix keyword gaps (1/19 each, low priority, matrix scale): "staffordshire bull terrier in bristol / coventry / essex / glasgow / leeds / nottingham", "staffies in birmingham / edinburgh / london / manchester", "staffordshire bull terriers in dundee", "staffie puppies in london" and "staffie puppies in essex".
- The buyer checks each page's own AI answer names. The dist results (indexable pages, not provisional) show "meet the mother" in the high band on every one: the answer names it and the page does not carry it. "kc registration" and "contract" are high on most dist results. The page-map results (stubs, provisional) show every safety entity their answer names in the high band, because a stub carries none. The question-file results (provisional) are microchip and vaccinations for Manchester, and L-2-HGA, HC-HSF4 and meet the mother for Leeds.

**Cluster → page map.** Each city → its own existing URL: a stub is a rebuild, and an indexable page is a refresh that keeps its verbatim set under the faithful-rewrite rule. Never a second URL for a city. The Glasgow for-sale stub takes "staffordshire bull terrier in glasgow". The Glasgow breeding-dogs page keeps its stud-dog topic, so the two do not compete. The three national high rows in the keyword-gap file ("staffordshire bull terrier puppies", "staffordshire bull terrier dogs puppies" and "staffy puppies quality blue", each 10 (3+2+3+2)) are not location topics. They go to the architect for the listing and home pages, not onto a city page. The "questions to ask the breeder" row, the cost rows and the care rows go to the guides after the cities.

**Internal-link plan.** Every city page links:
- up to the UK hub (`/uk-locations/blue-staffy-puppies-uk/`) and the index (`/uk-locations/`);
- down to the listing (`/available-puppies/`);
- across to the existing indexable proof pages the profile lists: the buying guide (`/uk-blue-staffy-puppy-buying-guide/`, whose breeder-questions section answers the checks above), the health page (`/blue-staffy-health-uk/`) and the price page (`/blue-staffy-pup-sale-uk/`).

Neighbours link to each other: Yorkshire (Leeds, York, Hull, South Yorkshire), Scotland (Glasgow, Edinburgh, Aberdeen, Dundee, Inverness), the West Midlands and Staffordshire (Birmingham, Coventry, Wolverhampton, Newcastle-under-Lyme), the East Midlands (Nottingham, Leicester) and the North East (Sunderland, Middlesbrough). Once built, the licensed-breeder page and the guides get a link from every city page.

Outbound authority links sit beside a buying check. They go to the Royal Kennel Club (tier 2, `link_allowed: true`, cited in most of the AI answers) and to the RSPCA or the PDSA (tier 3, `link_allowed: true`, each cited in some answers). No link goes to a tier-1 breeder, even though Trojanstaff and UKStaffyPups appear in many answers' `local_businesses`. No link goes to a classifieds competitor, and never to the tier-5 entry.

**Schema plan.** Keep what the profile shows BSUK already emits on location pages (LocalBusiness, FAQPage, BreadcrumbList, Place and the rest). Add Person on the licensed-breeder page. That fills the matrix schema gap Person 5/20 (medium priority, matrix scale; the 5/20 includes the tier-5 report). SearchAction 5/20 is a site-wide item, not a location page, and goes to the architect. No schema claims a licence number: that claim stays behind `LICENCE_CLAIM_PLACEHOLDER`.

**Build order and effort.** The Concrete Artifact order. Stubs are written from nothing, each from its own outline through `grill-me`. The indexable pages are lighter refreshes: they keep their verbatim set, gain answers for their dist high-band checks, and add links to the proof pages. The licensed-breeder page and the UK hub come after the cities, so the hub can link to every rebuilt city. The guides come last.

**Expected outcome (no traffic figure).** The contested cities stop being noindex placeholders in the order competitors contest them. Each city page carries the local detail and the buyer checks that the marketplace town pages lack. Each also answers the checks its own AI answer names, which makes it a candidate citation where today no answer cites BSUK.

**Risks.**
- City priority measures how many competitors publish a town page, not local demand. Several of those pages are national feeds.
- The tier-5 entry holds a London map-pack slot (registry notes), and London is built first. The London page must answer with breeder proof, never by naming or linking that entry.
- The licensed-breeder page's central claim stays a placeholder until the breeder confirms the licence. The "licence" entity is also high on several dist answers (Dundee, Edinburgh, Hull, Inverness, Oxford). Those pages must answer it without asserting a licence.
- Building the pages one after another invites templated prose, which the write-from-the-outline rule forbids.
- The refreshes sit mid-order. The retired terms flagged above stay live unless they are fixed separately.
- petsforlove is not in any count.
</script>
<script type="text/markdown" data-title="Strategy B — Answer pages first, cities as spokes">
**Thesis.** No AI answer cites BSUK, and every answer is a buyer checklist. Health tests, meeting the mother and vaccinations are named in every llm-intel file. So B bets on the answer layer first. It builds the pages that answer those checks once, in depth:
- a questions-to-ask-the-breeder page ("questions to ask the breeder", 7 (0+2+3+2), high band on the points scale; matrix page type faq 4/19, medium);
- a Staffy cost page ("how much does a staffordshire bull terrier cost" and "the cost of owning a dog", 5 (0+2+3+0) each, medium; matrix price 4/19);
- a care guide ("crate training your dog" and "dog training", 5 (0+2+3+0) each, medium; matrix care-guide 4/19);
- the licensed-breeder page with Person schema.

Then it refreshes the indexable location pages to link in, because those pages are live today. Last, it rebuilds every stub in one pass as a lighter spoke that sends buyers to the answer pages. The bet is that one strong answer page earns citations for all 28 cities better than 28 separate city answers.

**Target clusters.**
- Buyer questions: the keyword-gap high row above. It comes from the Royal Kennel Club's breeder-questions guide (tier 2), whose report says it gives two question lists (phone call and visit). Add the entities every AI answer names.
- Cost: the two medium cost rows. The PDSA report (tier 3) shows a vet charity setting out set-up, monthly and lifetime costs. BSUK's own price page is typed a listing, so the matrix counts price as a gap.
- Care: the two medium training rows and the care-guide page type.
- Trust: the licensed-breeder stub, and Person 5/20 (matrix schema, medium; includes the tier-5 report).
- Then the city stubs, in one batch with no research-ranked order.

**Cluster → page map.**
- Buyer-questions page → new faq page. The buying guide's existing questions section links to it and keeps its verbatim heading.
- Cost page → new page, linked to and from the existing price page.
- Care guide → new page under the guides hub (`/blue-staffy-blog-guides/`).
- Licensed breeder → its existing stub, rebuilt.
- Each city → its existing URL (stub rebuild or indexable refresh).

**Internal-link plan.** The answer pages form a hub under the guides index. Each answer page links to the licensed-breeder page, the health page and the listing. City pages carry a short local section, then link to all the answer pages. Outbound links are as in A: the Royal Kennel Club, the RSPCA and the PDSA. Never a tier-1 breeder, a classifieds competitor or the tier-5 entry.

**Schema plan.** FAQPage on the questions page, Article on the cost and care pages, Person on the licensed-breeder page. City pages as in A.

**Build order and effort.** The answer pages and the licensed-breeder page come first: fewer pages, heavier research each. Then the indexable location refreshes. Then all stubs in one batch. Most of the writing effort goes early; the stubs get less each.

**Expected outcome (no traffic figure).** The faq, price and care-guide page-type gaps close first. When city pages ship, each one links to real depth, and the buyer checklist exists once, on a page an engine can cite.

**Risks.**
- Every stub stays noindex through the whole answer phase. That includes London (12/20), Manchester (11/20) and the high keyword-gap rows at 10 (3+2+3+2).
- The answer pages compete with the Royal Kennel Club, RSPCA and PDSA pages. Those reports say those pages rank on registry or charity authority.
- Thin spokes are what the marketplace town pages already are, which is the weakness every marketplace report names.
- A single-batch city pass invites the templated prose the write-from-the-outline rule forbids.
- The questions page must not compete with the buying guide's own questions section.
</script>
<script type="text/markdown" data-title="Recommendation">
**Pick: Strategy A — Contest order: city pages ranked by the research.** It is not provisional. The WHY rests on keyword-gap rows scored from the BSUK profile (not the page-map fallback) and on the matrix. The page-map and question-file llm-intel results are provisional and are used as support only, marked as such. No tie-break was needed: A leads with the higher score in the same band and the larger matrix share. Had one been needed, rule one (highest keyword-gap band first) would not separate them, because both lead with a high-band row. Rule two (highest matrix share first) would pick A: its first page, London, is 12/20 on the city scale, against B's faq 4/19.

**WHY.**
- **The high rows are on stubs.** The keyword-gap file's location-bound high rows land on London, Manchester, Liverpool and Essex at 10 (3+2+3+2) each (points scale), and all four are noindex stubs. The file itself names the Essex rebuild ("project 5 rebuild: /uk-locations/staffy-puppies-for-sale-essex/"). B's lead row, "questions to ask the breeder", scores 7 (0+2+3+2). A closes the rows scored 10 first.
- **The most contested cities are stubs.** On the matrix city scale, London is 12/20, Manchester 11/20 and Birmingham 9/20, and every city at 8/20 is a stub too. Every one of them is a `noindex, follow` stub in `data/locations.json` (the /20 includes the tier-5 report, which lists no city). B keeps every one of them noindex through its whole answer phase.
- **The rival pages are not local.** The marketplace town pages behind these rows are national feeds with a town name: Preloved's Manchester page, UKPets's Dundee page and Forever Puppy's Bristol page. Gumtree's Liverpool hub is empty and noindex. Each of those reports says the counter is a real local page from one breeder. That is A's page type, not B's thin spoke.
- **Stubs answer nothing.** No llm-intel file has `bsuk_cited` true. The page-map results for the stubs (provisional) put every buyer check their answer names in the high band, because a stub answers none of them.

**The pick's downside.**
- It delays the faq, price and care-guide page types (each 4/19, medium on the matrix scale) and the "questions to ask the breeder" row (7 (0+2+3+2), high on the points scale) until every location page is done. Until then, city pages send buyers to a guides hub whose blog holds one post of 162 words. B would close those gaps first.
- It puts the indexable refreshes mid-order. Oxford and Sunderland (7/20) wait behind the 8/20 stubs, so the retired terms flagged above stay live for longer unless they are fixed separately.
- Its city ranking measures how many competitors publish a town page. It does not measure local demand, and GSC is not fetched until project 6 to check it.

**First three build steps.**
1. Rebuild the London stub (`/uk-locations/blue-staffy-puppies-london/`) on "staffordshire bull terrier puppies and dogs for sale in london". Answer the page-map high-band checks (provisional): health tests, L-2-HGA, HC-HSF4, meet the mother, microchip, vaccinations, KC registration, licence and contract. The licence answer stays a placeholder. Carry breeder proof against the tier-5 map-pack listing, never naming or linking it. Build through `grill-me`.
2. Rebuild the Manchester stub (`/uk-locations/blue-staffy-puppies-manchester-uk/`) on the Manchester high row. Answer the question-file high-band checks (provisional): microchip and vaccinations. Link out to the Royal Kennel Club and the PDSA, both cited in its answer.
3. Rebuild the Liverpool stub (`/uk-locations/staffy-puppies-for-sale-liverpool/`) on "staffordshire bull terrier puppies for sale near me in liverpool merseyside". Answer its page-map high-band checks (provisional). The Gumtree report shows the rival Liverpool hub has no local adverts, so this page carries real local detail.
</script>
