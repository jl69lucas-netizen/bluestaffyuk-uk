**Tech Stack:** Astro 6.3.8, Tailwind 4.3, the kit in `src/components/kit/`, Python 3 + pytest, Playwright harness, the board system (`scripts/pageboard.py`, `build_page_board.py`, `board_approve.py`, `board_gate.py`, `schemas/board.schema.json`), Artifact tool (boards with `db`).

**Spec:** `docs/superpowers/specs/2026-09-19-page-rebuilds-design.md` (Artifact https://claude.ai/artifact/LrTbp44VxpGNmtmpjx5GNi).

**Working rules for every task.** Branch `page-rebuilds` (cut from `foundation` at `63a7b12`). Run from `/Users/apple/Downloads/BSUK`. Never push. Every commit ends with `Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>` — that exact name. No hex outside `src/styles/tokens.css`; no emoji (inline stroke SVG); never write parrot/bird/CAG/`cag-`/a hosting provider; `Glasgow` may be written only in Known Issue 16 text and the Glasgow location page's slug. Every existing image and video is reused at its original path with its alt text (working rule 11). No invented claims (rule 9): a fact comes from the migrated page body, `data/*.json`, `rules/`, or is `NOT FETCHED`. Before every commit: `python3 scripts/marker_check.py | tail -1` = `0 problems`, `set -a; source .env; set +a; npm run build 2>&1 | grep "page(s) built"`, `python3 -m pytest tests/py -q -x 2>&1 | tail -1` green, registries green. Source `.env` before any build so the form audit runs. Kit conventions in `src/components/kit/_registry.ts` are binding; the kit has NO `variant` prop (`Button kind`, `Testimonial mode|reviews`, `InfoCard kind`, `SectionDivider inverse`, `Hero as`).

// src/lib/sections.ts — the section list a page exposes to PageDial and SectionSheet.
// A section is any <section id="…" data-section-label="…"> in the page body; both components
// take the list as a prop so the page owns the order (the board record's section order).
export interface SectionRef { id: string; label: string }
export const sectionsFromRecord = (record: { sections: { id: string; heading: string }[] }): SectionRef[] =>
  record.sections.map((s) => ({ id: s.id, label: s.heading.replace(/:.*$/, '').trim() }));
```

```astro
---
// src/components/kit/PageDial.astro — desktop in-page dial (spec §3): sticky sidebar card,
// 64px progress ring ("n of N"), numbered section list, scroll-spy. Hidden below 1024px
// (SectionSheet takes over). Metrics match the source site's dial: 196px column, 64/50 ring,
// rows ≥24px, dashed top rule. Tokens only; card shell from kit.css.
import type { HTMLAttributes } from 'astro/types';
import type { SectionRef } from '../../lib/sections';
type Props = HTMLAttributes<'aside'> & { sections: SectionRef[]; title?: string };
const { sections, title = 'On this page', class: cls, ...rest } = Astro.props;
const N = sections.length;
const C = 2 * Math.PI * 22; // ring circumference at r=22 (50px inner box)
---
<aside class:list={['kit-dial kit-card', cls]} data-dial {...rest}>
  <div class="ring" aria-hidden="true">
    <svg viewBox="0 0 64 64" width="64" height="64"><circle cx="32" cy="32" r="22" class="track" /><circle cx="32" cy="32" r="22" class="fill" style={`stroke-dasharray:${C.toFixed(1)};stroke-dashoffset:${C.toFixed(1)}`} data-ring /></svg>
    <span class="n"><b data-ring-n>1</b><small>of {N}</small></span>
  </div>
  <nav aria-label="Sections"><p class="t">{title}</p><ol>
    {sections.map((s, i) => <li><a href={`#${s.id}`} data-spy={s.id}><span class="num">{String(i + 1).padStart(2, '0')}</span><span class="lab">{s.label}</span></a></li>)}
  </ol></nav>
</aside>
<script>
  // Scroll-spy: the section whose top is nearest below the header wins; ring shows n of N.
  const dial = document.querySelector<HTMLElement>('[data-dial]');
  if (dial) {
    const links = [...dial.querySelectorAll<HTMLAnchorElement>('[data-spy]')];
    const ring = dial.querySelector<SVGCircleElement>('[data-ring]');
    const nEl = dial.querySelector<HTMLElement>('[data-ring-n]');
    const C = 2 * Math.PI * 22;
    const targets = links.map((a) => document.getElementById(a.dataset.spy!)).filter(Boolean) as HTMLElement[];
    const set = (i: number) => {
      links.forEach((a, j) => a.toggleAttribute('aria-current', j === i));
      if (ring) ring.style.strokeDashoffset = String(C * (1 - (i + 1) / links.length));
      if (nEl) nEl.textContent = String(i + 1);
    };
    const io = new IntersectionObserver((es) => {
      const vis = es.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis[0]) set(targets.indexOf(vis[0].target as HTMLElement));
    }, { rootMargin: '-40% 0px -55% 0px' });
    targets.forEach((t) => io.observe(t));
    set(0);
  }
<\/script>
<style>

---
// src/components/kit/SectionSheet.astro — mobile/tablet in-page nav (spec §3): a fixed bottom
// tab bar (Home · Puppies · Contact · Sections) whose Sections tab opens a native <dialog>
// bottom sheet listing the page's sections with scroll-spy. Hidden at ≥1024px (PageDial
// takes over). The bar is 64px tall and reserves that space with body padding so no jump
// target lands under it (nav-bottom-chrome-clear measures it).
import type { HTMLAttributes } from 'astro/types';
import type { SectionRef } from '../../lib/sections';
import Button from './Button.astro';
type Props = HTMLAttributes<'div'> & { sections: SectionRef[]; ctaLabel?: string; ctaHref?: string };
const { sections, ctaLabel = 'Available puppies', ctaHref = '/available-puppies/', class: cls, ...rest } = Astro.props;
const I = {
  home: 'M3 11l9-8 9 8v10H3z M9 21v-6h6v6',
  pup: 'M4 8c0-3 2-5 5-5h6c3 0 5 2 5 5v8a5 5 0 0 1-10 0V8 M9 20h6',
  mail: 'M4 5h16v14H4z M4 7l8 6 8-6',
  list: 'M4 7h16M4 12h16M4 17h10',
};
const tabs = [['Home', '/', I.home], ['Puppies', '/available-puppies/', I.pup], ['Contact', '/uk-blue-staffy-breeders-contact/', I.mail]];
---
<div class:list={['kit-sheet', cls]} data-sheet {...rest}>
  <nav class="kit-tabbar" aria-label="Site">
    {tabs.map(([l, h, d]) => <a href={h}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d={d} /></svg><span>{l}</span></a>)}
    <button type="button" data-open aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d={I.list} /></svg><span>Sections</span></button>
  </nav>
  <dialog class="sheet" aria-label="Sections" data-dialog>
    <div class="grab" aria-hidden="true"></div>
    <ol>{sections.map((s, i) => <li><a href={`#${s.id}`} data-spy={s.id}><span class="num">{String(i + 1).padStart(2, '0')}</span>{s.label}</a></li>)}</ol>
    <div class="cta"><Button kind="primary" href={ctaHref} label={ctaLabel} /><button type="button" class="close" data-close>Close</button></div>
  </dialog>
</div>
<script>
  const root = document.querySelector<HTMLElement>('[data-sheet]');
  if (root) {
    const dlg = root.querySelector<HTMLDialogElement>('[data-dialog]')!;
    root.querySelector('[data-open]')?.addEventListener('click', () => dlg.showModal());
    root.querySelector('[data-close]')?.addEventListener('click', () => dlg.close());
    dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });
    dlg.querySelectorAll('a[href^="#"]').forEach((a) => a.addEventListener('click', () => dlg.close()));
    const links = [...dlg.querySelectorAll<HTMLAnchorElement>('[data-spy]')];
    const targets = links.map((a) => document.getElementById(a.dataset.spy!)).filter(Boolean) as HTMLElement[];
    const io = new IntersectionObserver((es) => {
      const vis = es.filter((e) => e.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top);
      if (vis[0]) { const i = targets.indexOf(vis[0].target as HTMLElement); links.forEach((a, j) => a.toggleAttribute('aria-current', j === i)); }
    }, { rootMargin: '-40% 0px -55% 0px' });
    targets.forEach((t) => io.observe(t));
  }
<\/script>

```ts
/** A fixed bottom bar must never cover the landing position of an in-page jump target.
 *  Judged unit: each in-page link's target; measured = target top after the jump relative
 *  to the bar's top. Bars: any fixed element whose box touches the viewport bottom and
 *  spans ≥80% of the width. */
register({
  id: 'nav-bottom-chrome-clear',
  family: 'NAV',
  severity: 'blocking',
  describe: 'a fixed bottom bar must not cover in-page jump targets',
  minExamined: 1,
  async run(page, viewport) {
    const r = await page.evaluate(() => {
      const H = window.innerHeight, W = window.innerWidth;
      const bars = [...document.body.querySelectorAll<HTMLElement>('*')].filter((el) => {
        const cs = getComputedStyle(el); if (cs.position !== 'fixed' || cs.display === 'none') return false;
        const b = el.getBoundingClientRect(); return b.bottom >= H - 1 && b.width >= W * 0.8 && b.height > 0 && b.height < H * 0.4;
      });
      if (!bars.length) return { examined: 0, bad: [] as string[] };
      const barTop = Math.min(...bars.map((b) => b.getBoundingClientRect().top));
      const links = [...document.querySelectorAll<HTMLAnchorElement>('a[href^="#"]')].filter((a) => a.getAttribute('href')!.length > 1);
      const bad: string[] = []; let examined = 0;
      for (const a of links) {
        const t = document.getElementById(a.getAttribute('href')!.slice(1)); if (!t) continue; examined++;
        t.scrollIntoView(); const top = t.getBoundingClientRect().top;
        if (top >= barTop) bad.push(a.getAttribute('href')!);
      }
      window.scrollTo(0, 0);
      return { examined, bad };
    });
    return { examined: r.examined, defects: r.bad.map((h) => ({ checkId: 'nav-bottom-chrome-clear', family: 'NAV' as const, viewport, count: 1, message: `jump target ${h} lands under the bottom bar` })) };
  },
});
```

- [ ] **Step 2: Write the checker**

```python
#!/usr/bin/env python3
"""facts_preserved_check.py — a rebuilt page must keep every fact its migrated body carried.

Facts = prices (£ amounts), puppy names (from data/puppies.json + the four removed pups are
NOT facts), health-test names, credential phrases, image paths, YouTube embed ids. Extracted
ONCE from the migrated page (data/facts/<slug>.json, `--extract` before the rewrite) and
checked against dist/<slug>/index.html after it. A fact may be dropped only if the board
record lists it under `dropped` with a reason (data/boards/<slug>.json → "dropped").
Slugs in data/facts/rebuilt.json are exempt from migration_parity.py and subject to this.
"""
import argparse, json, pathlib, re, sys
ROOT = pathlib.Path(__file__).resolve().parent.parent
PRICE = re.compile(r"£\s?\d{1,3}(?:,\d{3})*(?:\.\d\d)?")
TESTS = ["L-2-HGA", "HC-HSF4", "HC", "DNA", "KC", "microchip", "vaccinat"]
CREDS = ["KC-registered", "Kennel Club", "DEFRA", "licence", "Lucy"]
IMG = re.compile(r'<img[^>]+src="([^"]+)"')
EMBED = re.compile(r"youtube(?:-nocookie)?\.com/embed/([A-Za-z0-9_-]{6,})")
TAG = re.compile(r"<[^>]+>")


def extract(html, names):
    text = TAG.sub(" ", html)
    return {
        "prices": sorted(set(PRICE.findall(text)), key=lambda p: int(re.sub(r"[^\d]", "", p))),
        "names": [n for n in names if re.search(rf"\b{re.escape(n)}\b", text)],
        "tests": [t for t in TESTS if t in text],
        "creds": [c for c in CREDS if c.lower() in text.lower()],
        "images": sorted(set(IMG.findall(html))),
        "embeds": sorted(set(EMBED.findall(html))),
    }


def missing(facts, new_html, dropped=None):
    dropped = dropped or {}
    text = TAG.sub(" ", new_html)
    out = {}
    for k, vals in facts.items():
        drop = set(dropped.get(k, []))
        miss = []
        for v in vals:
            if v in drop:
                continue
            if k == "images":
                present = v in new_html
            elif k == "embeds":
                present = v in new_html
            elif k == "creds":
                present = v.lower() in text.lower()
            else:
                present = v in text
            if not present:
                miss.append(v)
        if miss:
            out[k] = miss
    return out


def main(argv=None):
    ap = argparse.ArgumentParser()
    ap.add_argument("--extract", metavar="SLUG", help="extract facts from dist/<slug>/ into data/facts/<slug>.json")
    ap.add_argument("--check", action="store_true", help="check every slug in data/facts/rebuilt.json")
    a = ap.parse_args(argv)
    names = [p["name"] for p in json.loads((ROOT / "data/puppies.json").read_text())]
    if a.extract:
        slug = a.extract
        html = (ROOT / "dist" / (slug if slug != "index" else "") / "index.html").read_text()
        body = re.search(r"<article[^>]*prose-migrated[^>]*>(.*?)</article>", html, re.S)
        (ROOT / "data/facts").mkdir(exist_ok=True)
        (ROOT / f"data/facts/{slug}.json").write_text(json.dumps(extract(body.group(1) if body else html, names), indent=1) + "\n")
        print(f"extracted facts for {slug}")
        return 0
    rebuilt = json.loads((ROOT / "data/facts/rebuilt.json").read_text()) if (ROOT / "data/facts/rebuilt.json").exists() else []
    problems = 0
    for slug in rebuilt:
        facts = json.loads((ROOT / f"data/facts/{slug}.json").read_text())
        rec = json.loads((ROOT / f"data/boards/{slug}.json").read_text())
        html = (ROOT / "dist" / (slug if slug != "index" else "") / "index.html").read_text()
        miss = missing(facts, html, rec.get("dropped", {}))
        for k, vs in miss.items():
            for v in vs:
                print(f"{slug}: missing {k} {v!r}"); problems += 1
    print(f"examined {len(rebuilt)} rebuilt pages; {problems} problems")
    return 1 if problems else 0


if __name__ == "__main__":
    sys.exit(main())
```

<script type="text/markdown" data-title="The page procedure (used by Tasks 7–18)">
Every page task runs these steps; the task lists only its inputs. The steps are written out once here and referenced by number from each page task — an implementer executing a page task reads this block first.

- **P1 Research.** Read the migrated page (`src/pages/<slug>/index.astro` body, `data/facts/<slug>.json`, `dist/<slug>/index.html`), `data/page-map.json` row, the linked images in `data/image-manifest.json`. Competitor scan: search (Firecrawl `firecrawl_search` or web search) for 3–5 UK Staffordshire Bull Terrier breeder pages with the same intent; record for each: URL, word count, H2 list, FAQ count, schema types, trust signals; unavailable → `NOT FETCHED`. Query augmentation: list 8–12 questions/entities AI search asks for the primary keyword; map each to a section or FAQ.
- **P2 Outline → record.** Write `data/boards/<slug>.json` per `schemas/board.schema.json`: `meta` (slug, page_type, status `draft`, sources), `brief` (intent, audience, primary keyword, competitor summary, query map), `h1` options (3), `meta_set` (3 titles 50–60, 3 descriptions 140–160, recommended), `sections` in order (id, heading, intent, why + why_source, words min/max, shape, keywords, entities, tree H3–H6, images by ORIGINAL path, links internal/external, `styles: ["S1","S2","S3"]`, `options`), review slots as sections of shape `reviews` with `mode`, FAQ section listing the `data/faq.json` ids (add page rows there with `source`), `tuple` (dial: `"kit"`, toc: `"kit"`, newsletter, h6_prefixes), `dropped` (facts intentionally not carried, each with a reason), `assets`. Validate: `python3 -c "import scripts.pageboard as PB; PB.load_record('<slug>')"` (or the module's loader) → no `BoardError`.

<script>
(function(){
  var doc=document.getElementById('doc'),toc=document.getElementById('toc'),all=[];
  function copy(text,el){navigator.clipboard.writeText(text).then(function(){el.textContent='Copied';el.className='copied';setTimeout(function(){el.textContent='';},1800);});}
  document.querySelectorAll('script[type="text/markdown"]').forEach(function(b,i){
    var title=b.getAttribute('data-title'),md=b.textContent.replace(/^\n+|\s+$/g,'');
    all.push('## '+title+'\n\n'+md);
    var id='s'+i,sec=document.createElement('section');sec.className='sec';sec.id=id;
    var sh=document.createElement('div');sh.className='sh';
    var h2=document.createElement('h2');h2.textContent=title;sh.appendChild(h2);
    var right=document.createElement('span');var st=document.createElement('span');st.style.marginRight='8px';
    var btn=document.createElement('button');btn.className='btn ghost';btn.textContent='Copy section';
    btn.addEventListener('click',function(){copy('## '+title+'\n\n'+md,st);});
    right.appendChild(st);right.appendChild(btn);sh.appendChild(right);sec.appendChild(sh);
    var body=document.createElement('div');body.className='md';body.innerHTML=window.marked?marked.parse(md):md;
    sec.appendChild(body);doc.appendChild(sec);
    var a=document.createElement('a');a.href='#'+id;a.textContent=title;toc.appendChild(a);
  });
  document.getElementById('copy-all').addEventListener('click',function(){copy('# '+'BlueStaffyUK Rebuild — Project 4 of 6: plan'+'\n\n'+all.join('\n\n'),document.getElementById('all-status'));});
})();
</script>
