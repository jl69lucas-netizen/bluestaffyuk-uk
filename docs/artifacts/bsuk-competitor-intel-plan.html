<script type="text/markdown" data-title="Execution notes (read before Task 1)">
- **Plan refinements of the spec.**
  1. §4 "root domains only (no subdomain but `www` stripped)": a script cannot tell `shop.example.com` from `example.co.uk` without a public-suffix list, so the check enforces lowercase, no scheme, no path, no port and no leading `www.`; choosing the registrable domain is the registry agent's job and its board shows it to the user.
  2. §4 priority is **re-derived** by `competitor_registry_check.py` from `seed_hits` and `tier`; a typed priority that disagrees fails the check.
  3. §6 "reads `data/page-map.json`": BSUK's side of the matrix comes from a BSUK profile, `docs/research/competitors/bsuk.json`, written by the intel agent against the local build in the same shape as a competitor report. The page map describes migrated pages, not page types, so it cannot say what BSUK covers. The keyword-gap agent (§7) still reads the page map.
  4. §10 as merged: no new spend-guard source names; Task 4 only pins the conventions with tests.
  5. §12 link guard: `competitor_registry_check.py` scans `src/`, `data/boards/` and `docs/reference/external-link-library.md` for any URL whose host is a `link_allowed: false` domain. It runs before a build, so it does not read `dist/`.
- **The checks pass on an empty repo.** Until the pilot writes `data/competitors.json` and reports, `check:competitors` and `check:gaps` print "nothing to check" and exit 0.
- **Fact lint applies to every new agent line** (`tests/py/test_agent_facts.py`). Only locked £ amounts (£500, £1,500, £1,700, £200, £350, £200–£350, £1,500–£1,700); no number next to "years" except 12–14; "DEFRA" only beside "transport"; none of the banned tokens (US regulators, US states, the old city, parrot vocabulary). The marker gate (`npm run check:markers`) bans `parrot`, `african grey`, `congo`, `clutch`, `cag-` and the rest. It scans `CLAUDE.md`, `rules/`, `docs/reference/`, `tests/render/` and every `dst` in `data/port-manifest.json` — so the five new agents enter its scope only in Task 10, when their manifest rows point at them. Until then each agent task also runs `grep -ciE 'parrot|african grey|congo|clutch|timneh|(^|[^a-z0-9])cag-' <agent file>` and expects 0. Refer to "the source repo", never to its file names.
- **Registries.** Any task that adds a script, a schema, a `data/` file or an agent runs `python3 scripts/build_system_registry.py` (and, for agents, `python3 scripts/build_agent_registry.py`) before committing, or `npm run registry` / `npm run agents` fails.
- **Agents are written with `superpowers:writing-skills`.** RED: dispatch a subagent with the task and the fixture inputs named in the task but WITHOUT the agent file; record where it goes wrong. GREEN: the same scenario with the agent file; it must pass every check listed. No paid call and no Firecrawl call is made in RED/GREEN — the fixtures stand in for fetches.
- **Paid calls happen only in Task 11**, and only after the user gives the dashboard balance and says yes.

# tests/py/test_competitors_registry.py — scripts/competitor_registry_check.py
# (spec 2026-09-23-competitor-intel §4, §12). Every test builds its own root under tmp_path.
import copy
import json
import pathlib
import subprocess
import sys

import pytest

REPO = pathlib.Path(__file__).resolve().parents[2]
sys.path.insert(0, str(REPO / "scripts"))
import competitor_registry_check as C  # noqa: E402

SCRIPT = REPO / "scripts" / "competitor_registry_check.py"
CITIES = ["Manchester", "Leeds", "Carlisle"]


def entry(**over):
    e = {"id": "pets4homes", "name": "Pets4Homes", "root_domain": "pets4homes.co.uk",
         "tier": 2,
         "seed_hits": [{"keyword": f"k{i}", "position": 1} for i in range(5)],
         "cities": ["Manchester"], "priority": "high", "link_allowed": True,
         "last_analyzed": None, "notes": ""}
    e.update(over)
    return e


def registry(*entries):
    entries = list(entries) or [entry()]
    return {"_meta": {"last_discovery_run": "2026-09-24", "seed_keywords": ["k0"],
                      "total": len(entries)},
            "competitors": entries}


def make_root(tmp_path, reg=None):
    (tmp_path / "data").mkdir(parents=True, exist_ok=True)
    (tmp_path / "data/locations.json").write_text(
        json.dumps([{"slug": c.lower(), "city": c} for c in CITIES]))
    if reg is not None:
        (tmp_path / "data/competitors.json").write_text(json.dumps(reg))
    return tmp_path


def test_a_valid_registry_has_no_problems(tmp_path):
    assert C.problems(registry(), make_root(tmp_path)) == []


def test_a_schema_error_is_reported_with_its_path(tmp_path):
    e = entry()
    del e["link_allowed"]
    out = C.problems(registry(e), make_root(tmp_path))
    assert out and all(p.startswith("schema:") for p in out)
    assert any("link_allowed" in p for p in out)


def test_the_id_bsuk_is_reserved_for_the_profile(tmp_path):
    out = C.problems(registry(entry(id="bsuk")), make_root(tmp_path))
    assert any(p.startswith("schema:") for p in out)


def test_more_than_thirty_is_refused(tmp_path):
    many = [entry(id=f"c{i}", root_domain=f"c{i}.co.uk") for i in range(31)]
    out = C.problems(registry(*many), make_root(tmp_path))
    assert any("30 at most" in p for p in out)


def test_total_must_equal_the_entry_count(tmp_path):
    reg = registry()
    reg["_meta"]["total"] = 7
    assert any("total" in p for p in C.problems(reg, make_root(tmp_path)))


@pytest.mark.parametrize("domain", ["https://a.co.uk", "a.co.uk/puppies", "www.a.co.uk",
                                    "A.co.uk", "a.co.uk:443", "localhost"])
def test_root_domain_is_bare(tmp_path, domain):
    out = C.problems(registry(entry(root_domain=domain)), make_root(tmp_path))
    assert any("bare root domain" in p for p in out), out


def test_the_sites_own_domain_is_refused(tmp_path):
    out = C.problems(registry(entry(root_domain="bluestaffyuk.co.uk")), make_root(tmp_path))
    assert any("own domain" in p for p in out)


def test_duplicate_domains_and_ids_are_refused(tmp_path):
    a = entry()
    b = entry(id="other")
    c = entry(root_domain="other.co.uk")
    out = C.problems(registry(a, b, c), make_root(tmp_path))
    assert any("duplicate root_domain" in p for p in out)
    assert any("duplicate id" in p for p in out)


def test_a_suspect_seller_may_not_be_linkable(tmp_path):
    out = C.problems(registry(entry(tier=5, link_allowed=True, priority="high")),
                     make_root(tmp_path))
    assert any("tier 5" in p for p in out)


def test_a_city_outside_locations_json_is_refused(tmp_path):
    out = C.problems(registry(entry(cities=["Springfield"])), make_root(tmp_path))
    assert any("Springfield" in p for p in out)


@pytest.mark.parametrize("hits,tier,expected", [
    ([("a", 9), ("b", 9), ("c", 9), ("d", 9), ("e", 9)], 2, "high"),   # 5+ keywords
    ([("a", 2)], 1, "high"),                                          # breeder in the top 3
    ([("a", 2)], 2, "low"),                                           # top 3, not a breeder
    ([("a", 9), ("b", 9)], 3, "medium"),
    ([("a", 9), ("a", 4)], 3, "low"),                                 # one distinct keyword
])
def test_priority_is_derived_from_seed_hits(hits, tier, expected):
    e = entry(tier=tier, seed_hits=[{"keyword": k, "position": p} for k, p in hits])
    assert C.derived_priority(e) == expected


def test_a_typed_priority_that_disagrees_fails(tmp_path):
    e = entry(priority="low")   # five distinct keywords → high
    out = C.problems(registry(e), make_root(tmp_path))
    assert any("priority" in p and "high" in p for p in out)


def test_a_link_to_a_suspect_seller_is_found(tmp_path):
    root = make_root(tmp_path)
    reg = registry(entry(), entry(id="bad", root_domain="bad.co.uk", tier=5,
                                  link_allowed=False, priority="high"))
    page = root / "src/pages/x/index.astro"
    page.parent.mkdir(parents=True)
    page.write_text('<p>see <a href="https://www.bad.co.uk/pups">this</a></p>\n')
    out = C.suspect_links(reg, root)
    assert len(out) == 1 and "src/pages/x/index.astro:1" in out[0] and "bad.co.uk" in out[0]


def test_a_link_to_an_allowed_competitor_or_a_lookalike_is_fine(tmp_path):
    root = make_root(tmp_path)
    reg = registry(entry(), entry(id="bad", root_domain="bad.co.uk", tier=5,
                                  link_allowed=False, priority="high"))
    (root / "docs/reference").mkdir(parents=True)
    (root / "docs/reference/external-link-library.md").write_text(
        "https://pets4homes.co.uk/a\nhttps://notbad.co.uk/b\n")
    assert C.suspect_links(reg, root) == []


def test_cli_passes_with_no_registry(tmp_path):

    assert r.returncode == 1 and "not valid JSON" in r.stdout


def test_the_real_repo_passes():
    r = subprocess.run([sys.executable, str(SCRIPT)], capture_output=True, text=True)
    assert r.returncode == 0, r.stdout + r.stderr

```python
#!/usr/bin/env python3
"""competitor_registry_check.py — data/competitors.json is well formed, and nothing links a
competitor the registry marks `link_allowed: false`.

  python3 scripts/competitor_registry_check.py [--root DIR]
      exit 0 ok, or no registry yet (says "nothing to check") · 1 problems (listed)

What a schema cannot say is checked here: at most 30 entries, `_meta.total` equals the count,
bare root domains, never the site's own domain, no duplicate id or domain, tier 5 never
linkable, cities only from data/locations.json, and a priority that matches the one derived
from `seed_hits` — the registry agent types it, this script re-derives it.

Spec: docs/superpowers/specs/2026-09-23-competitor-intel-design.md §4, §12.
"""
import argparse
import json
import pathlib
import re
import sys

import jsonschema

ROOT = pathlib.Path(__file__).resolve().parent.parent
SCHEMA = ROOT / "schemas/competitors.schema.json"
MAX_ENTRIES = 30
OWN_DOMAIN = "bluestaffyuk"
# lowercase labels separated by dots, at least two labels, nothing else: no scheme, path,
# port or upper case. A leading `www.` is refused separately so the message can say why.
BARE = re.compile(r"[a-z0-9-]+(?:\.[a-z0-9-]+)+")
LINK_SCAN = ("src", "data/boards", "docs/reference/external-link-library.md")
LINK_SUFFIXES = {".astro", ".md", ".mdx", ".json", ".ts", ".js", ".html"}
URL = re.compile(r"https?://([^/\s\"'<>)\]]+)", re.I)


def derived_priority(c):
    """high: 5+ distinct seed keywords, or a tier-1 breeder in the top 3 · medium: 2–4 · low: 1."""
    keywords = {h["keyword"] for h in c["seed_hits"]}
    if len(keywords) >= 5 or (c["tier"] == 1 and min(h["position"] for h in c["seed_hits"]) <= 3):
        return "high"
    return "medium" if len(keywords) >= 2 else "low"


def _cities(root):
    return {row["city"] for row in json.loads((root / "data/locations.json").read_text(encoding="utf-8"))}


def problems(reg, root=ROOT):
    schema = json.loads(SCHEMA.read_text(encoding="utf-8"))
    errors = sorted(jsonschema.Draft202012Validator(schema).iter_errors(reg), key=lambda e: list(e.path))
    if errors:
        return [f"schema: {'/'.join(map(str, e.path)) or '(root)'}: {e.message}" for e in errors]
    out, comps = [], reg["competitors"]
    if len(comps) > MAX_ENTRIES:
        out.append(f"{len(comps)} competitors; the registry holds 30 at most")
    if reg["_meta"]["total"] != len(comps):
        out.append(f"_meta.total is {reg['_meta']['total']} but there are {len(comps)} entries")
    known, ids, domains = _cities(root), set(), set()
    for c in comps:
        cid, d = c["id"], c["root_domain"]
        if d.startswith("www.") or not BARE.fullmatch(d):
            out.append(f"{cid}: root_domain {d!r} is not a bare root domain "
                       "(lowercase, no scheme, path, port or www.)")
        if OWN_DOMAIN in d:
            out.append(f"{cid}: {d} is the site's own domain")
        if d in domains:
            out.append(f"{cid}: duplicate root_domain {d}")
        if cid in ids:
            out.append(f"duplicate id {cid}")
        ids.add(cid)
        domains.add(d)
        if c["tier"] == 5 and c["link_allowed"]:
            out.append(f"{cid}: tier 5 (suspect seller) must have link_allowed false")
        for city in c["cities"]:
            if city not in known:
                out.append(f"{cid}: city {city!r} is not in data/locations.json")
        want = derived_priority(c)
        if c["priority"] != want:
            out.append(f"{cid}: priority {c['priority']} but seed_hits give {want}")
    return out


def _host_is(host, domain):
    host = host.lower().split(":")[0]
    return host == domain or host.endswith("." + domain)


def suspect_links(reg, root=ROOT):
    banned = {c["root_domain"] for c in reg["competitors"] if not c["link_allowed"]}
    if not banned:
        return []
    out = []
    for rel in LINK_SCAN:
        base = root / rel
        if base.is_file():
            files = [base]
        elif base.is_dir():
            files = sorted(p for p in base.rglob("*") if p.is_file() and p.suffix in LINK_SUFFIXES)
        else:
            files = []
        for f in files:
            text = f.read_text(encoding="utf-8", errors="replace")
            for n, line in enumerate(text.splitlines(), 1):
                for host in URL.findall(line):
                    for d in sorted(banned):
                        if _host_is(host, d):
                            out.append(f"{f.relative_to(root).as_posix()}:{n}: links {host} "
                                       f"({d} is link_allowed false)")
    return out


def main(argv=None):
    ap = argparse.ArgumentParser()
    ap.add_argument("--root", type=pathlib.Path, default=ROOT)
    root = ap.parse_args(argv).root
    path = root / "data/competitors.json"
    if not path.is_file():
        print("competitors: no data/competitors.json yet — nothing to check")
        return 0
    try:
        reg = json.loads(path.read_text(encoding="utf-8"))
    except (OSError, ValueError, UnicodeDecodeError) as exc:
        print(f"competitors: data/competitors.json is not valid JSON: {exc}")
        return 1
    out = problems(reg, root)
    if not out:
        out = suspect_links(reg, root)
    for p in out:
        print(f"competitors: {p}")
    print(f"competitors: {len(reg.get('competitors', []))} entries; {len(out)} problems")
    return 1 if out else 0


if __name__ == "__main__":
    sys.exit(main())

```python
#!/usr/bin/env python3
"""gap_matrix.py — the competitive gap matrix, built from the intel reports, never typed.

  python3 scripts/gap_matrix.py --write [--date YYYY-MM-DD] [--root DIR]
      writes docs/research/gap-matrix-<date>.md (date: today, UTC) · exit 0
  python3 scripts/gap_matrix.py --check [--root DIR]
      rebuilds the newest gap-matrix-<date>.md and compares · exit 0 same, or nothing written
      and no reports · 1 differs, or reports exist with no matrix
  Every mode: 2 bad usage · 6 a report is unreadable or breaks schemas/competitor-report.schema.json

Reads docs/research/competitors/*.json (bsuk.json is BSUK's own profile) and, when present,
data/competitors.json to name registry entries with no report. A row's N/M counts only the
competitors whose field was fetched; the ones that were not are their own column.

Spec: docs/superpowers/specs/2026-09-23-competitor-intel-design.md §6.
"""
import argparse
import datetime
import json
import pathlib
import re
import sys
from collections import Counter
from dataclasses import dataclass

import jsonschema

ROOT = pathlib.Path(__file__).resolve().parent.parent
SCHEMA = ROOT / "schemas/competitor-report.schema.json"
REPORTS = "docs/research/competitors"
OUT_DIR = "docs/research"
DIMENSIONS = (("keywords", "Keyword gaps"), ("page_types", "Page-type gaps"),
              ("cities", "City gaps"), ("schema_types", "Schema gaps"))
QUEUE_LEN = 10
EXIT_OK, EXIT_FAIL, EXIT_USAGE, EXIT_BAD_INPUT = 0, 1, 2, 6


class BadReport(Exception):
    pass


@dataclass(frozen=True)
class Row:
    dimension: str
    value: str
    n: int
    m: int
    not_fetched: int
    bsuk_has: str      # "yes" · "no" · "not fetched"
    band: str          # "high" · "medium" · "low" · "—" (BSUK has it)


def _norm(v):
    return re.sub(r"\s+", " ", v.strip().lower())


def values(report, dim):
    """The set a report holds for one dimension, or None when that field was not fetched."""
    field = report[dim]
    if field["status"] != "ok":
        return None
    if dim == "page_types":
        return {k for k, count in field["values"].items() if count > 0}
    if dim == "cities":
        return set(field["values"])
    return {_norm(v) for v in field["values"]}


def load_reports(root=ROOT):
    schema = json.loads(SCHEMA.read_text(encoding="utf-8"))
    validator = jsonschema.Draft202012Validator(schema)
    bsuk, comps = None, {}
    for path in sorted((pathlib.Path(root) / REPORTS).glob("*.json")):
        try:
            data = json.loads(path.read_text(encoding="utf-8"))
        except (OSError, ValueError, UnicodeDecodeError) as exc:
            raise BadReport(f"{path.name}: not valid JSON: {exc}")
        errors = list(validator.iter_errors(data))
        if errors:
            raise BadReport(f"{path.name}: {errors[0].message}")
        if data["id"] != path.stem:
            raise BadReport(f"{path.name}: id {data['id']!r} does not match the file name")
        if data["id"] == "bsuk":
            bsuk = data
        else:
            comps[data["id"]] = data
    return bsuk, comps


def priority(n, m):
    share = n / m
    return "high" if share >= 0.4 else "medium" if share >= 0.2 else "low"


def rows(bsuk, comps, dim):
    fetched = [values(c, dim) for c in comps.values()]
    held = [v for v in fetched if v is not None]
    m, not_fetched = len(held), len(fetched) - len(held)
    counts = Counter(v for vs in held for v in vs)
    ours = values(bsuk, dim) if bsuk else None
    out = []
    for value, n in counts.items():
        has = "not fetched" if ours is None else ("yes" if value in ours else "no")
        out.append(Row(dim, value, n, m, not_fetched, has,
                       "—" if has == "yes" else priority(n, m)))
    return sorted(out, key=lambda r: (-r.n, r.value))


def queue(bsuk, comps):
    order = {d: i for i, (d, _) in enumerate(DIMENSIONS)}
    gaps = [r for d, _ in DIMENSIONS for r in rows(bsuk, comps, d) if r.bsuk_has != "yes"]
    return sorted(gaps, key=lambda r: (-r.n / r.m, -r.n, order[r.dimension], r.value))[:QUEUE_LEN]


def _registry_ids(root):
    path = pathlib.Path(root) / "data/competitors.json"
    if not path.is_file():
        return None
    return [c["id"] for c in json.loads(path.read_text(encoding="utf-8")).get("competitors", [])]


def render(root, date):
    bsuk, comps = load_reports(root)
    lines = [f"# Competitive gap matrix — {date}", "",
             "Built by `scripts/gap_matrix.py` from `docs/research/competitors/*.json`. Do not edit "
             "by hand: `npm run check:gaps` rebuilds it and fails on any difference.", "",
             f"Competitor reports: {len(comps)} · BSUK profile: "
             f"{'present' if bsuk else 'missing — every BSUK column reads not fetched'}"]
    ids = _registry_ids(root)
    if ids is not None:
        missing = [i for i in ids if i not in comps]
        extra = sorted(i for i in comps if i not in ids)
        lines.append(f"Registry entries: {len(ids)}")
        if missing:
            lines.append(f"No report yet: {', '.join(missing)}")
        if extra:
            lines.append(f"Report with no registry entry: {', '.join(extra)}")
    for dim, title in DIMENSIONS:
        lines += ["", f"## {title}", ""]
        found = rows(bsuk, comps, dim)
        if not found:
            lines.append("_No rows._")
            continue
        lines += ["| Value | Competitors | Not fetched | BSUK has it | Priority |",
                  "|---|---|---|---|---|"]
        lines += [f"| {r.value} | {r.n}/{r.m} | {r.not_fetched} | {r.bsuk_has} | {r.band} |"
                  for r in found]
    lines += ["", "## Priority queue", ""]
    q = queue(bsuk, comps)
    lines += [f"{i}. {r.dimension} `{r.value}` — {r.n}/{r.m} competitors; BSUK: {r.bsuk_has}"
              for i, r in enumerate(q, 1)] or ["_No gaps._"]
    return "\n".join(lines) + "\n"


def _latest(root):
    found = sorted((pathlib.Path(root) / OUT_DIR).glob("gap-matrix-*.md"))
    return found[-1] if found else None


def main(argv=None):
    ap = argparse.ArgumentParser()
    mode = ap.add_mutually_exclusive_group(required=True)
    mode.add_argument("--write", action="store_true")
    mode.add_argument("--check", action="store_true")
    ap.add_argument("--date")
    ap.add_argument("--root", type=pathlib.Path, default=ROOT)
    try:
        a = ap.parse_args(argv)
    except SystemExit:
        return EXIT_USAGE
    root = a.root
    try:
        if a.write:
            date = a.date or datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
            if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", date):
                print(f"gaps: --date must be YYYY-MM-DD, got {date!r}")
                return EXIT_USAGE
            out = root / OUT_DIR / f"gap-matrix-{date}.md"
            out.parent.mkdir(parents=True, exist_ok=True)
            out.write_text(render(root, date), encoding="utf-8")
            print(f"gaps: wrote {out.relative_to(root).as_posix()}")
            return EXIT_OK
        latest = _latest(root)
        has_reports = any((root / REPORTS).glob("*.json"))
        if latest is None:
            if has_reports:
                print("gaps: intel reports exist but no gap matrix — run gap_matrix.py --write")
                return EXIT_FAIL
            print("gaps: no reports and no gap matrix yet — nothing to check")
            return EXIT_OK
        date = latest.stem.removeprefix("gap-matrix-")
        if latest.read_text(encoding="utf-8") != render(root, date):
            print(f"gaps: {latest.name} differs from the reports — rerun gap_matrix.py --write "
                  f"--date {date}, never edit it by hand")
            return EXIT_FAIL
        print(f"gaps: {latest.name} matches the reports")
        return EXIT_OK
    except BadReport as exc:
        print(f"gaps: bad report: {exc}")
        return EXIT_BAD_INPUT


if __name__ == "__main__":
    sys.exit(main())

#!/usr/bin/env python3
"""strategy_cite_check.py — a strategy may quote only figures its listed sources contain.

  python3 scripts/strategy_cite_check.py STRATEGY.md [--root DIR]
      exit 0 every figure found · 1 problems (listed) · 2 the file is missing or bad usage

A figure is an N/M count, a percentage, a decimal, or a whole number of two digits or more,
in a `## Recommendation…` or `## Concrete Artifact…` section. Dates, anything in backticks,
single digits (step numbers, "3+ data points") and 28 (the locked city count) are not
figures. Each figure must appear literally in at least one file listed as a backticked path
under `## Sources`, and every listed file must exist. The strategy agent quotes a source's
figure exactly as the source writes it.

Spec: docs/superpowers/specs/2026-09-23-competitor-intel-design.md §9.
"""
import argparse
import pathlib
import re
import sys

ROOT = pathlib.Path(__file__).resolve().parent.parent
CHECKED = ("Recommendation", "Concrete Artifact")
ALWAYS_TRUE = {"28"}
CODE = re.compile(r"`[^`]*`")
DATE = re.compile(r"\b\d{4}-\d{2}-\d{2}\b")
FIGURE = re.compile(r"(?<![\w.,/-])(\d+/\d+|\d+(?:\.\d+)?%|\d+\.\d+|\d{1,3}(?:,\d{3})+|\d{2,})(?![\w/-]|[.,]\d)")
SOURCE_LINE = re.compile(r"^\s*[-*]\s+`([^`]+)`")


def check(path, root=ROOT):
    lines = pathlib.Path(path).read_text(encoding="utf-8").splitlines()
    section, sources, found = None, [], []
    has_sources = has_recommendation = False
    for i, line in enumerate(lines, 1):
        if line.startswith("## "):
            section = line[3:].strip()
            has_sources |= section == "Sources"
            has_recommendation |= section.startswith("Recommendation")
            continue
        if section == "Sources":
            m = SOURCE_LINE.match(line)
            if m:
                sources.append(m.group(1))
        elif section and section.startswith(CHECKED):
            text = DATE.sub(" ", CODE.sub(" ", line))
            found += [(i, section, f) for f in FIGURE.findall(text) if f not in ALWAYS_TRUE]
    out = []
    if not has_sources or not sources:
        out.append("no ## Sources section listing backticked files")
    if not has_recommendation:
        out.append("no ## Recommendation section")
    corpus = []
    for s in sources:
        p = pathlib.Path(root) / s
        if p.is_file():
            corpus.append(p.read_text(encoding="utf-8", errors="replace"))
        else:
            out.append(f"source {s} does not exist")
    for i, section, fig in found:
        if not any(fig in text for text in corpus):
            out.append(f"line {i} ({section}): figure {fig} is in no listed source")
    return out


def main(argv=None):
    ap = argparse.ArgumentParser()
    ap.add_argument("strategy", type=pathlib.Path)
    ap.add_argument("--root", type=pathlib.Path, default=ROOT)
    try:
        a = ap.parse_args(argv)
    except SystemExit:
        return 2
    if not a.strategy.is_file():
        print(f"cite-check: {a.strategy} does not exist")
        return 2
    out = check(a.strategy, a.root)
    for p in out:
        print(f"cite-check: {p}")
    print(f"cite-check: {a.strategy.name}: {len(out)} problems")
    return 1 if out else 0


if __name__ == "__main__":
    sys.exit(main())
```

---
name: bsuk-competitor-registry
description: Discovers the national list of BlueStaffyUK competitors — UK Staffy breeders, marketplaces and directories, breed-information sites, rescues, and suspect sellers — from about ten seed keywords, proposes it on a board for the user's approval, and only then writes data/competitors.json. Run once to seed the registry, then when intel or a page build finds a new site ranking. Every other competitor agent reads its output.

<script type="text/markdown" data-title="Golden Rule">
> **Bound by the site rules, not by a copy of them:** `CLAUDE.md` and the packs in `rules/`. No invented facts: a competitor is registered only from a search result you actually fetched, and every field is either fetched or left out.
> **Paid calls go through the spend guard.** Before every DataForSEO call run `python3 scripts/query_augment.py --preflight <pseudo-slug> --source serp_google`; exit 3 means cached (reuse it), exit 4 means stop and ask the user. Straight after a paid call, `--record` it with the configured typical cost and say that it is an estimate.
</script>
<script type="text/markdown" data-title="Purpose">
You find who ranks for Staffordshire Bull Terrier puppy searches in the UK and write the national registry, `data/competitors.json` (contract `schemas/competitors.schema.json`). The per-page pools in `data/queries/<slug>.json` stay as they are; this is the list the gap matrix counts against.
</script>
<script type="text/markdown" data-title="On Startup">
1. Read `data/competitors.json` if it exists. Empty or absent → full discovery. Otherwise do what the invocation says (add, refresh, or full re-discovery); if it says nothing, add new sites only and say so in your first line.
2. Read `data/locations.json` — the 28 cities. It is the only city list.
3. Ask the controller for the DataForSEO balance if nobody has stated it today. Estimated cost of a full discovery: ten searches.
</script>
<script type="text/markdown" data-title="Seed keywords">
1. `blue staffy puppies for sale`
2. `staffordshire bull terrier puppies for sale uk`
3. `blue staffy breeder`
4. `staffy puppies for sale <city>` for the five largest cities in `data/locations.json` (five searches)
5. `kc registered staffy puppies`
6. `staffy puppy price uk`

Record the final list in `_meta.seed_keywords`.
</script>
<script type="text/markdown" data-title="Discovery">
For each seed keyword:

1. Pseudo-slug `registry-<keyword as a slug>` (lowercase, spaces to hyphens, only `a-z0-9-`).
2. Preflight as in the Golden Rule. Exit 0 → DataForSEO `serp_organic_live_advanced`, Google, location United Kingdom, English, depth 10. Save the untouched response to `data/queries/raw/<pseudo-slug>/serp_google.response.json`, then `--record`.
3. If the connector is missing, out of credit, or the user declines: `firecrawl_search` with the same keyword (limit 10). Note `fallback` for that keyword.
4. Never use Bing: it is not bought (the query-augmentation pilot returned results for "blue" alone).
</script>
<script type="text/markdown" data-title="Group and classify">
1. Reduce every URL to its registrable root domain: drop scheme, path, port and any subdomain (`www.pets4homes.co.uk` and `shop.pets4homes.co.uk` are both `pets4homes.co.uk`). Never register the site's own domain.
2. Merge by root domain. `seed_hits` lists each keyword it appeared on with its best position.
3. Tier:

| Tier | Meaning | Examples of signals |
|---|---|---|
| 1 | Breeder | Own domain, sells its own litters |
| 2 | Marketplace or directory | Many sellers' listings: Pets4Homes, Champdogs, the Kennel Club's puppy search |
| 3 | Breed information | Guides, breed clubs, no puppies for sale |
| 4 | Rescue or non-commercial | Rehoming, charities |
| 5 | Suspect seller | Signs of a puppy farm or scam on the page you fetched: prices far below the market with "no questions asked", no location, pressure to pay before viewing, stolen or stock photos. Tracked for contrast, `link_allowed: false`, never linked from any page |

4. Priority — the check re-derives it, so compute it the same way: **high** when found on 5+ distinct seed keywords, or a tier-1 breeder in the top 3 on any keyword; **medium** on 2–4 keywords; **low** on 1.
5. Keep about 25, at most 30: highest priority first, then most keywords, then best position. Aim for a spread: roughly 10 breeders, 6 marketplaces and directories, 4 information sites, 2 rescues, and every suspect seller you found (up to 3).
6. `cities`: only cities from `data/locations.json` that the site's result or page title names. Leave it empty rather than guess.
</script>
<script type="text/markdown" data-title="Approval">
Present the proposed list as a board (the repo's board system, one row per competitor with domain, tier, keywords found on, best position, priority and why it got its tier). Wait for "approved". Only then write `data/competitors.json` with `_meta.total` equal to the entry count and `last_analyzed: null`.

</script>
<script type="text/markdown" data-title="Handoff">

</script>
<script type="text/markdown" data-title="Rules">
1. No entry without a fetched search result behind it.
2. Approval before writing, every time.
3. Root domains only; one entry per domain.
4. Tier 5 is never linkable.
5. Every paid call preflighted and recorded; Bing never bought.
