<script type="text/markdown" data-title="Summary">
**Question asked (2026-09-26):** BSUK's agents, skills and rules were built from CAG's. The CAG
*Universal Page Build Brief* (v2.0, 26 sections) is the workflow CAG runs before building a page.
Does BSUK carry every rule, sprint, workflow step and gate in it, and what must be added before
project 5?

**Source:** https://claude.ai/code/artifact/f63b8e4f-3bf0-43e7-af6e-7632255cdfe0 · **Repo:**
`foundation` @ `0454a96` · **Branch for this work:** `cag-parity`
</script>
<script type="text/markdown" data-title="Verdict">
**BSUK has most of the brief. What it lacks is the per-page run and the proof that its gates can
see project 5's pages.**

| | Items | Share |
|---|---|---|
| PRESENT | 217 | 51% |
| PARTIAL | 121 | 29% |
| MISSING | 39 | 9% |
| N/A — CAG-only or a deliberate, recorded BSUK difference | 46 | 11% |
| **Total** | **423** | |

Three things stand out:

1. **Every step of the brief exists somewhere in BSUK, but there is no single per-page run
   sheet.** You described the brief as "a workflow before I build a page". BSUK has the parts: the
   builder skill, the page board (one board approval covers CAG gates 2–5), `board_approve.py`,
   the gates, and the session closer. What it lacks is one ordered run for each page: an intake
   block, a `gate:page <slug>` runner that runs every gate twice, and a close-out that prints the
   measurement numbers.
2. **Several gates would pass project 5 pages without looking at them.** New pages are not added
   to the render targets. The zero-examined guard only runs when someone remembers to run it. The
   H3 image-first check matches a CSS class the real pages do not use. The hardening scan reads 2
   files for a city page. And `board_gate` (the Asset Gate) is not part of `check:all`. CAG
   learned this the hard way: its blocking contrast check examined zero nodes for a full day.
3. **Correction (user ruling, 2026-09-26):** `impeccable` and `frontend-design` are mandatory on
   every page. The §0–5 auditor had marked them "skip"; they are now a Wave 4 gap (21b).
4. **Six live defects or fabrication risks came up**, and I confirmed each one in the repo
   myself. They are listed below.
</script>
<script type="text/markdown" data-title="How this was checked">
Four Opus auditors each took one band of sections (§0–5, §6–12, §13–18, §19–26). Each checked
every item, checkbox and metric in the brief against BSUK's `CLAUDE.md`, `rules/`, `WORKFLOW.md`,
skills, agents, scripts, tests and `package.json`. Every item got a verdict with a file:line, and
each PRESENT item is marked either *enforced* (a check fails when the rule is broken) or
*text-only*. CAG facts were judged by their BSUK equivalent: £ prices instead of $ prices,
Carlisle instead of Midland, steel/brass/bone instead of green/clay. The repo was only read. The
controller re-checked the sharpest claims from each band in the repo before trusting them
(marked ✔ below).

The full item-by-item tables are Appendices A–D.
</script>

<script type="text/markdown" data-title="Your framing: the per-page workflow">
CAG runs one brief per page, in order: Target Block, then seven sprints with their gates, then
close. BSUK spreads the same run across files:

| CAG step | BSUK today | Gap |
|---|---|---|
| §0 Target Block | Board header + `data/facts/rebuilt.json` | No auto-filled intake: page state, robots, verbatim count, empty `h1`, question file, retired-term hits |
| §4 URL gate | `redirect_check.py` (enforced) | No decision table for each URL family |
| §5 Data inventory | — | No step at all |
| Sprints 0–1 | `bsuk-query-augmentation` → board (one approval) | Competitor metrics discarded; no keyword or entity numbers |
| Asset Gate | `board_gate.py` + sha-bound image approvals | Not in `check:all` — easy to skip |
| Sprints 2–3 | Builder skill + `page_hardening_scan.py` | Scan misses city pages and the kit; **impeccable and frontend-design never run** |
| Sprint 4 | Many gates, each run by hand | No `gate:page <slug>`; "run twice" not a rule |
| Sprint 5 | `bsuk-llm-keyword-intel` | No score |
| Sprint 6 | `session-closer` + gate report | No measurement ledger; IndexNow cannot see city pages |

**Recommended:** add `docs/reference/page-run.md` as the single ordered per-page checklist, and
back each row with a command. This means an intake block on the board, `npm run gate:page --
<slug>` (every page gate, run twice, then diffed), and `scripts/measurement_ledger.py` at close.
**Why:** project 5 runs this sequence 30+ times. A run that lives across 12 files is the one that
gets skipped on page 14. **Trade-off:** one more document to keep current. The
`check:workflow` guard already fails on dead references, so it cannot silently rot.
</script>

<script type="text/markdown" data-title="Gaps to close before project 5">
Grouped into four waves, easiest first. Each item names the CAG section and the audit row.

| # | Change | CAG § | Why before project 5 |
|---|---|---|---|
| 1 | Delete the invented method label (D1); add it to the residue lint | 1e | Stops a fabricated claim from being built into 28 pages |
| 2 | City term per slug from `data/locations.json` + a `bluestaffyuk` brand budget (D2) | 8 | Keeps each city page within its own term budget |
| 3 | `PuppyCard` delivery line from `data/settings.json` + `dist/` test (D4) | 16d | Every city page shows prices |
| 4 | Resolve the Rule 18 contradiction (`seo-rules.md:109-122` "hard target" vs `bsuk-keyword-verifier.md:250` "no floor") | 7b | Writers get two different instructions today |
| 5 | `perf_audit.py` defaults to 5 runs and reports the warm median of runs 2–5 with the spread (the docstring already says 5; the code says 1) | 19b, M7 | CLS is bimodal; one run proves nothing |
| 6 | Doc drift: `CLAUDE.md` `check:all` list is missing `check:outline`; `rules/design.md` points at emoji files that do not exist; `WORKFLOW.md:840` calls the evidence ledger empty; `quality_report.py` promises `rework_ledger.py`; the lessons-doc location is never used; rule-index marks table stacking `untested`; the LLM 0–10 score is promised but never computed | 19d, 20, 21, 22 | Stale instructions mislead the agents that will build project 5 |

| # | Change | CAG § | Why |
|---|---|---|---|
| 7 | Retired-facts sweep over `data/`, `src/` and `dist/`: every £ figure in the locked set; "non-refundable", "council-licensed" and the former city outside its slugs are banned (D5) | 1b, M14 | Turns KI 65 into a failing check before 28 bodies are rewritten |
| 8 | Every page in `data/facts/rebuilt.json` must be in `tests/render/targets.json` (pytest); add a `comparison` page type | 17, 19c | Otherwise every blocking render check examines none of the new pages |
| 9 | Run the zero-examined guard (`build_scorecard.mjs`) after `test:render:pages`, plus a meta test: every non-deferred check examines > 0 | 19c, M1 | CAG's most expensive lesson |
| 10 | Chain `board_gate.py` into `check:all` for every rebuilt page | 3, 15c | Makes the Asset Gate mandatory, not optional |

<script type="text/markdown" data-title="Decisions that need you">
| Decision | Options | Recommended |

| **In-body image box** (CAG §15a) | (a) Adopt CAG's uniform 760px 16:9 box + portrait `og-tall` on mobile · (b) keep BSUK's `.bl-img` (full width, 420px cap, natural ratio) and only enforce `sizes` | **(a)** — rule 17 puts an image under every heading on 30+ pages; a fixed box removes CLS risk and makes the H3 image-first check matchable. Trade-off: the 12 built pages keep `.bl-img` until they are touched |
| **Global CTA flag** | (a) Wire `global_cta` so `hidden` hides the footer band · (b) retire the field | **(a)** — the 12 approved boards chose "hidden"; honouring what was approved is the rule. Trade-off: the footer band disappears from 12 built pages |

<script type="text/markdown" data-title="Deliberate differences — do not adopt">
Recorded in BSUK and still correct: work on a project branch and never push until project 6 (CAG:
`main`, push is deploy) · three stop points instead of seven gates · exactly two strategies ·
DataForSEO before Firecrawl · titles ≤70 and descriptions 140–160 (Rule 21) · four counters,
not eight · section count = competitors' highest real H2 count + 3, never 22 · FAQ = three blocks
of 15–20 H3s · locked px type scale, not fluid clamp · ringless rail dial · no seams · one LLM
engine per page · CITES, parrot taxonomy and method labels dropped.
</script>
<script type="text/markdown" data-title="Appendix A — item table, CAG §0–5">
Read-only audit. Every citation was opened or grepped; nothing in the repo was changed or run beyond read-only greps.
"Enforced" names the check that fails when the item is violated. `check:all` = the package.json chain (parity, facts, links, verbatim, outline, redirects, schema, queries, competitors, gaps, sitemaps, placeholders, workflow, markers, agents). The rule ledger `data/quality/rule-index.json` currently holds 79 rows: 50 `test`, 20 `untested`, 9 `judgment`.

---

### §0 · Target Block

| # | CAG item | Verdict | Enforced? | BSUK evidence (file:line) | Recommendation + why |
