```javascript
#!/usr/bin/env node
// node scripts/hero_phone_shots.mjs <out dir>
//
// The hero of every rebuilt page (data/facts/rebuilt.json) at phone width (375×812): one PNG
// per page of the `.kit-hero` element, and <out dir>/heroes.json with, per page, the hero's
// layout and whether the photo paints above the heading. Run it on dist/ before and after a
// hero change and diff the two JSON files to list which phone views changed (the London
// component pass, Plan 1 Task 11). Serves dist/ itself on RENDER_SHOTS_PORT (default 4341),
// so build first. Writes nothing inside the repo unless told to.
import { spawn } from 'node:child_process';
import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
import { resolve } from 'node:path';
import { chromium } from '@playwright/test';

const ROOT = resolve(new URL('..', import.meta.url).pathname);
const OUT = process.argv[2];
if (!OUT) {
  console.error('usage: node scripts/hero_phone_shots.mjs <out dir>');
  process.exit(2);
}
const PORT = Number(process.env.RENDER_SHOTS_PORT ?? 4341);
const slugs = JSON.parse(readFileSync(resolve(ROOT, 'data/facts/rebuilt.json'), 'utf8')).sort();
mkdirSync(OUT, { recursive: true });

const server = spawn('python3', ['-m', 'http.server', String(PORT), '--bind', '127.0.0.1'],
  { cwd: resolve(ROOT, 'dist'), stdio: 'ignore' });
await new Promise((r) => setTimeout(r, 800));
const browser = await chromium.launch();
const rows = [];
try {
  const page = await browser.newPage({ viewport: { width: 375, height: 812 }, deviceScaleFactor: 1 });
  for (const slug of slugs) {
    const path = slug === 'index' ? '/' : `/${slug}/`;
    await page.goto(`http://127.0.0.1:${PORT}${path}`, { waitUntil: 'load' });
    await page.evaluate(() => document.fonts.ready);
    const row = await page.evaluate(() => {
      const hero = document.querySelector('.kit-hero');
      if (!hero) return { hero: false };
      const pic = hero.querySelector('.pic');
      const title = hero.querySelector('.title');
      const pt = pic ? pic.getBoundingClientRect().top : null;
      const tt = title ? title.getBoundingClientRect().top : null;
      return { hero: true, layout: hero.getAttribute('data-hero-layout'),
        media: hero.getAttribute('data-hero-media'),
        photoFirst: pt !== null && tt !== null ? pt < tt : null,
        photoTop: pt === null ? null : Math.round(pt), titleTop: tt === null ? null : Math.round(tt) };
    });
    const file = resolve(OUT, `${slug.replace(/\//g, '--')}.png`);
    // The page from its top to the hero's foot, unscrolled: what a phone reader sees first,
    // with the sticky chrome where it really sits (an element shot scrolls it under the bar).
    if (row.hero) {
      const bottom = await page.evaluate(() =>
        Math.ceil(document.querySelector('.kit-hero').getBoundingClientRect().bottom + window.scrollY));
      await page.screenshot({ path: file, fullPage: true, clip: { x: 0, y: 0, width: 375, height: Math.min(bottom, 2400) } });
    }
    rows.push({ slug, ...row, shot: row.hero ? file : null });
    console.log(`${slug}: ${row.hero ? `${row.layout} photo-first=${row.photoFirst}` : 'no kit hero'}`);
  }
} finally {
  await browser.close();
  server.kill();
}
writeFileSync(resolve(OUT, 'heroes.json'), JSON.stringify(rows, null, 1) + '\n');
console.log(`${rows.length} pages examined -> ${resolve(OUT, 'heroes.json')}`);
```

```typescript
/**
 * THE HERO PHOTO COMES FIRST ON A PHONE (rules/design.md rule 10; the user's answer-board
 * ruling of 2026-09-27: "ALL HEROES images come first on MOBILE").
 *
 * Rule 10 already puts the photo first in SOURCE, and test_design_components.py proves it on
 * the built pages. What nothing measured was the PAINT: the split, bleed and mosaic layouts
 * gave `.pic` `order: 2` at every width, so below 900px — where every arrangement is one
 * column — the phone reader met the heading and the lede first and the photo underneath them.
 *
 * Two readings, split the way layout-table-stacks-on-mobile splits its own, because the meta
 * gate runs every fixture at all three widths and requires the broken one to fire at each:
 *   - SOURCE ORDER, judged at every width: the photo (`.pic`) precedes the heading (`.title`).
 *   - PAINT ORDER, judged where the hero is one column (the document is 900px wide or less):
 *     the photo's top is above the heading's top.
 * The paint half is proven on its own by the `hero-image-first-order-only` fixture in
 * meta.spec.ts, which has the source order right and the paint order wrong.
 *
 * THE UNIT IS ONE HERO with both a photo and a heading. A photoless hero (`media: 'none'`) is
 * not a violation and is not counted.
 */
register({
  id: 'layout-hero-image-first-mobile',
  family: 'LAYOUT',
  severity: 'blocking',
  describe: 'the hero photo precedes the heading in source and paints above it on one-column widths',
  minExamined: 1,
  async run(page: Page, viewport: number): Promise<CheckResult> {
    await settlePage(page);
    const r = await page.evaluate(() => {
      const oneColumn = document.documentElement.clientWidth <= 900;
      let examined = 0;
      const bad: string[] = [];
      for (const hero of Array.from(document.querySelectorAll('.kit-hero'))) {
        const pic = hero.querySelector('.pic');
        const title = hero.querySelector('.title');
        if (!pic || !title) continue;
        const pb = pic.getBoundingClientRect();
        const tb = title.getBoundingClientRect();
        if (pb.width < 1 || pb.height < 1 || tb.width < 1 || tb.height < 1) continue;
        examined++;
        const layout = hero.getAttribute('data-hero-layout') || 'split';
        if (!(title.compareDocumentPosition(pic) & Node.DOCUMENT_POSITION_PRECEDING)) {
          bad.push(`${layout}: the heading precedes the photo in source`);
        } else if (oneColumn && pb.top >= tb.top) {
          bad.push(`${layout}: the photo paints ${Math.round(pb.top - tb.top)}px below the heading's top`);
        }
      }
      return { examined, bad };
    });
    return {
      examined: r.examined,
      defects: r.bad.length
        ? [{
          checkId: 'layout-hero-image-first-mobile',
          family: 'LAYOUT' as const,
          viewport,
          count: r.bad.length,
          message: r.bad.join(' | '),
        }]
        : [],
    };
  },
});
```

```python
"""Working rule 16 for the city pages: the `city` family and the city pool (Known Issue 60;
the London component design pass, Plan 1 Task 12).

A city page takes all fifteen components from its own component pass. Its picks are saved in
data/design/city-picks/<slug>.json, and the gate refuses a pick that another city wears, one
within one structural axis of another city's pick, or one within one axis of an arrangement a
built page wears. The unpicked variants sit in data/design/city-pool.json.
"""
import json
import pathlib
import re
import sys

import pytest

ROOT = pathlib.Path(__file__).resolve().parents[2]
sys.path.insert(0, str(ROOT / "scripts"))
import pageboard as PB  # noqa: E402
from city_components import COMPONENT_IDS  # noqa: E402

TS = ROOT / "src" / "lib" / "boardStyles.ts"

AXES = {
    "london/hero/a": {"layout": "ticket", "media": "top", "density": "airy", "framing": "inset"},
    "london/hero/b": {"layout": "postcard", "media": "left", "density": "regular", "framing": "rule"},
    "leeds/hero/a": {"layout": "ticket", "media": "top", "density": "compact", "framing": "inset"},
    "leeds/hero/b": {"layout": "arch", "media": "right", "density": "compact", "framing": "band"},
}


def axes_of(key):
    return AXES.get(key)


def picks_doc(slug, canvas, hero):
    doc = {"slug": slug, "canvas": canvas, "canvas_url": "https://claude.ai/artifact/abc",
           "approved_at": "2026-09-28T10:00:00Z",
           "picks": {c: f"{canvas}/{c}/a" for c in COMPONENT_IDS}}
    doc["picks"]["hero"] = hero
    return doc


def only_hero(findings):
    return [f for f in findings if f["msg"].startswith("hero")]


def test_the_city_family_is_named_on_both_sides():
    src = TS.read_text(encoding="utf-8")
    union = src.split("export type LayoutType =", 1)[1].split(";", 1)[0]
    assert "'city'" in union
    assert re.search(r"^\s*location: 'city',$", src, re.M)
    schema = json.loads((ROOT / "schemas/board.schema.json").read_text(encoding="utf-8"))
    assert "city" in schema["properties"]["meta"]["properties"]["layout_type"]["enum"]
    assert PB.CITY_FAMILY == "city"


def test_the_city_family_cuts_no_hero_or_counter_trio_here():
    """The eighteen per-page defs stay six families × three; a city is not a seventh trio."""
    src = TS.read_text(encoding="utf-8")
    for const in ("HERO_STYLES_BY_PAGE_TYPE", "COUNTER_STYLES_BY_PAGE_TYPE"):
        body = src.split("export const " + const, 1)[1].split("\n};", 1)[0]
        assert "city" not in re.findall(r"^  '?([a-z-]+)'?:\s*\[\s*$", body, re.M)
        assert body.startswith(": Record<PerPageFamily,")


def test_a_hero_another_city_wears_fails():
    picks = {"london": picks_doc("london", "london", "london/hero/a"),
             "leeds": picks_doc("leeds", "london", "london/hero/a")}
    f = only_hero(PB.city_pick_findings("leeds", picks, {}, axes_of))
    assert [(x["check"], x["msg"]) for x in f] == [
        ("city-pick-shared", "hero london/hero/a is already worn by london (working rule 16)")]


def test_a_hero_one_axis_from_another_citys_pick_fails():
    picks = {"london": picks_doc("london", "london", "london/hero/a"),
             "leeds": picks_doc("leeds", "leeds", "leeds/hero/a")}
    f = only_hero(PB.city_pick_findings("leeds", picks, {}, axes_of))
    assert [x["check"] for x in f] == ["city-pick-too-close"], f


def test_a_hero_two_axes_from_every_other_pick_passes():
    picks = {"london": picks_doc("london", "london", "london/hero/a"),
             "leeds": picks_doc("leeds", "leeds", "leeds/hero/b")}
    assert only_hero(PB.city_pick_findings("leeds", picks, {}, axes_of)) == []


def test_a_hero_one_axis_from_a_worn_built_style_fails_and_an_unworn_one_does_not():
    worn = {"id": "H-GD2", "name": "Magazine", "used_by": ["uk-blue-staffy-puppy-buying-guide"],
            "axes": {"layout": "ticket", "media": "top", "density": None, "framing": "card"}}
    unworn = dict(worn, id="H-AB3", used_by=[])
    picks = {"london": picks_doc("london", "london", "london/hero/a")}
    f = only_hero(PB.city_pick_findings("london", picks, {"hero": [worn]}, axes_of))
    assert [x["check"] for x in f] == ["city-pick-matches-built"], f
    assert "worn by uk-blue-staffy-puppy-buying-guide" in f[0]["msg"]
    assert only_hero(PB.city_pick_findings("london", picks, {"hero": [unworn]}, axes_of)) == []


def test_an_unknown_or_misfiled_pick_fails():
    picks = {"london": picks_doc("london", "london", "london/hero/c")}
    assert [x["check"] for x in only_hero(PB.city_pick_findings("london", picks, {}, axes_of))] \
        == ["city-pick-unknown"]
    picks = {"london": picks_doc("london", "london", "london/tables/a")}
    assert [x["check"] for x in only_hero(PB.city_pick_findings("london", picks, {}, axes_of))] \
        == ["city-pick-malformed"]


def test_a_pool_entry_a_city_picked_fails():
    picks = {"london": picks_doc("london", "london", "london/hero/a")}
    pool = {"available": {c: [] for c in COMPONENT_IDS}}
    pool["available"]["hero"] = ["london/hero/a", "london/hero/b"]
    f = PB.city_pool_findings(pool, picks, axes_of)
    assert [(x["check"], x["msg"]) for x in f] == [
        ("city-pool-picked", "hero: london/hero/a is in the pool and picked by london")]


def _city_board(slug="uk-locations/london"):
    return {"meta": {"slug": slug, "layout_type": "city", "status": "approved"}, "sections": []}


def test_a_city_board_is_judged_by_its_picks_file():
    picks = {"london": picks_doc("london", "london", "london/hero/a"),
             "leeds": picks_doc("leeds", "london", "london/hero/a")}
    pool = {"available": {c: [] for c in COMPONENT_IDS}}
    f = PB.city_rule16_findings(_city_board("uk-locations/leeds"), picks=picks, pool=pool,
                                must_differ={}, axes_of=axes_of)
    assert "city-pick-shared" in [x["check"] for x in f]


def test_a_city_board_without_a_picks_file_fails_and_other_families_are_untouched():
    f = PB.city_rule16_findings(_city_board(), picks={}, pool={"available": {}},
                                must_differ={}, axes_of=axes_of)
    assert [x["check"] for x in f] == ["city-picks-missing"]
    guide = {"meta": {"slug": "x", "layout_type": "interior-guide", "status": "approved"}, "sections": []}
    assert PB.city_rule16_findings(guide, picks={}, pool={}, must_differ={}, axes_of=axes_of) == []


def test_rule16_findings_carries_the_city_findings(monkeypatch):
    monkeypatch.setattr(PB, "load_city_picks", lambda folder=None: {})
    f = PB.rule16_findings(_city_board(), {})
    assert [x["check"] for x in f] == ["city-picks-missing"]


def test_the_picks_schema_refuses_a_missing_or_unknown_component():
    doc = picks_doc("london", "london", "london/hero/a")
    PB._validate(doc, "city-picks.schema.json")
    bad = json.loads(json.dumps(doc))
    del bad["picks"]["newsletter"]
    with pytest.raises(PB.BoardError):
        PB._validate(bad, "city-picks.schema.json")
    bad = json.loads(json.dumps(doc))
    bad["picks"]["carousel"] = "london/carousel/a"
    with pytest.raises(PB.BoardError):
        PB._validate(bad, "city-picks.schema.json")


def test_the_schemas_name_the_fifteen_components():
    for name, path in (("city-picks.schema.json", ("properties", "picks")),
                       ("city-pool.schema.json", ("properties", "available"))):
        node = json.loads((ROOT / "schemas" / name).read_text(encoding="utf-8"))
        for k in path:
            node = node[k]
        assert node["required"] == list(COMPONENT_IDS) == node["propertyNames"]["enum"], name


def test_the_real_pool_and_picks_validate_and_pass():
    picks = PB.load_city_picks()
    pool = PB.load_city_pool()
    assert sorted(pool["available"]) == sorted(COMPONENT_IDS)
    assert PB.city_pool_findings(pool, picks, PB.canvas_axes) == []
    md = json.loads(PB.CITY_MUST_DIFFER.read_text(encoding="utf-8"))["components"]
    for slug in picks:
        assert PB.city_pick_findings(slug, picks, md, PB.canvas_axes) == [], slug

```python
def rule16_findings(board, boards):
    """Board-gate findings for working rule 16's uniqueness half: one FAIL per arrangement this
    record shares outside the utility exemption (RULE16_EXEMPT), plus — for a city page — the
    city pool's findings over all fifteen components (`city_rule16_findings`). Kept out of
    gate_findings(), which is pure over one record; board_gate.py adds these from
    `load_all_boards()`."""
    return ([{"check": "rule16-shared", "sev": "FAIL", "msg": rule16_message(shape, pick, others)}
             for shape, pick, others in rule16_shares(board, boards)]
            + city_rule16_findings(board))


# ── working rule 16 for the city pages: the `city` family and the city pool ────────────────
#
# Known Issue 60: a `location` page mapped to the guide family, whose three heroes the guides
# own, so 28 city pages had three arrangements between them. The user's answer (answer board,
# 2026-09-27, q01 (c)) is a component design pass per city: each city picks one of three new
# variants for each of the fifteen components (scripts/city_components.py) on its own canvas,
# and the picks are saved in data/design/city-picks/<city slug>.json. The unpicked variants go
# to data/design/city-pool.json for later cities. A city pick FAILS when it is another city's
# pick, when it is within one structural axis of another city's pick, or when it is within one
# axis of an arrangement a built page wears (data/design/city-must-differ.json rows with a
# `used_by`). The axes are the canvas's four (city_components.AXES), read from each variant's
# design/city-canvas/<city>/<component>/meta.json.
CITY_FAMILY = "city"
CITY_PICKS_DIR = ROOT / "data" / "design" / "city-picks"
CITY_POOL = ROOT / "data" / "design" / "city-pool.json"
CITY_MUST_DIFFER = ROOT / "data" / "design" / "city-must-differ.json"


def load_city_picks(folder=None):
    """{city slug: picks record} for every data/design/city-picks/*.json, each validated."""
    folder = CITY_PICKS_DIR if folder is None else pathlib.Path(folder)
    out = {}
    for p in sorted(folder.glob("*.json")) if folder.is_dir() else []:
        doc = _read_json(p)
        _validate(doc, "city-picks.schema.json")
        if doc["slug"] != p.stem:
            raise BoardError(f"{p}: slug {doc['slug']!r} does not match its file name")
        out[doc["slug"]] = doc
    return out


def load_city_pool(path=None):
    doc = _read_json(CITY_POOL if path is None else path)
    _validate(doc, "city-pool.schema.json")
    return doc


def canvas_axes(key, canvas_root=None):
    """The four canonical axes of one canvas variant (`<city>/<component>/<a|b|c>`), read from
    that component's meta.json; None when the variant does not exist."""
    from city_components import CANVAS_ROOT
    city, component, variant = key.split("/")
    meta = (CANVAS_ROOT if canvas_root is None else pathlib.Path(canvas_root)) / city / component / "meta.json"
    if not meta.is_file():
        return None
    row = ((_read_json(meta).get("variants") or {}).get(variant) or {})
    return row.get("axes")


def city_pick_findings(slug, picks, must_differ, axes_of):
    """FAILs for one city's picks against every other city's picks and every built page's."""
    from city_components import axis_distance
    doc, out = picks[slug], []

    def fail(check, msg):
        out.append({"check": check, "sev": "FAIL", "msg": msg})

    for comp, key in sorted(doc["picks"].items()):
        city, kcomp, _v = key.split("/")
        if kcomp != comp or city != doc["canvas"]:
            fail("city-pick-malformed", f"{comp}: {key} is not a {doc['canvas']}/{comp}/… variant")
            continue
        axes = axes_of(key)
        if axes is None:
            fail("city-pick-unknown", f"{comp}: {key} has no meta.json entry on its canvas")
            continue
        for other, odoc in sorted(picks.items()):
            if other == slug:
                continue
            okey = odoc["picks"].get(comp)
            if okey == key:
                fail("city-pick-shared", f"{comp} {key} is already worn by {other} (working rule 16)")
                continue
            oaxes = axes_of(okey) if okey else None
            if oaxes and axis_distance(axes, oaxes) < 2:
                fail("city-pick-too-close", f"{comp} {key} is within one axis of {other}'s {okey}")
        for row in must_differ.get(comp, []):
            if row.get("used_by") and axis_distance(axes, row["axes"]) < 2:
                fail("city-pick-matches-built",
                     f"{comp} {key} is within one axis of {row['id']} ({row['name']}), worn by "
                     f"{', '.join(row['used_by'])}")
    return out


def city_pool_findings(pool, picks, axes_of):
    """FAILs for pool entries that are malformed, unknown, or already picked by a city."""
    picked = {k: s for s, d in picks.items() for k in d["picks"].values()}
    out = []
    for comp, keys in sorted(pool["available"].items()):
        for key in keys:
            if key.split("/")[1] != comp:
                out.append({"check": "city-pool-malformed", "sev": "FAIL",
                            "msg": f"{comp}: {key} is filed under the wrong component"})
            elif axes_of(key) is None:
                out.append({"check": "city-pool-unknown", "sev": "FAIL",
                            "msg": f"{comp}: {key} has no meta.json entry on its canvas"})
            elif key in picked:
                out.append({"check": "city-pool-picked", "sev": "FAIL",
                            "msg": f"{comp}: {key} is in the pool and picked by {picked[key]}"})
    return out


def city_rule16_findings(board, picks=None, pool=None, must_differ=None, axes_of=None):
    """Rule 16 for a record whose layout family is `city`; [] for every other record."""
    meta = board.get("meta") or {}
    if meta.get("layout_type") != CITY_FAMILY:
        return []
    slug = (meta.get("slug") or "").rsplit("/", 1)[-1]
    picks = load_city_picks() if picks is None else picks
    if slug not in picks:
        return [{"check": "city-picks-missing", "sev": "FAIL",
                 "msg": f"a city page's fifteen picks live in data/design/city-picks/{slug}.json "
                        "(its component design pass); none is saved"}]
    if must_differ is None:
        must_differ = (_read_json(CITY_MUST_DIFFER).get("components") or {}) if CITY_MUST_DIFFER.exists() else {}
    axes_of = canvas_axes if axes_of is None else axes_of
    pool = load_city_pool() if pool is None else pool
    return (city_pick_findings(slug, picks, must_differ, axes_of)
            + city_pool_findings(pool, picks, axes_of))
```
