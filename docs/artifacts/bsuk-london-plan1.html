<script type="text/markdown" data-title="Summary">
> **For agentic workers:** REQUIRED SUB-SKILL: Use superpowers:subagent-driven-development (recommended) or superpowers:executing-plans to implement this plan task-by-task. Steps use checkbox (`- [ ]`) syntax for tracking.

**Goal:** Put 45 new, gated, token-true component variants (15 city components × 3) in front of
the user on one private canvas, and land the two pieces that do not depend on their picks: the
mobile hero-first fix and the `city` family with its uniqueness gate.

**Architecture:** One shared list of the fifteen components (`scripts/city_components.py`) feeds
every tool. The references are captured outside the repo and indexed in it; a generated
must-differ inventory says what the twelve built pages already wear. Each variant is an HTML
fragment on the real tokens, held by a validator (`npm run check:canvas`) and a Playwright smoke
(`npm run test:render:canvas`), and a builder wraps all 45 into one self-contained canvas page
whose picks live in the Artifact's own db. The hero fix and the `city` gate are ordinary TDD
changes to `Hero.astro`, the render harness, `boardStyles.ts` and `pageboard.py`.

**Tech Stack:** Astro 6 + Tailwind 4 (static), Python 3.9 scripts + pytest (`tests/py`),
Playwright render harness (`tests/render`), the Playwright MCP for the reference captures, the
Artifact tool (`db` + `comments` capabilities) for the canvas.

**Scope.** This is **Plan 1**: everything before the user's picks, plus the two pick-independent
build pieces (Tasks 11 and 12). **Plan 2 is written after the picks and is not planned here.** It
will cover: freezing the picks into `data/design/city-picks/blue-staffy-puppies-london.json` and
the 30 unpicked variants into `data/design/city-pool.json`, building the 15 picked components
into the kit (`src/components/kit/`, `_registry.ts`, `kit-preview` fixtures,
`tests/py/test_design_components.py`), London's own `.astro` scaffold on `PageShell` (noindex),
excluding London from `src/pages/uk-locations/[slug].astro`, adding `check:canvas` to
`check:all`, and the side-by-side confirmation.

**Source documents:** spec `docs/superpowers/specs/2026-09-27-london-component-design-pass-design.md`
· reference URLs `docs/research/2026-09-27-location-component-design-sources.md` · the user's own
words `docs/reference/answer-board/answers/2026-09-26-project-5-decisions-before-the-first-city-page-2026-09-27.md`
(q01 (c), q05).

<script type="text/markdown" data-title="Execution notes — read before Task 1">
1. **Branch and worktree.** Work in `/Users/apple/Downloads/BSUK-london` on `london-components`.
   Commit after every task and never push. Every commit message ends with exactly
   `Co-Authored-By: Claude Fable 5.1 <noreply@anthropic.com>`; subagents tend to substitute
   their own model name, so tell them. Merge into `foundation` only when the user says so.
2. **Subagent-driven.** Each task gets an Opus implementer, then a spec review, then a quality
   review. Implementers never start background agents and never end a turn to "wait"; they run
   everything in the foreground and reply once the task is committed. Every status reply to the
   user shows the full progress table (Task, status, commit).
3. **Controller tasks.** Task 1 needs the Playwright MCP tools
   (`mcp__plugin_playwright_playwright__*`), which the user asked for by name. Run it in the
   controller session, or give it to an implementer only if that session lists those tools.
   Task 10 is controller-only: it publishes an Artifact, holds the comment watch and talks to the
   user.
4. **Order.** Tasks run in number order. Task 10 ends with a STOP for the user's picks. Tasks 11
   and 12 then run while the user picks, and Task 13 closes Plan 1. If the user sends picks (or
   says "read my picks") before Task 13, record them in the progress table and carry on: Plan 2
   is written from them after Task 13.
5. **Build before `check:all`.** `check:boards` reads `dist/`. Run `npm run -s build` first
   whenever `src/`, `data/*.json` or `data/boards/` changed, then `npm run -s check:all`.
6. **No `check:all` change in Plan 1.** `check:canvas` stays a standalone gate. While Tasks 5–9
   add the variants three components at a time, the canvas is incomplete by design and the full
   validator (which requires all fifteen) fails; chaining it would turn every commit from Task 3
   to Task 9 red. Plan 2 adds it to the chain once the canvas is frozen. If any task does change
   the chain, the same commit must update `package.json`, the `expected` list in
   `tests/py/test_package_scripts.py` and the CLAUDE.md sentence "`check:all` chains … in that
   order" (`tests/py/test_doc_drift.py` pins it).
7. **Markers.** `npm run check:markers` scans `CLAUDE.md`, `rules/`, `docs/reference/`,
   `package.json`, `tests/render/` and the ported files. Never write the `cag-` prefix, the
   sister-site domain, or the two source-animal words there. `docs/research/` is outside the
   scan, which is why the reference URLs, the ideas index and the must-differ table live there.
   `tests/render/` is also held to `tests/py/test_harness_vocabulary.py`'s banned words.
8. **The system registry is generated.** After any task that adds a script, a schema or a data
   file, run `python3 scripts/build_system_registry.py` and commit
   `docs/reference/system-registry.md` with the task. `tests/py/test_system_registry.py`
   (`test_the_real_doc_is_in_sync`) fails otherwise. Never hand-merge it.
9. **Run the suite in the real worktree.** A few tests read git history, and
   `data/queries/cache/` (git-ignored) exists only in the real checkout.
10. **Render runs** need `PUBLIC_FORMSPREE_ID` in `.env`. If another worktree holds the render
    ports, set `RENDER_SITE_PORT` / `RENDER_FIXTURE_PORT` (page harness) and
    `RENDER_CANVAS_PORT` (canvas smoke, default 4331).
11. **The design skills are mandatory.** Every variant task (5–9) invokes the
    `frontend-design:frontend-design` skill to design and the `impeccable:impeccable` skill to
    critique and harden, each by name with the Skill tool, never paraphrased and never skipped
    (the user's rulings, 2026-09-26). `superpowers:verification-before-completion` runs before
    any "done" claim in Tasks 10 and 13.
12. **Frozen pages.** The 12 built pages keep their contracts. Task 11's phone-width hero change
    is the only change to them, and it is shown to the user.

<script type="text/markdown" data-title="The variant contract (Tasks 5–9)">
Every variant is `design/city-canvas/london/<component>/<a|b|c>.html`: zero or more `<style>`
blocks, then exactly one `<section data-component="<component>" data-variant="<a|b|c>">`. The
builder wraps it in a frame holding the Google Fonts link, `src/styles/tokens.css` as a `:root`
block and a small base (box-sizing, body font and surface, heading font, focus ring, reduced
motion). One `meta.json` per component describes all three.

**What `npm run check:canvas` refuses** (`scripts/check_city_canvas.py`, Task 3):
- *Structure:* anything but one root section naming its own component and variant; `<script>`,
  `<link>`, `<iframe>`, `<object>`, `<embed>`, `<video>`, `<audio>`.
- *Colour:* hex, `rgb()`/`hsl()`/…, or `black`/`white`/`grey`/`gray`/`silver` in CSS, and any SVG
  paint attribute other than `currentColor`/`none`. Every colour is a `var(--…)` token, so a bleed
  or letterbox can never be grey or black.
- *Headings:* every h1–h6 ends in `?`, and the next start tag after it (skipping `<div>` wrappers
  and an image, which rule 17 puts first under an H3) is a `<p>` of at least 12 words. A puppy
  card's name is the one exemption: `data-heading-exempt="puppy-name"`, on `puppy-cards` only.
- *Tables:* a `<td>` without a non-empty `data-label`.
- *Hero:* an `<img>`/`<picture>` that does not come before the first `<h1>`/`<h2>`.
- *Assets:* any `src`/`srcset`/`poster`/`url()` that is not `/images/<file>` (from
  `public/images/`) or `/puppies/<file>` (from `src/assets/puppies/`) and existing; an `<a href>`
  that is not `#…` or `/…`; a `<form action>` that is not absent or `#…`; an `<img>` without alt
  text or without numeric `width` and `height`.
- *Copy:* no "London"; a `£` figure that is not £1,500, £1,700, £500, £200 or £350 (read from
  `data/`); anything shaped like a phone number (write `PHONE_PLACEHOLDER`); a source-project
  marker (`scripts/marker_check.py`'s own matcher) or a reference-site host name.
- *Reviews:* a `<blockquote>` that is neither `data-placeholder="review"` nor
  `data-review="<n>"` quoting `data/reviews.json[n]` word for word.
- *Hooks and forms:* the hook counts in the table above; a form field with no `<label for>` or
  `aria-label`.
- *meta.json:* `component`, and for each of `a`, `b`, `c`: `name` (1–60 characters),
  `description` (one line, 1–160), `idea_sources` (each string cited verbatim under that
  component's section of the ideas index), `differs_from` (20+ characters), and `axes` with
  exactly `layout` (a short slug), `media` (none, left, right, top, bottom, background, inline,
  grid), `density` (compact, regular, airy) and `framing` (plain, band, card, rule, inset,
  bleed). Siblings differ on at least two axes, and each variant differs on at least two axes
  from **every row** of its component in `data/design/city-must-differ.json`.

```json
{
 "component": "hero",
 "variants": {
  "a": {
   "name": "Postcard stack",
   "description": "Photo as a postcard above a ruled copy block; one brass CTA.",
   "idea_sources": ["/Users/apple/Downloads/BSUK/BSUK-refs/london/hero/mfs-home-375-01.png"],
   "differs_from": "No built page frames its hero with rules and an inset photo; H-GD2 is a card.",
   "axes": {"layout": "postcard", "media": "top", "density": "airy", "framing": "rule"}
  },
  "b": {"…": "same fields"},
  "c": {"…": "same fields"}
 }
}
```

The axes must describe what the fragment renders. When a variant **is** an arrangement the
inventory already lists, its `layout` uses that row's slug verbatim, and it then has to differ on
media and framing. The spec reviewer compares each frame to its declared axes, so an axis that
flatters a design is a review failure.

**What the smoke (`npm run test:render:canvas`, Task 5) refuses:** at 375, 768 and 1280, a frame
that fails `layout-no-horizontal-overflow`, `layout-min-font-size`, `layout-tap-target-size`,
`layout-table-stacks-on-mobile`, `a11y-text-contrast-aa`, `a11y-no-duplicate-ids` or
`img-alt-present-and-unique`, or its component's probe (for example a hero band outside 390–450px
at 1024px and up, a hero photo painted under the heading at 900px or less, a dial shown on a
phone, a jump strip that does not stick).

**What no machine checks, and the reviews do:**
- *Tokens only.* Colour, fonts (`--font-display` for headings, `--font-body` for everything
  else), the type scale, spacing, radius, `--shadow-card`/`--shadow-lift` and the motion tokens
  (`--dur-fast`, `--dur-base`, `--ease-out`). Brass (`--color-cta`) is a fill with
  `--color-cta-ink` text, never small text on a light surface (2.1:1). CTA buttons are pills
  (`--btn-radius`); form submits use `--btn-form-radius`.
- *Headings.* A buyer question in Title Case (`rules/headings.md`), followed by a
  conversational opening paragraph that answers it and reinforces the section's message
  (q05). Only the hero has an `<h1>`.
- *London-flavoured placeholder copy, no invented facts.* The facts a variant may state are: the
  six available puppies and their names, sexes, colours and prices (`data/puppies.json`: £1,500
  for Roman, Byrd and Ince; £1,700 for Vennie, Christa and Cheryl); the £500 refundable deposit;
  UK home delivery for £200–£350 by DEFRA-approved transport, priced by distance, or collection in
  Carlisle; Lisa Bright, Carlisle, Cumbria (town and region only); KC registered, DNA-tested
  parents (L-2-HGA and HC-HSF4, spelled that way), raised in the home. Never a guarantee length,
  a licence or statute claim, a phone number, a distance or travel time, a review score or an
  invented review.
- *Images.* Reuse served images: the London ones in `public/images/`
  (`ethical-staffy-puppy-london-delivery.webp`, `kc-registered-blue-staffy-pups-london.webp`,
  `blue-staffy-testimonial-london-happy-owner.webp`, `mark-blue-staffy-london.webp`) and the puppy
  photos in `src/assets/puppies/` (`Roman2.jpg`, `Byrd1.jpg`, `Ince1.jpg`, `Vennie.jpeg`,
  `Christa.jpeg`, `Cheryl1.jpeg`). Every image box is reserved (`width`/`height` plus an

component design pass is built on (spec docs/superpowers/specs/2026-09-27-london-component-
design-pass-design.md, "The 15 components").

gate in scripts/pageboard.py. A second copy of a list is a copy that drifts.

PageNav, shipped in one arrangement, and the newsletter has no kit component at all. Their
must-differ rows come from `KIT_ONLY` below.
"""

    ("hero", "Hero", ("hero",)),
    ("counter-strip", "Counter strip", ("stats",)),
    ("trust-strip", "Trust strip", ("trust",)),
    ("contents-list", "Contents list", ()),
    ("desktop-dial", "Desktop dial", ("dial",)),
    ("jump-links", "Mobile sticky jump links and sheet", ("strip", "sheet")),
    ("key-takeaways", "Key takeaways", ("takeaways",)),
    ("puppy-cards", "Puppy cards", ("puppies",)),
    ("tables", "Tables", ("table",)),
    ("video", "Video", ("video",)),
    ("image-text", "Image and text section", ("standard",)),
    ("reviews", "Reviews", ("reviews",)),
    ("faq-blocks", "FAQ blocks", ("faq",)),
    ("newsletter", "Newsletter", ()),
    ("contact-form", "Contact form", ("form",)),
)

COMPONENT_IDS = tuple(c[0] for c in COMPONENTS)
NAMES = {c[0]: c[1] for c in COMPONENTS}
SHAPES_OF = {c[0]: c[2] for c in COMPONENTS}
VARIANT_IDS = ("a", "b", "c")

#: The canonical axes a variant declares in its meta.json, and the closed vocabularies of
#: three of them. `layout` is a short free slug (the arrangement's own name); when a variant
#: IS an arrangement the inventory already lists, it uses that row's layout slug verbatim.
AXES = ("layout", "media", "density", "framing")
VOCAB = {
    "media": ("none", "left", "right", "top", "bottom", "background", "inline", "grid"),
    "density": ("compact", "regular", "airy"),
    "framing": ("plain", "band", "card", "rule", "inset", "bleed"),
}

#: Must-differ rows for the components a board shape does not cover (see the module doc).
KIT_ONLY = {
    "contents-list": [{
        "id": "PageNav",
        "name": "Shipped contents list: a wrapping row of pills, no heading (PageNav)",
        "axes": {"layout": "chip-row", "media": "none", "density": None, "framing": "plain"},
        "used_by": ["every rebuilt page (PageShell mounts it)"],
    }],
    "newsletter": [],
}

#: Where a city's canvas lives. One folder per city key, one sub-folder per component.
CANVAS_ROOT = ROOT / "design" / "city-canvas"


def variant_key(city, component, variant):
    """The global id of one canvas variant, e.g. `london/hero/b`. One id names one design
    across every city's pass, so a pick and a pool entry can be compared by id alone."""
    return f"{city}/{component}/{variant}"


def axis_distance(a, b):
    """How many of the four canonical axes two declarations differ on. An axis either side
    leaves unknown (None or absent) never counts as a difference: an unknown is not proof
    that two designs differ."""
    return sum(1 for k in AXES
               if a.get(k) is not None and b.get(k) is not None and a.get(k) != b.get(k))

#!/usr/bin/env python3
"""The must-differ inventory for a city component pass (London first).

For each of the fifteen city components (scripts/city_components.py): every arrangement the
site already offers for it — the S1–S3 styles and, for the hero and the counter strip, the
eighteen per-page styles in src/lib/boardStyles.ts — with the built pages that wear each one
(the pick IN FORCE, `pageboard.pick_in_force`, over every record in data/facts/rebuilt.json)
and its structural axes on the canvas's four canonical axes. A new canvas variant must differ
from every row of its component on at least two axes (scripts/check_city_canvas.py).

Writes two files from one computation, so they cannot disagree:
  data/design/city-must-differ.json                 — what the validator and the gate read
  docs/research/london-components/must-differ.md    — what a designer reads

    python3 scripts/city_must_differ.py           # write both
    python3 scripts/city_must_differ.py --check   # exit 1 if either is stale
"""
import argparse
import ast
import json
import pathlib
import re
import sys

sys.path.insert(0, str(pathlib.Path(__file__).resolve().parent))
import pageboard as PB  # noqa: E402
from city_components import COMPONENTS, KIT_ONLY  # noqa: E402

ROOT = PB.ROOT
TS = ROOT / "src" / "lib" / "boardStyles.ts"
OUT_JSON = ROOT / "data" / "design" / "city-must-differ.json"
OUT_MD = ROOT / "docs" / "research" / "london-components" / "must-differ.md"

_HEAD = re.compile(r"^  '?([a-z-]+)'?:\s*\[\s*$", re.M)
_DEF = re.compile(r"def\('([^']+)',\s*'([^']*)',\s*(\{.*?\})\)", re.S)

#: The neutral value of every Layout axis a renderer defaults, as the components default them
#: (Hero `split`, CounterStrip `inline`, Testimonial `single`; boxClass() NEUTRAL for the rest).
DEFAULTS = {"hero": "split", "tiles": "inline", "mode": "single", "list": "stack",
            "columns": 1, "aside": "none", "chrome": "ruled", "play": "iframe",
            "media": "none", "frame": "plain"}


def _get(layout, key):
    return layout.get(key, DEFAULTS.get(key))


def layout_slug(shape, layout):
    """The canonical `layout` axis of one boardStyles def: the arrangement, named the way a
    canvas variant names its own."""
    if shape == "hero":
        return _get(layout, "hero")
    if shape == "stats":
        return _get(layout, "tiles")
    if shape in ("takeaways", "puppies"):
        return _get(layout, "list")
    if shape == "reviews":
        return _get(layout, "mode")
    if shape == "table":
        return _get(layout, "chrome")
    if shape == "video":
        return _get(layout, "play")
    if shape == "dial":
        return f"ring-{layout.get('ring')}+{layout.get('marks')}+{layout.get('list')}"
    if shape == "strip":
        return layout.get("chip")
    if shape == "sheet":
        return layout.get("launcher")
    aside = _get(layout, "aside")
    return f"cols-{_get(layout, 'columns')}" + ("" if aside == "none" else f"+{aside}")


def canonical_axes(shape, layout):
    return {"layout": layout_slug(shape, layout), "media": _get(layout, "media"),
            "density": None, "framing": _get(layout, "frame")}


def _parse_block(src, const_name):
    """{group: [(id, name, layout dict)]} for one `export const <name> … = { … };` map."""
    body = src.split("export const " + const_name, 1)[1].split("\n};", 1)[0]
    parts = _HEAD.split(body)[1:]
    out = {}
    for i in range(0, len(parts), 2):
        rows = []
        for m in _DEF.finditer(parts[i + 1]):
            obj = re.sub(r"(\w+):", r"'\1':", " ".join(m.group(3).split()))
            rows.append((m.group(1), m.group(2), ast.literal_eval(obj)))
        out[parts[i]] = rows
    return out


def style_defs(ts_path=TS):
    """{shape: [(id, name, layout)]} — the shape-wide trios plus, under `hero` and `stats`,
    the per-page sets of every layout family, in the file's own order."""
    src = pathlib.Path(ts_path).read_text(encoding="utf-8")
    trios = _parse_block(src, "STYLES:")
    defs = {shape: list(rows) for shape, rows in trios.items()}
    for const, shape in (("HERO_STYLES_BY_PAGE_TYPE", "hero"),
                         ("COUNTER_STYLES_BY_PAGE_TYPE", "stats")):
        for rows in _parse_block(src, const).values():
            defs[shape].extend(rows)
    return defs


def worn_by(boards, slugs):
    """{(shape, style id): [slug]} — the pick in force of every section of every built page."""
    out = {}
    for slug in sorted(slugs):
        b = boards.get(slug)
        if not b:
            continue
        for sec in b.get("sections", []):
            pick = PB.pick_in_force(b, sec.get("id"))
            if pick:
                out.setdefault((sec.get("shape"), pick), []).append(slug)
    return out


def inventory(ts_path=TS, boards=None, slugs=None):
    """{component id: [row]} in city-page order. A row is {shape, id, name, axes, used_by}."""
    defs = style_defs(ts_path)
    boards = PB.load_all_boards() if boards is None else boards
    slugs = PB.rebuilt_slugs() if slugs is None else slugs
    worn = worn_by(boards, slugs)
    out = {}
    for cid, _name, shapes in COMPONENTS:
        rows = [dict(r, shape="kit") for r in KIT_ONLY.get(cid, [])]
        for shape in shapes:
            for sid, name, layout in defs.get(shape, []):
                rows.append({"shape": shape, "id": sid, "name": name,
                             "axes": canonical_axes(shape, layout),
                             "used_by": sorted(set(worn.get((shape, sid), [])))})
        out[cid] = rows
    return out


def render_json(inv):
    doc = {"_comment": "Generated by scripts/city_must_differ.py — do not hand-edit. Every "
                       "arrangement the site already offers per city component, with the "
                       "built pages wearing it; a canvas variant differs from each row on at "
                       "least two of layout/media/density/framing (a null never counts).",
           "components": inv}
    return json.dumps(doc, ensure_ascii=False, indent=1, sort_keys=True) + "\n"


def render_md(inv):
    names = {c[0]: c[1] for c in COMPONENTS}
    lines = ["# Must Differ — the London Component Design Pass", "",
             "Generated by `scripts/city_must_differ.py` from `src/lib/boardStyles.ts` and the "
             "approved picks in `data/boards/` (the pick in force on each built page). Do not "
             "hand-edit; re-run the script. The machine-readable copy is "
             "`data/design/city-must-differ.json`.", "",
             "Every London variant differs from **every row of its component** on at least two "
             "of the four axes (layout, media, density, framing), and from its two siblings. A "
             "colour change never counts. A dash is an axis the style does not state, which "
             "never counts as a difference.", ""]
    for cid, rows in inv.items():
        lines += [f"## {cid} — {names[cid]}", ""]
        if not rows:
            lines += ["No existing arrangement: the kit has no such component. A variant "
                      "differs from its two siblings only.", ""]
            continue
        lines += ["| Style | Shape | What it renders | layout | media | framing | Worn by |",
                  "|---|---|---|---|---|---|---|"]
        for r in rows:
            a = r["axes"]
            worn = ", ".join(r["used_by"]) or "—"
            lines.append(f"| `{r['id']}` | {r['shape']} | {r['name']} | {a['layout'] or '—'} | "
                         f"{a['media'] or '—'} | {a['framing'] or '—'} | {worn} |")
        lines.append("")
    return "\n".join(lines)


def main(argv=None):
    ap = argparse.ArgumentParser(description=__doc__.split("\n", 1)[0])
    ap.add_argument("--check", action="store_true", help="exit 1 if either output is stale")
    a = ap.parse_args(argv)
    inv = inventory()
    want = {OUT_JSON: render_json(inv), OUT_MD: render_md(inv)}
    rows = sum(len(v) for v in inv.values())
    if a.check:
        stale = [p for p, text in want.items()
                 if not p.exists() or p.read_text(encoding="utf-8") != text]
        for p in stale:
            print(f"STALE {p.relative_to(ROOT)} — run python3 scripts/city_must_differ.py")
        print(f"city-must-differ: {len(inv)} components, {rows} rows examined; "
              f"{len(stale)} stale")
        return 1 if stale else 0
    for p, text in want.items():
        p.parent.mkdir(parents=True, exist_ok=True)
        p.write_text(text, encoding="utf-8")
        print(f"wrote {p.relative_to(ROOT)}")
    print(f"city-must-differ: {len(inv)} components, {rows} rows")
    return 0


if __name__ == "__main__":
    sys.exit(main())

#!/usr/bin/env python3

A city canvas is `design/city-canvas/<city>/<component>/{a,b,c}.html` plus one `meta.json`
per component (spec docs/superpowers/specs/2026-09-27-london-component-design-pass-design.md
§1–§2). Each `.html` is a FRAGMENT: zero or more `<style>` blocks, then exactly one
`<section data-component="<component>" data-variant="<a|b|c>">`. The canvas builder
(scripts/build_component_canvas.py) wraps it in a frame with the design tokens.

What is refused, per fragment:
  structure  — one root section naming its own component and variant; no <script>, <link>,
               <iframe>, <object>, <embed>, <video>, <audio> (CSS-first, nothing heavy)
  colour     — no hex, no rgb()/hsl()/…, no black/white/grey/silver in CSS or an SVG paint
               attribute: every colour is a var(--…) token (rules/design.md rule 1), so a bleed
               can never be grey or black
  headings   — every h1–h6 ends in "?" (a buyer question) and the next start tag after it,
               skipping <div> wrappers and an image (<figure>/<picture>/<img>, which rule 17
               puts first under an H3), is a <p> of at least 12 words (the conversational
               opening). A puppy card's name may carry data-heading-exempt="puppy-name"
  tables     — every <td> carries a non-empty data-label (working rule 13)
  hero       — the first <img>/<picture> comes before the first <h1>/<h2> in source
  assets     — every src/srcset/poster/url() is /images/<file> (public/images) or
               /puppies/<file> (src/assets/puppies) and exists; <a href> is "#…" or "/…";
               every <img> has a non-empty alt and numeric width and height (no layout shift)
  copy       — the word "London" appears; every £ amount is a price, the deposit or a
               delivery bound from data/; no phone number (PHONE_PLACEHOLDER only); no
               source-project marker (scripts/marker_check.py MARKERS) and no reference-site
               host name (docs/research/2026-09-27-location-component-design-sources.md)
  reviews    — in `reviews`, every <blockquote> is either data-placeholder="review" or
               data-review="<n>" quoting data/reviews.json[n] word for word: a mockup never

  hooks      — the data hooks HOOKS names for the component (six puppy cards, three FAQ

every row of data/design/city-must-differ.json for its component.

    "key-takeaways": (("data-takeaway", 3, 6),),

FIELDS = {"input", "select", "textarea"}


@dataclasses.dataclass
class Context:
    banned_words: tuple
    allowed_pounds: frozenset
    must_differ: dict
    ideas: dict
    reviews: tuple = ()
    image_roots: dict = dataclasses.field(default_factory=lambda: dict(IMAGE_ROOTS))


def banned_words(sources_doc=SOURCES_DOC):
    """Every reference-site host named in the sources doc, and its first label. The
    source-project markers are judged separately, by marker_check's own matcher."""
    words = set()
    text = pathlib.Path(sources_doc).read_text(encoding="utf-8") if pathlib.Path(sources_doc).exists() else ""
    for host in re.findall(r"https?://(?:www\.)?([^/\s)>`]+)", text):
        words.add(host.lower())
        words.add(host.lower().split(".")[0])
    return tuple(sorted(words))


def allowed_pounds(root=ROOT):
    s = json.loads((root / "data" / "settings.json").read_text(encoding="utf-8"))
    p = json.loads((root / "data" / "puppies.json").read_text(encoding="utf-8"))
    vals = {s["deposit_gbp"], s["delivery_min_gbp"], s["delivery_max_gbp"]}
    vals |= {row["price_gbp"] for row in p}
    return frozenset(int(v) for v in vals)


def real_reviews(root=ROOT):
    """The quotes of data/reviews.json, in file order: the only reviews a variant may show."""
    rows = json.loads((root / "data" / "reviews.json").read_text(encoding="utf-8"))
    return tuple(" ".join(r["quote"].split()) for r in rows)


def ideas_sections(text):
    """{component id: section text} out of the ideas index (`## <id> — <name>` headings)."""
    out = {}
    parts = re.split(r"^## ([a-z-]+) — .*$", text, flags=re.M)
    for i in range(1, len(parts), 2):
        out[parts[i]] = parts[i + 1]
    return out


def default_context():
    md = json.loads(MUST_DIFFER.read_text(encoding="utf-8"))["components"] if MUST_DIFFER.exists() else {}
    ideas = ideas_sections(IDEAS_INDEX.read_text(encoding="utf-8")) if IDEAS_INDEX.exists() else {}
    return Context(banned_words=banned_words(), allowed_pounds=allowed_pounds(),
                   must_differ=md, ideas=ideas, reviews=real_reviews())


class _Walk(html.parser.HTMLParser):
    """One pass over a fragment, collecting what the rules need, in source order."""

    def __init__(self):
        super().__init__(convert_charrefs=True)
        self.events = []          # ("start", tag, attrs) / ("end", tag) / ("text", data)
        self.css = []             # every <style> body and style="" value
        self.depth = 0
        self.roots = []           # (tag, attrs) of every element opened at depth 0
        self._in_style = False

    def handle_starttag(self, tag, attrs):
        a = {k: (v or "") for k, v in attrs}
        if self.depth == 0:
            self.roots.append((tag, a))
        self.events.append(("start", tag, a))
        if "style" in a:
            self.css.append(a["style"])
        if tag == "style":
            self._in_style = True
        if tag not in {"img", "source", "br", "hr", "input", "meta", "wbr", "col", "area"}:
            self.depth += 1

    def handle_startendtag(self, tag, attrs):
        self.handle_starttag(tag, attrs)
        if tag not in {"img", "source", "br", "hr", "input", "meta", "wbr", "col", "area"}:
            self.depth -= 1
            self.events.append(("end", tag))

    def handle_endtag(self, tag):
        if tag in {"img", "source", "br", "hr", "input", "meta", "wbr", "col", "area"}:
            return
        self.depth -= 1
        self.events.append(("end", tag))
        if tag == "style":
            self._in_style = False

    def handle_data(self, data):
        if self._in_style:
            self.css.append(data)
        else:
            self.events.append(("text", data))


def _text(events):
    return " ".join(e[1] for e in events if e[0] == "text")


def _url_ok(url, ctx):
    """None when the URL is an allowed repo image, else the reason it is not."""
    for prefix, folder in ctx.image_roots.items():
        if url.startswith(prefix):
            name = url[len(prefix):]
            if "/" in name or not name:
                return f"{url}: nested or empty image path"
            return None if (pathlib.Path(folder) / name).is_file() else f"{url}: no such file under {folder}"
    return f"{url}: not a repo image (/images/… or /puppies/…)"


def validate_fragment(component, variant, text, ctx):
    """[problem] for one fragment."""
    p = []
    w = _Walk()
    w.feed(text)
    w.close()
    roots = [r for r in w.roots if r[0] != "style"]
    if len(roots) != 1 or roots[0][0] != "section":
        p.append(f"structure: one root <section> expected after the <style> blocks, found "
                 f"{[r[0] for r in roots]}")
    else:
        a = roots[0][1]
        if a.get("data-component") != component or a.get("data-variant") != variant:
            p.append(f"structure: root section must carry data-component=\"{component}\" "
                     f"data-variant=\"{variant}\"")
    starts = [(i, e[1], e[2]) for i, e in enumerate(w.events) if e[0] == "start"]
    for _i, tag, _a in starts:
        if tag in BANNED_TAGS:
            p.append(f"structure: <{tag}> is not allowed in a canvas fragment")
    css = "\n".join(w.css)
    for rx, what in ((HEX, "hex colour"), (COLOUR_FN, "colour function"), (NAMED, "named colour")):
        for m in rx.finditer(css):
            p.append(f"colour: {what} {m.group(0)!r} in CSS — use a var(--…) token")
    for _i, tag, a in starts:
        for attr in PAINT_ATTRS & set(a):
            if tag in {"svg", "path", "circle", "rect", "line", "polyline", "polygon", "g",
                       "ellipse", "stop", "text", "use"} and not PAINT_OK.match(a[attr].strip()):
                p.append(f"colour: <{tag} {attr}=\"{a[attr]}\"> — use currentColor or none")
    # headings
    events = w.events
    for idx, tag, a in starts:
        if tag not in HEADINGS:
            continue
        end = next((j for j in range(idx + 1, len(events))
                    if events[j][0] == "end" and events[j][1] == tag), len(events))
        heading = " ".join(_text(events[idx + 1:end]).split())
        exempt = component == "puppy-cards" and a.get("data-heading-exempt") == "puppy-name"
        if exempt:
            continue
        if not heading.endswith("?"):
            p.append(f"heading: <{tag}> {heading!r} is not a question ending in '?'")
        nxt = next(((j, e[1]) for j, e in enumerate(events[end + 1:], end + 1)
                    if e[0] == "start" and e[1] not in HEADING_SKIP), None)
        if not nxt or nxt[1] != "p":
            p.append(f"heading: <{tag}> {heading!r} is not followed by an opening <p>")
            continue
        pend = next((j for j in range(nxt[0] + 1, len(events))
                     if events[j][0] == "end" and events[j][1] == "p"), len(events))
        words = len(_text(events[nxt[0] + 1:pend]).split())
        if words < MIN_OPENING_WORDS:
            p.append(f"heading: the opening <p> after {heading!r} has {words} words, "
                     f"fewer than {MIN_OPENING_WORDS}")
    # hooks: the parts of the component a variant may restyle but never drop
    for attr, lo, hi in HOOKS.get(component, ()):
        n = sum(1 for _i, _t, a in starts if attr in a)
        if not lo <= n <= hi:
            want = str(lo) if lo == hi else f"{lo}–{hi}"
            p.append(f"hooks: {n} element(s) carry {attr}, {component} needs {want}")
    if component == "tables" and not any(t == "table" for _i, t, _a in starts):
        p.append("hooks: a tables variant renders a real <table>")
    # form fields: a label for every field a person fills in
    labelled = {a.get("for") for _i, t, a in starts if t == "label"}
    for _i, tag, a in starts:
        if tag in FIELDS and a.get("type") not in ("hidden", "submit", "button"):
            if not (a.get("id") in labelled or a.get("aria-label", "").strip()):
                p.append(f"form: <{tag} name=\"{a.get('name', '')}\"> has no <label for> or aria-label")
    # tables
    for _i, tag, a in starts:
        if tag == "td" and not a.get("data-label", "").strip():
            p.append("table: a <td> carries no data-label, so it stacks unlabelled on a phone")
    # hero: the photo precedes the heading in source
    if component == "hero":
        first_img = next((i for i, t, _a in starts if t in ("img", "picture")), None)
        first_h = next((i for i, t, _a in starts if t in ("h1", "h2")), None)
        if first_img is None or first_h is None or first_img > first_h:
            p.append("hero: the <img>/<picture> must come before the <h1>/<h2> in source "
                     "(the photo paints first on phones)")
    # assets and links
    for _i, tag, a in starts:
        urls = []
        if "src" in a:
            urls.append(a["src"])
        for key in ("srcset", "imagesrcset"):
            if key in a:
                urls += [c.strip().split()[0] for c in a[key].split(",") if c.strip()]
        if "poster" in a:
            urls.append(a["poster"])
        for u in urls:
            why = _url_ok(u, ctx)
            if why:
                p.append(f"asset: {why}")
        if tag == "a":
            href = a.get("href", "")
            if not (href.startswith("#") or (href.startswith("/") and not href.startswith("//"))):
                p.append(f"asset: <a href=\"{href}\"> — a mockup links to #… or /… only")
        if tag == "form" and a.get("action", "#")[:1] != "#":
            p.append(f"asset: <form action=\"{a['action']}\"> — a mockup form posts nowhere")
        if tag == "img":
            if not a.get("alt", "").strip():
                p.append(f"asset: <img src=\"{a.get('src', '')}\"> has no alt text")
            if not (a.get("width", "").isdigit() and a.get("height", "").isdigit()):
                p.append(f"asset: <img src=\"{a.get('src', '')}\"> needs numeric width and "
                         "height so its box is reserved")
    for m in CSS_URL.finditer(css):
        why = _url_ok(m.group(1), ctx)
        if why:
            p.append(f"asset: CSS {why}")
    # copy
    body = " ".join(_text(events).split())
    if "london" not in body.lower():
        p.append("copy: no mention of London — the placeholder copy is London-flavoured")
    for m in POUNDS.finditer(body):
        n = int(m.group(1).replace(",", ""))
        if n not in ctx.allowed_pounds:
            p.append(f"copy: £{m.group(1)} is not a price, the deposit or a delivery bound "
                     "from data/ (never invent a figure)")
    for m in PHONE.finditer(body):
        p.append(f"copy: {m.group(0)!r} looks like a phone number — write PHONE_PLACEHOLDER")
    low = text.lower()
    for marker in marker_check.MARKERS:
        if marker_check._present(marker, low):
            p.append(f"copy: {marker!r} is source-project text (scripts/marker_check.py)")
    for word in ctx.banned_words:
        if word in low:
            p.append(f"copy: {word!r} is reference-site text")
    if component == "reviews":
        for idx, tag, a in starts:
            if tag != "blockquote" or a.get("data-placeholder") == "review":
                continue
            n = a.get("data-review", "")
            if not (n.isdigit() and int(n) < len(ctx.reviews)):
                p.append("reviews: a <blockquote> is neither data-placeholder=\"review\" nor "
                         "data-review=\"<n>\" quoting data/reviews.json — never invent a review")
                continue
            end = next((j for j in range(idx + 1, len(events))
                        if events[j][0] == "end" and events[j][1] == "blockquote"), len(events))
            quote = " ".join(_text(events[idx + 1:end]).split())
            if ctx.reviews[int(n)][:60] not in quote:
                p.append(f"reviews: data-review=\"{n}\" does not quote data/reviews.json[{n}] "
                         "word for word")
    return p


def validate_meta(component, meta, ctx):
    """([problem], {variant: axes}) for one component's meta.json."""
    p, axes = [], {}
    if meta.get("component") != component:
        p.append(f"meta: \"component\" must be {component!r}")
    variants = meta.get("variants") or {}
    if sorted(variants) != list(VARIANT_IDS):
        p.append(f"meta: \"variants\" must hold exactly {list(VARIANT_IDS)}")
    cited = ctx.ideas.get(component, "")
    for v in VARIANT_IDS:
        row = variants.get(v) or {}
        name, desc = row.get("name", ""), row.get("description", "")
        if not (isinstance(name, str) and 0 < len(name) <= 60):
            p.append(f"meta {v}: name is 1–60 characters")
        if not (isinstance(desc, str) and 0 < len(desc) <= 160 and "\n" not in desc):
            p.append(f"meta {v}: description is one line of 1–160 characters")
        srcs = row.get("idea_sources")
        if not (isinstance(srcs, list) and srcs):
            p.append(f"meta {v}: idea_sources lists at least one source")
        else:
            for s in srcs:
                if not isinstance(s, str) or s not in cited:
                    p.append(f"meta {v}: idea source {s!r} is not cited under ## {component} "
                             "in the ideas index")
        diff = row.get("differs_from", "")
        if not (isinstance(diff, str) and len(diff.strip()) >= 20):
            p.append(f"meta {v}: differs_from says how it differs (20+ characters)")
        ax = row.get("axes") or {}
        if sorted(ax) != sorted(AXES):
            p.append(f"meta {v}: axes must be exactly {list(AXES)}")
            continue
        if not (isinstance(ax["layout"], str) and LAYOUT_SLUG.match(ax["layout"])):
            p.append(f"meta {v}: axes.layout {ax['layout']!r} is not a short slug")
        for k, allowed in VOCAB.items():
            if ax[k] not in allowed:
                p.append(f"meta {v}: axes.{k} {ax[k]!r} is not one of {list(allowed)}")
        axes[v] = ax
    for i, a in enumerate(VARIANT_IDS):
        for b in VARIANT_IDS[i + 1:]:
            if a in axes and b in axes and axis_distance(axes[a], axes[b]) < 2:
                p.append(f"axes: siblings {a} and {b} differ on fewer than 2 axes")
    for v, ax in axes.items():
        for row in ctx.must_differ.get(component, []):
            if axis_distance(ax, row["axes"]) < 2:
                p.append(f"axes: {v} is within one axis of existing style {row['id']} "
                         f"({row['name']}) — see docs/research/london-components/must-differ.md")
    return p, axes


def validate_canvas(root, ctx, only=None):
    """(problems, fragments examined, metas examined). `only` limits the components judged;
    without it the canvas must hold all fifteen and nothing else."""
    root = pathlib.Path(root)
    problems, n_frag, n_meta = [], 0, 0
    wanted = list(only) if only else list(COMPONENT_IDS)
    if not only:
        present = sorted(d.name for d in root.iterdir() if d.is_dir() and not d.name.startswith(("_", "."))) \
            if root.is_dir() else []
        for extra in sorted(set(present) - set(COMPONENT_IDS)):
            problems.append(f"{extra}: not one of the fifteen city components")
    for cid in wanted:
        d = root / cid
        if not d.is_dir():
            problems.append(f"{cid}: missing — design/city-canvas/<city>/{cid}/ does not exist")
            continue
        files = sorted(f.name for f in d.iterdir() if f.is_file() and not f.name.startswith("."))
        want = sorted([f"{v}.html" for v in VARIANT_IDS] + ["meta.json"])
        if files != want:
            problems.append(f"{cid}: holds {files}, expected exactly {want}")
        for v in VARIANT_IDS:
            f = d / f"{v}.html"
            if f.is_file():
                n_frag += 1
                problems += [f"{cid}/{v}.html: {x}" for x in
                             validate_fragment(cid, v, f.read_text(encoding="utf-8"), ctx)]
        m = d / "meta.json"
        if m.is_file():
            n_meta += 1
            try:
                meta = json.loads(m.read_text(encoding="utf-8"))
            except json.JSONDecodeError as e:
                problems.append(f"{cid}/meta.json: {e}")
                continue
            problems += [f"{cid}/meta.json: {x}" for x in validate_meta(cid, meta, ctx)[0]]
    return problems, n_frag, n_meta


def main(argv=None):
    ap = argparse.ArgumentParser(description="Validate a city component canvas.")
    ap.add_argument("--city", default="london")
    ap.add_argument("--only", help="comma-separated component ids")
    a = ap.parse_args(argv)
    only = [c.strip() for c in a.only.split(",")] if a.only else None
    if only and set(only) - set(COMPONENT_IDS):
        ap.error(f"unknown component(s): {sorted(set(only) - set(COMPONENT_IDS))}")
    root = CANVAS_ROOT / a.city
    problems, n_frag, n_meta = validate_canvas(root, default_context(), only)
    for x in problems:
        print(f"  FAIL {x}")
    print(f"check-city-canvas {a.city}: examined {n_frag} fragments, {n_meta} meta files; "
          f"{len(problems)} problems")
    if n_frag == 0:
        print("examined 0 fragments — not a pass")
        return 1
    return 1 if problems else 0


if __name__ == "__main__":
    sys.exit(main())

/* Component canvas client (spec docs/superpowers/specs/2026-09-27-london-component-design-pass-design.md §2).
   Inlined by scripts/build_component_canvas.py. Frames are built lazily from the #frames blob,
   one section at a time, and scaled to fit at their true width. Picks save to the canvas db:
   picks/<component> {pick, note, updatedAt} and notes/general {text, updatedAt}; Send writes
   submissions/<s-time> and posts a comment, the way scripts/answer_board_client.js does. Every
   capability is optional: claude.use() may resolve null, and without a db the page is read-only. */
(function () {
  "use strict";
  var FRAMES = JSON.parse(document.getElementById("frames").textContent);
  var FINAL = document.body.getAttribute("data-final") === "true";
  var DRAFT_KEY = "component-canvas:v1";
  var PICKS = ["a", "b", "c", "redesign"];
  var db = null, comments = null, sending = false;
  var state = { picks: {}, notes: "" };   // picks: component -> {pick, note, updatedAt}
  var timers = {};

  function $(id) { return document.getElementById(id); }
  function setText(el, s) { if (typeof el === "string") el = $(el); if (el) el.textContent = s; }
  function comps() { return Array.prototype.slice.call(document.querySelectorAll("section.comp[data-component]")); }
  function ids() { return comps().map(function (s) { return s.getAttribute("data-component"); }); }
  function nameOf(cid) { var h = $("h-" + cid); return h ? h.textContent.replace(/^\d+\.\s*/, "") : cid; }

  // ---------- frames ----------
  function fit(frame) {
    var inner = frame.parentNode, stage = inner.parentNode;
    var w = Number(frame.getAttribute("width")) || 375;
    var avail = Math.max(120, stage.clientWidth - 24);
    var scale = Math.min(1, avail / w);
    var h = frame.__h || 480;
    frame.style.width = w + "px";
    frame.style.height = h + "px";
    frame.style.transform = scale < 1 ? "scale(" + scale + ")" : "none";
    inner.style.width = Math.round(w * scale) + "px";
    inner.style.height = Math.round(h * scale) + "px";
  }
  var DEVICE_H = { 375: 812, 768: 1024, 1280: 800 };
  function measure(frame) {
    if (frame.closest('[data-frame="device"]')) {   // scrolls inside itself, like a phone
      frame.__h = DEVICE_H[Number(frame.getAttribute("width"))] || 812;
      fit(frame);
      return;
    }
    try {
      var d = frame.contentDocument;
      if (d && d.documentElement) frame.__h = Math.max(120, d.documentElement.scrollHeight);
    } catch (e) { /* a frame we cannot read keeps its last height */ }
    fit(frame);
  }
  function load(section) {
    section.querySelectorAll("iframe[data-key]").forEach(function (frame) {
      if (frame.__loaded) return;
      frame.__loaded = true;
      frame.addEventListener("load", function () {
        var p = frame.parentNode.querySelector(".loading");
        if (p) p.remove();
        measure(frame);
        setTimeout(function () { measure(frame); }, 400);  // fonts and images settle
      });
      frame.srcdoc = FRAMES[frame.getAttribute("data-key")] || "<p>Missing preview.</p>";
    });
  }
  function setWidth(section, w) {
    section.setAttribute("data-width", String(w));
    section.querySelectorAll(".comp-head .seg button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-width") === String(w)));
    });
    section.querySelectorAll("iframe[data-key]").forEach(function (frame) {
      frame.setAttribute("width", String(w));
      fit(frame);
      setTimeout(function () { measure(frame); }, 150);
    });
  }
  function wireFrames() {
    var io = "IntersectionObserver" in window ? new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) { load(e.target); io.unobserve(e.target); } });
    }, { rootMargin: "600px 0px" }) : null;
    comps().forEach(function (s) {
      if (io) io.observe(s); else load(s);
      s.querySelectorAll(".comp-head .seg button").forEach(function (b) {
        b.addEventListener("click", function () { setWidth(s, Number(b.getAttribute("data-width"))); });
      });
    });
    $("all-widths").querySelectorAll("button").forEach(function (b) {
      b.addEventListener("click", function () {
        $("all-widths").querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
        comps().forEach(function (s) { setWidth(s, Number(b.getAttribute("data-width"))); });
      });
    });
    var t = null;
    window.addEventListener("resize", function () {
      clearTimeout(t);
      t = setTimeout(function () { document.querySelectorAll("iframe[data-key]").forEach(fit); }, 120);
    });
  }

  // ---------- picks ----------
  function readDraft() {
    try { var d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); if (d && typeof d === "object") return d; } catch (e) { /* none */ }
    return null;
  }
  function writeDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(state)); } catch (e) { /* none */ } }
  function row(cid) { return state.picks[cid] || (state.picks[cid] = { pick: "", note: "", updatedAt: 0 }); }
  function paint(cid, force) {
    var r = row(cid), fs = document.querySelector('fieldset[data-pick="' + cid + '"]');
    if (!fs) return;
    fs.querySelectorAll('input[type="radio"]').forEach(function (i) { i.checked = i.value === r.pick; });
    var ta = fs.querySelector("textarea");
    if (ta && (force || document.activeElement !== ta) && ta.value !== r.note) ta.value = r.note;
    var a = document.querySelector('[data-toc="' + cid + '"]');
    if (a) a.setAttribute("data-picked", String(PICKS.indexOf(r.pick) >= 0));
  }
  function paintAll(force) {
    ids().forEach(function (cid) { paint(cid, force); });
    var gn = $("general-notes");
    if (gn && (force || document.activeElement !== gn) && gn.value !== state.notes) gn.value = state.notes;
    setText("picked", String(ids().filter(function (cid) { return PICKS.indexOf(row(cid).pick) >= 0; }).length));
  }
  function save(key, ref, body) {
    clearTimeout(timers[key]);
    timers[key] = setTimeout(function () {
      delete timers[key];
      if (!db) return;
      setText("status", "Saving…");
      ref().set(body()).then(function () { setText("status", "Saved on the canvas"); },
        function (e) { setText("status", "Could not save (" + ((e && e.code) || "error") + "). Your picks are kept in this browser; try again."); });
    }, 600);
  }
  function savePick(cid) {
    writeDraft(); paintAll(false);
    save("pick:" + cid, function () { return db.collection("picks").doc(cid); },
      function () { var r = row(cid); return { pick: r.pick, note: r.note, updatedAt: r.updatedAt }; });
  }
  function saveNotes() {
    writeDraft();
    save("notes", function () { return db.collection("notes").doc("general"); },
      function () { return { text: state.notes, updatedAt: Date.now() }; });
  }
  function wirePicks() {
    ids().forEach(function (cid) {
      var fs = document.querySelector('fieldset[data-pick="' + cid + '"]');
      fs.querySelectorAll('input[type="radio"]').forEach(function (i) {
        i.addEventListener("change", function () {
          if (!i.checked) return;
          var r = row(cid); r.pick = i.value; r.updatedAt = Date.now(); savePick(cid);
        });
      });
      fs.querySelector("textarea").addEventListener("input", function (e) {
        var r = row(cid); r.note = e.target.value; r.updatedAt = Date.now(); savePick(cid);
      });
    });
    $("general-notes").addEventListener("input", function (e) { state.notes = e.target.value; saveNotes(); });
    $("send-picks").addEventListener("click", onSend);
    $("copy-picks").addEventListener("click", function () {
      var el = $("send-status");
      if (!navigator.clipboard) { setText(el, "Copy is blocked in this view."); return; }
      navigator.clipboard.writeText(picksMarkdown()).then(function () { setText(el, "Copied."); },
        function () { setText(el, "Copy is blocked in this view."); });
    });
  }
  function adoptPick(cid, rec) {
    if (!rec || PICKS.concat([""]).indexOf(rec.pick) < 0) return;
    var r = row(cid);
    if ((rec.updatedAt || 0) < r.updatedAt) return;       // a newer local edit wins
    if (timers["pick:" + cid]) return;                    // an edit in flight wins
    r.pick = rec.pick; r.note = typeof rec.note === "string" ? rec.note : ""; r.updatedAt = rec.updatedAt || 0;

    db.collection("picks").onSnapshot(function (snap) {
      snap.docs.forEach(function (d) { if (ids().indexOf(d.id) >= 0) adoptPick(d.id, d.data()); });
      writeDraft(); paintAll(false);
    }, function (e) { setText("status", "The canvas storage stopped (" + ((e && e.code) || "error") + "). Reload the page."); });
    db.collection("notes").onSnapshot(function (snap) {
      snap.docs.forEach(function (d) {
        var rec = d.data() || {};

      });
      paintAll(false);
    }, function () { /* the picks listener reports */ });
  }
  function picksMarkdown() {
    var lines = ["# London component picks", ""];
    ids().forEach(function (cid, i) {
      var r = row(cid);
      lines.push((i + 1) + ". " + nameOf(cid) + " — " + (r.pick ? (r.pick === "redesign" ? "none, redesign" : r.pick.toUpperCase()) : "not picked") +
        (r.note ? " — " + r.note.replace(/\s+/g, " ") : ""));
    });
    if (state.notes) lines.push("", "Notes: " + state.notes.replace(/\s+/g, " "));
    return lines.join("\n");
  }

  // ---------- send ----------
  function snapshotId() { return "s-" + new Date().toISOString().replace(/[:.]/g, "-"); }
  function sendMessage(how, sid) {
    var tell = "Tell Claude Code \"read my picks\", or use Copy picks.";
    if (how === "sent") return "Sent to Claude Code (copy " + sid + "). Claude's reply will appear in the comment thread.";
    if (how === "rate_limited") return "Saved as copy " + sid + ". Sending is limited for a moment; wait, then press Send again.";
    if (how === "consent_required") return "Saved as copy " + sid + ". You didn't allow comments from this page. Press Send again to allow it.";
    if (how === "forbidden" || how === "writers_only") return "Saved as copy " + sid + ". Only an editor of this canvas can send to Claude.";
    if (how === "claude_unavailable") return "Saved on the canvas as copy " + sid + ", but Claude Code couldn't receive it right now. " + tell;
    if (how === "no_session") return "Saved on the canvas as copy " + sid + ", but no Claude Code session is watching this canvas right now. " + tell;
    return "Saved on the canvas as copy " + sid + ", but sending to Claude isn't available here. " + tell;
  }
  function onSend() {
    var el = $("send-status");
    if (sending) return;
    if (!db) { setText(el, "This view cannot send. Use Copy picks."); return; }
    sending = true;
    $("send-picks").setAttribute("aria-disabled", "true");
    setText(el, "Sending…");
    var sid = snapshotId(), all = ids();
    var picked = all.filter(function (cid) { return PICKS.indexOf(row(cid).pick) >= 0; });
    var redo = all.filter(function (cid) { return row(cid).pick === "redesign"; });
    var note = "London canvas picks — " + picked.length + " of " + all.length + " picked, " + redo.length +
      " to redesign. Read db submissions/" + sid + ".";
    // The send starts inside the click (it needs the viewer's gesture), beside the save.
    var sendingP = (!comments ? Promise.resolve("off") : comments.anchorFor($("send")).then(function (anchor) {
      return comments.sendToClaude({ anchor: anchor, text: note });
    }).then(function () { return "sent"; })).catch(function (e) { return (e && e.code) || "error"; });
    var body = { at: new Date().toISOString(), id: sid, notes: state.notes, picks: {} };
    all.forEach(function (cid) { var r = row(cid); body.picks[cid] = { pick: r.pick, note: r.note }; });
    var saving = db.collection("submissions").doc(sid).set(body);
    Promise.all([saving, sendingP]).then(function (r) { setText(el, sendMessage(r[1], sid)); }, function (e) {
      setText(el, "The copy could not be saved (" + ((e && e.code) || "error") + "). Your picks are still here. Press Send again.");
    }).then(function () { sending = false; $("send-picks").setAttribute("aria-disabled", "false"); });

    setText("status", why);
  }
  function connect() {
    var draft = readDraft();
    if (draft && draft.picks) { state.picks = draft.picks; state.notes = typeof draft.notes === "string" ? draft.notes : ""; }
    paintAll(true);
    if (FINAL) { readOnly("Final — the picks are frozen; this page is the record of what was offered."); return; }
    var use = window.claude && window.claude.use;
    if (typeof use !== "function") { readOnly("Read-only view: open the canvas on claude.ai to save picks."); return; }
    use.call(window.claude, "comments").then(function (ns) { if (!ns) return; comments = ns; }, function () {});
    use.call(window.claude, "db").then(function (ns) {
      if (!ns) { readOnly("Read-only view: this canvas has no storage here, so picks cannot be saved."); return; }
      db = ns;
      setText("status", "Connected — picks save as you make them.");
      subscribe();
    }, function () { readOnly("Read-only view: the canvas storage did not answer."); });
  }
  wireFrames();
  wirePicks();
  connect();
})();

#!/usr/bin/env python3
"""Build a city component canvas — one self-contained page the user picks from.

Spec docs/superpowers/specs/2026-09-27-london-component-design-pass-design.md §2. Fifteen
sections in city-page order (scripts/city_components.py); each holds variants A, B and C,
each rendered in its own true-width frame (an iframe whose srcdoc is the fragment wrapped in
the real design tokens) at 375, 768 or 1280, phone first. Frames load lazily, one section at
a time. Each component takes one pick (A, B, C or "none — redesign") and a note, saved in the
canvas's own db; "Send picks to Claude" posts a comment the way the answer board does
(scripts/answer_board_client.js). Without a db the page is a read-only view.

    python3 scripts/build_component_canvas.py [--city london] [--out PATH] [--files-map PATH]
        [--inline-images] [--allow-partial] [--final] [--emit-frames DIR]

--files-map writes the {published path: source path} map of every image a fragment uses, for
the Artifact publish's `files` (a srcdoc frame resolves relative URLs against the page).
--inline-images embeds every image as a data: URI instead — the fallback if the published
page's frames cannot reach its files; refused when the page would pass 15 MB.
--emit-frames writes each variant as a standalone document under DIR, with image URLs that
resolve when DIR is served from the repo root, plus DIR/index.json — the input of
tests/render/canvas.spec.ts. Publish the page with capabilities
{db: {rules: [{path: "", read: "admin", write: "admin"}]}, comments: {}}.

def load_canvas(canvas_dir):
    """({component: {variant: fragment}}, {component: meta}) for the components present."""
    frags, metas = {}, {}
    for cid, _name, _shapes in COMPONENTS:
        d = pathlib.Path(canvas_dir) / cid
        if not d.is_dir():
            continue
        frags[cid] = {v: (d / f"{v}.html").read_text(encoding="utf-8")
                      for v in VARIANT_IDS if (d / f"{v}.html").is_file()}
        m = d / "meta.json"
        metas[cid] = json.loads(m.read_text(encoding="utf-8")) if m.is_file() else {"variants": {}}
    return frags, metas


def frame_tokens(tokens_path=TOKENS):
    """tokens.css as a plain `:root` block: Tailwind's `@theme` means nothing in a frame."""
    return pathlib.Path(tokens_path).read_text(encoding="utf-8").replace("@theme {", ":root {", 1)


def rewrite_assets(fragment, prefixes):
    return _ASSET.sub(lambda m: prefixes[m.group(1)], fragment)


def inline_images(fragment):
    """Every /images/ and /puppies/ URL as a data: URI of the repo file it names."""
    def data_uri(m):
        src = IMAGE_SOURCES[m.group(1)] / m.group(2)
        mime = MIME.get(src.suffix.lower(), "application/octet-stream")
        return f"data:{mime};base64," + base64.b64encode(src.read_bytes()).decode("ascii")
    return _ASSET_FILE.sub(data_uri, fragment)


def frame_document(fragment, prefixes, tokens):
    """One variant as a standalone document: fonts, tokens, the frame base, the fragment.
    `prefixes` None means the images are already inlined."""
    return ("<!doctype html><html lang=\"en-GB\"><head><meta charset=\"utf-8\">"
            "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">"
            f"<link rel=\"stylesheet\" href=\"{FONTS_HREF}\">"
            f"<style>{tokens}</style><style>{FRAME_BASE}</style></head>"
            f"<body><main class=\"canvas-frame\">"
            f"{fragment if prefixes is None else rewrite_assets(fragment, prefixes)}</main>"
            "</body></html>")


def files_map(frags):
    """{published path: repo path} for every image any fragment references."""
    out = {}
    for variants in frags.values():
        for text in variants.values():
            for m in re.finditer(r"/(images|puppies)/([A-Za-z0-9._-]+)", text):
                folder, name = m.group(1), m.group(2)
                src = IMAGE_SOURCES[folder] / name
                if src.is_file():
                    out[f"{folder}/{name}"] = str(src.relative_to(ROOT))
    return dict(sorted(out.items()))


def _blob(obj):
    return (json.dumps(obj, ensure_ascii=False, sort_keys=True)
            .replace("</", "<\\/").replace("<!--", "<\\u0021--"))


def _width_switch(scope):
    return (f'<div class="seg" role="group" aria-label="Preview width{scope}">'
            + "".join(f'<button type="button" data-width="{w}" aria-pressed="{str(w == 375).lower()}">'
                      f'{label} {w}</button>'
                      for w, label in zip(WIDTHS, ("Phone", "Tablet", "Desktop")))
            + "</div>")


def _section(n, cid, name, variants, meta, final):
    rows = (meta.get("variants") or {})
    figs = []
    for v in VARIANT_IDS:
        if v not in variants:
            continue
        r = rows.get(v) or {}
        srcs = ", ".join(pathlib.PurePath(s).name if s.startswith("/") else s
                         for s in (r.get("idea_sources") or []))
        figs.append(
            f'<figure class="variant" data-variant="{v}">'
            f'<figcaption><p class="vname"><b>{v.upper()}</b>{html.escape(r.get("name", ""))}</p>'
            f'<p class="vdesc">{html.escape(r.get("description", ""))}</p>'
            f'<p class="vnew"><strong>New because:</strong> {html.escape(r.get("differs_from", ""))}</p>'
            f'<p class="vsrc">Idea from: {html.escape(srcs)}</p></figcaption>'
            f'<div class="stage"><div class="stage-inner">'
            f'<p class="loading">Loading the preview…</p>'
            f'<iframe title="{html.escape(name)} — variant {v.upper()}" data-key="{cid}/{v}" '
            f'width="375" height="480" tabindex="-1"></iframe></div></div></figure>')
    dis = " disabled" if final else ""
    opts = "".join(
        f'<label><input type="radio" name="pick-{cid}" value="{val}"{dis}> {label}</label>'
        for val, label in (("a", "A"), ("b", "B"), ("c", "C"), ("redesign", "None — redesign")))
    device = ' data-frame="device"' if cid in DEVICE_FRAMES else ""
    return (f'<section class="comp" id="c-{cid}" data-component="{cid}" data-width="375"{device} '
            f'aria-labelledby="h-{cid}">'
            f'<div class="comp-head"><h2 id="h-{cid}">{n}. {html.escape(name)}</h2>'
            f'{_width_switch(" for " + html.escape(name))}</div>'
            f'<div class="variants">{"".join(figs)}</div>'
            f'<fieldset class="pick" data-pick="{cid}"><legend>Your pick for {html.escape(name)}</legend>'
            f'<div class="opts">{opts}</div>'
            f'<label class="lab" for="note-{cid}">Note (what to keep, what to change)</label>'
            f'<textarea id="note-{cid}" data-note="{cid}" rows="2" autocomplete="off"{dis}></textarea>'
            f'</fieldset></section>')


def render_page(frags, metas, tokens, final=False, inline=False):
    frames = {f"{cid}/{v}": (frame_document(inline_images(text), None, tokens) if inline
                             else frame_document(text, CANVAS_ASSETS, tokens))
              for cid, variants in frags.items() for v, text in variants.items()}
    names = [(cid, name) for cid, name, _s in COMPONENTS if cid in frags]
    toc = "".join(f'<li><a href="#c-{cid}" data-toc="{cid}"><span class="dot" aria-hidden="true"></span>'
                  f'{i}. {html.escape(name)}</a></li>' for i, (cid, name) in enumerate(names, 1))
    sections = "".join(_section(i, cid, name, frags[cid], metas.get(cid, {}), final)
                       for i, (cid, name) in enumerate(names, 1))
    client = CLIENT_JS.read_text(encoding="utf-8").replace("<\/script", "<\\/script")
    banner = ('<p class="final" role="note">Final — these picks are frozen and saved in the repo. '
              'The page is kept as the record of what was offered.</p>') if final else ""
    dis = " disabled" if final else ""
    return f"""<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{html.escape(TITLE)}</title>
<link rel="stylesheet" href="{FONTS_HREF}">
<style>{CSS}</style></head><body data-final="{str(final).lower()}">
<div class="wrap">
<header><p class="eyebrow">BlueStaffyUK · project 5 · the London page</p>
<h1 class="title">{html.escape(TITLE)}</h1>
<p class="lede">Fifteen components of the London page, three new designs each, on the real
BlueStaffyUK tokens. Pick A, B or C for each one, or "None — redesign" with a note, then send
your picks. Previews start at phone width; switch any section, or all of them, to tablet or
desktop. The dial and the jump links scroll inside their own frames, so you can see them stick.
Copy in the previews is placeholder London copy; reviews are marked placeholders.</p>
{banner}</header>
<div class="bar" role="region" aria-label="Progress and preview width">
<p class="count"><b id="picked">0</b> / <b id="total">{len(names)}</b><span> picked</span></p>
{_width_switch(" for every section").replace('class="seg"', 'class="seg" id="all-widths"')}
<p id="status" class="status" role="status">Connecting to the canvas…</p>
</div>
<nav class="toc" aria-label="Components"><ol>{toc}</ol></nav>
{sections}
<section class="comp send" id="send" aria-labelledby="h-send">
<h2 id="h-send">Anything else, then send</h2>
<label class="lab" for="general-notes">General notes</label>
<textarea id="general-notes" rows="4" autocomplete="off"{dis}></textarea>
<p><button type="button" class="btn" id="send-picks"{dis}>Send picks to Claude</button>
<button type="button" class="btn ghost" id="copy-picks">Copy picks</button></p>
<p id="send-status" class="status" role="status"></p>
</section>
</div>
<script type="application/json" id="frames">{_blob(frames)}<\/script>
<script>{client}<\/script>
</body></html>
"""


def emit_frames(frags, out_dir, tokens):
    """Write each variant as a standalone document under out_dir, plus index.json. The files
    the previous index listed are removed first, so a dropped variant cannot linger and be
    measured."""
    out_dir = pathlib.Path(out_dir)
    old = out_dir / "index.json"
    if old.is_file():
        for row in json.loads(old.read_text(encoding="utf-8")):
            stale = ROOT / row["path"]
            if stale.is_file() and out_dir.resolve() in stale.resolve().parents:
                stale.unlink()
    index = []
    for cid, variants in frags.items():
        for v, text in variants.items():
            p = out_dir / cid / f"{v}.html"
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_text(frame_document(text, SERVED_ASSETS, tokens), encoding="utf-8")
            index.append({"component": cid, "variant": v,
                          "path": str(p.resolve().relative_to(ROOT))})
    (out_dir / "index.json").write_text(json.dumps(index, indent=1) + "\n", encoding="utf-8")
    return index


def main(argv=None):
    ap = argparse.ArgumentParser(description="Build a city component canvas.")
    ap.add_argument("--city", default="london")
    ap.add_argument("--out")
    ap.add_argument("--files-map")
    ap.add_argument("--inline-images", action="store_true")
    ap.add_argument("--allow-partial", action="store_true")
    ap.add_argument("--final", action="store_true")
    ap.add_argument("--emit-frames")
    a = ap.parse_args(argv)
    frags, metas = load_canvas(CANVAS_ROOT / a.city)
    tokens = frame_tokens()
    if a.emit_frames:
        index = emit_frames(frags, a.emit_frames, tokens)
        print(f"{a.emit_frames}: {len(index)} frames from {len(frags)} components")
        if not index:
            print("emitted 0 frames — nothing to render, not a pass")
            return 1
        return 0
    complete = len(frags) == len(COMPONENTS) and all(len(v) == 3 for v in frags.values())
    if not complete and not a.allow_partial:
        print(f"the {a.city} canvas holds {sum(len(v) for v in frags.values())} of "
              f"{len(COMPONENTS) * 3} variants; pass --allow-partial to build it anyway",
              file=sys.stderr)
        return 1
    out = pathlib.Path(a.out or ROOT / "docs" / "artifacts" / f"bsuk-{a.city}-component-canvas.html")
    page = render_page(frags, metas, tokens, final=a.final, inline=a.inline_images)
    if len(page.encode("utf-8")) > MAX_PAGE_BYTES:
        print(f"the page would be {len(page.encode('utf-8'))} bytes, over the 15 MB budget; "
              "publish with --files-map instead of --inline-images", file=sys.stderr)
        return 1
    out.parent.mkdir(parents=True, exist_ok=True)
    out.write_text(page, encoding="utf-8")
    print(f"{out} — {len(page.encode('utf-8'))} bytes, "
          f"{sum(len(v) for v in frags.values())} variants")
    if a.files_map:
        fm = files_map(frags)
        pathlib.Path(a.files_map).write_text(json.dumps(fm, indent=1) + "\n", encoding="utf-8")
        print(f"{a.files_map} — {len(fm)} images")
    return 0


if __name__ == "__main__":
    sys.exit(main())

Create `tests/render/canvas.spec.ts` (the probes for the other twelve components are added in
Tasks 6–9, inside the same `PROBES` object; the helpers they use are here already):

```typescript
import { test, expect, type Page } from '@playwright/test';
import { readFileSync, existsSync } from 'node:fs';
import { resolve, dirname } from 'node:path';
import { fileURLToPath } from 'node:url';
import { registry } from './lib/registry.js';
import { runCheck } from './lib/runCheck.js';
import './checks/layout.js';
import './checks/a11y.js';
import './checks/img.js';

/**
 * The London component canvas smoke (docs/superpowers/plans/2026-09-27-london-component-design-pass.md).
 * Every variant frame scripts/build_component_canvas.py --emit-frames wrote is painted at 375,
 * 768 and 1280 and held to:
 *   - the registered checks in REUSED, run as they are (no second copy of their logic);
 *   - the component's own probe in PROBES (the hero's photo-first rule, the jump links'
 *     sticky strip, the dial's desktop-only display, the six puppy cards, …), keyed on the
 *     data hooks scripts/check_city_canvas.py HOOKS requires.
 * A variant that fails here is fixed in its fragment, never excused here.
 */
const here = dirname(fileURLToPath(import.meta.url));
const REPO = resolve(here, '../..');
const INDEX = resolve(REPO, 'docs/artifacts/canvas/london-frames/index.json');
const REUSED = [
  'layout-no-horizontal-overflow',
  'layout-min-font-size',
  'layout-tap-target-size',
  'layout-table-stacks-on-mobile',
  'a11y-text-contrast-aa',
  'a11y-no-duplicate-ids',
  'img-alt-present-and-unique',
];
const CTX = { pageType: 'location', slug: 'canvas', siblings: async () => [] };
const PUPPY_NAMES: string[] = JSON.parse(readFileSync(resolve(REPO, 'data/puppies.json'), 'utf8'))
  .map((p: { name: string }) => p.name);

type Probe = (page: Page, viewport: number) => Promise<string[]>;

/** Every element carrying `attr` is painted (a box of at least 1×1 and not visibility:hidden). */
async function allVisible(page: Page, attr: string): Promise<string[]> {
  const hidden = await page.evaluate((a) => Array.from(document.querySelectorAll(`[${a}]`))
    .filter((el) => {
      const b = el.getBoundingClientRect();
      return b.width < 1 || b.height < 1 || getComputedStyle(el).visibility === 'hidden';
    }).length, attr);
  return hidden ? [`${hidden} [${attr}] element(s) are not painted`] : [];
}

/** Every in-frame jump link inside `scope` lands on an element that exists. */
async function anchorsResolve(page: Page, scope: string): Promise<string[]> {
  const dead = await page.evaluate((s) => Array.from(document.querySelectorAll(`${s} a[href^="#"]`))
    .map((a) => a.getAttribute('href')!.slice(1))
    .filter((id) => id && !document.getElementById(id)), scope);
  return dead.length ? [`jump links to missing ids: ${dead.join(', ')}`] : [];
}

/** Painted, or not, as a whole: display none on the element or an ancestor reads as hidden. */
async function isShown(page: Page, sel: string): Promise<boolean> {
  return page.evaluate((s) => {
    const el = document.querySelector(s);
    if (!el) return false;
    const b = el.getBoundingClientRect();
    return b.width > 0 && b.height > 0 && getComputedStyle(el).visibility !== 'hidden';
  }, sel);
}

/** Images that finished loading with no pixels: a poster or photo path that is wrong. */
async function brokenImages(page: Page): Promise<string[]> {
  const n = await page.evaluate(() =>
    Array.from(document.images).filter((i) => i.complete && i.naturalWidth === 0).length);
  return n ? [`${n} image(s) failed to load`] : [];
}

/** Every field and button a person presses inside `scope` is at least 44px tall. */
async function fieldsTall(page: Page, scope: string): Promise<string[]> {
  const short = await page.evaluate((s) => Array.from(document.querySelectorAll(
    `${s} input:not([type="hidden"]), ${s} select, ${s} textarea, ${s} button`))
    .filter((el) => el.getBoundingClientRect().height < 44)
    .map((el) => el.getAttribute('name') || el.tagName.toLowerCase()), scope);
  return short.length ? [`under 44px tall: ${short.join(', ')}`] : [];
}

const PROBES: Record<string, Probe> = {
  hero: async (page, viewport) => {
    const out: string[] = [];
    if (viewport >= 1024) {
      // rules/design.md rule 10: the band is 390–450px tall on desktop, auto on a phone.
      const band = await page.evaluate(() =>
        Math.round(document.querySelector('[data-component="hero"]')!.getBoundingClientRect().height));
      if (band < 390 || band > 450) out.push(`hero band is ${band}px tall at ${viewport}px; rule 10 wants 390–450`);
    }
    const h = await page.evaluate(() => {
      const pic = document.querySelector('main img, main picture');
      const head = document.querySelector('main h1, main h2');
      if (!pic || !head) return 'a hero frame needs a photo and a heading';
      if (!(head.compareDocumentPosition(pic) & Node.DOCUMENT_POSITION_PRECEDING)) {
        return 'the heading precedes the photo in source';
      }
      const oneCol = document.documentElement.clientWidth <= 900;
      if (oneCol && pic.getBoundingClientRect().top >= head.getBoundingClientRect().top) {
        return 'the photo paints below the heading on a one-column width';
      }
      return '';
    });
    if (h) out.push(`hero-image-first: ${h}`);
    return out;
  },
  'counter-strip': (page) => allVisible(page, 'data-figure'),
  'trust-strip': (page) => allVisible(page, 'data-trust-item'),
};

type Frame = { component: string; variant: string; path: string };
const frames: Frame[] = existsSync(INDEX) ? JSON.parse(readFileSync(INDEX, 'utf8')) : [];

test('the frames were emitted', () => {
  expect(frames.length,
    'run: python3 scripts/build_component_canvas.py --emit-frames docs/artifacts/canvas/london-frames')
    .toBeGreaterThan(0);
});

for (const f of frames) {
  test(`${f.component}/${f.variant}`, async ({ page }, testInfo) => {
    const viewport = testInfo.project.use.viewport!.width;
    const res = await page.goto('/' + f.path);
    expect(res?.status()).toBe(200);
    await page.evaluate(() => document.fonts.ready);
    // CANVAS_SHOTS=<dir> keeps a full-frame PNG of every variant at every width, for the
    // impeccable and frontend-design passes to read. Outside the repo, never committed.
    if (process.env.CANVAS_SHOTS) {
      await page.screenshot({ fullPage: true,
        path: resolve(process.env.CANVAS_SHOTS, `${f.component}-${f.variant}-${viewport}.png`) });
    }
    const failures: string[] = [];
    for (const id of REUSED) {
      const check = registry.find((c) => c.id === id);
      expect(check, `${id} is registered`).toBeTruthy();
      const r = await runCheck(check!, page, viewport, CTX);
      for (const d of r.defects) failures.push(`${id}: ${d.message}`);
    }
    await page.evaluate(() => window.scrollTo(0, 0));
    const probe = PROBES[f.component];
    if (probe) failures.push(...(await probe(page, viewport)));
    expect(failures, `${f.component}/${f.variant} at ${viewport}px`).toEqual([]);
  });
}
```
