<script type="text/markdown" data-title="Context">
BlueStaffyUK rebuild, the bridge build between project 4 and project 5. Written by hand from
the two full runs taken at close-out, the question files and raw sources under
`data/queries/`, the spend log, and the branch history. Date 2026-09-23. Branch
`query-augmentation`, cut from `foundation` at `db37ca1`; no remote, nothing pushed, **not yet
merged** — the merge waits for the user.

Spec: `docs/superpowers/specs/2026-09-23-query-augmentation-design.md`. Sections §1–§13 are the
definition of done **as amended by §14 (amendments 1–21)**; the checklist at the end answers
each section in its amended form. Where a section's literal text and an amendment disagree, the
amendment wins, and every deviation in the checklist names the amendment that records it.

This build ships tooling, not pages. No city page was built and no page entered
`data/facts/rebuilt.json`, so the new gate examines the two question files and holds both as
awaiting their project 5 rebuild. Every figure below comes from the two close-out runs or from a
command re-run at close-out; none is typed from memory.

---
</script>

<script type="text/markdown" data-title="Two clean runs">
Both runs of `npm run build && npm run test:py && npm run check:all` exited **0**, and every
summary line in the table above was the same on run 1 and run 2 (compared line by line after
the run; only elapsed times differ). Pytest moved **1703 → 2071 passed** against project 4's
close: the three new test files (159, 39 and 3 test functions), plus the parrot-residue and package-script
additions (`tests/py/test_agent_facts.py`, `tests/py/test_package_scripts.py`). The placeholder
total fell 1748 → 1730.

**Why the new gate examines 0 pages.** A question file is gated only once its page is built
and its bare slug is in `data/facts/rebuilt.json` (amendment 15). Neither Manchester nor Leeds
has been rebuilt — that is project 5, after Known Issue 39 — so the gate reports both as
awaiting rebuild and passes. Its five rules are proved by `tests/py/test_query_coverage_check.py`,
a passing and a failing fixture each.
</script>
<script type="text/markdown" data-title="The pilot — Manchester">
`blue-staffy-puppies-manchester-uk`, primary keyword "blue staffy puppies manchester", route
`/uk-locations/blue-staffy-puppies-manchester-uk/`. Commits `5666007` (pilot), `99b7d5c` and
`4dcbc35` (real headings), `312ff0a` (threads, the `bsuk-reddit-threads` GREEN run).

**Three paid DataForSEO calls**, each preflighted, each logged in `data/queries/spend.json`:

| Source | Endpoint | Logged cost | Outcome |
|---|---|---:|---|
| `serp_google` | `serp_organic_live_advanced`, Google, depth 10, PAA | $0.05 | **ok** — 6 People Also Ask and 6 related searches, top-10 URLs |
| `serp_bing` | `serp_organic_live_advanced`, Bing, depth 10 | $0.05 | **off-topic** — results were for "blue" alone; logged, not used |
| `ai_engines` | `ai_optimization_chat_gpt_scraper`, UK | $0.10 | **ok** — 16 questions from the ChatGPT answer |
| **Total** | | **$0.20** | |

**The Bing source that was used.** The paid Bing response was unusable, so Bing was read
**free in the built-in browser** at `bing.com` with `cc=GB`
(`data/queries/raw/blue-staffy-puppies-manchester-uk/serp_bing.json`, `status: ok`, ten results,
no People Also Ask box shown). That became the rule: the skill never buys or preflights
`serp_bing`, and `query_augment.py --record --source serp_bing` exits 2 (amendment 5,
`c22a3e2`).

**The cost is an estimate.** The connector's responses carry no cost field. Each call was
logged at a conservative figure and the endpoint text says so; `query_typical_call_usd` was
raised to the largest estimate, 0.10 (amendment 6). The real figure is on the DataForSEO
dashboard — Known Issue 45.

**Competitors.** Every Google and Bing top-5 result for the keyword is a marketplace or
directory: Pets4Homes, Staffie Owners, Freeads, Gumtree and puppies.co.uk, eight distinct URLs
once merged. By user ruling they count (amendment 1). Each page's HTML was saved to the
gitignored cache and read by `query_augment.py --extract-h2`; advert-card titles and navigation
headings are dropped, so the raw counts (up to 22 H2s) clean to **0 real sections on every
page**, and one Freeads page was a challenge page, recorded as `blocked` and never counted.
Matched 0 + 3 extras = 3, below the floor, so `section_target.total` is **9** via the floor
(amendment 4). Extra topics: temperament, paperwork, health.

**Questions.** 105 entries after merge and collapse; 29 `must_answer`; 31 blocked as
"unverified fact". Evidence types: bank 85, threads 21, ChatGPT 16, Google PAA 6, Google related
6. **All 20 FAQ picks are fact-backed** (top 6, middle 7, bottom 7).

**Threads.** Eight Reddit threads kept with permalink, posted month, reply count and score
(r/StaffordBullTerriers, r/UK_Pets, r/puppy101), all within 24 months, 21 questions, each
paraphrased and linked to a bank row only where that row answers it.
</script>

Eight competitor URLs, again marketplaces and directories plus one breeder page that sets the

<script type="text/markdown" data-title="RED baselines and how each skill closes them">
Both skills were written with `superpowers:writing-skills`: a subagent ran the task without the
skill (RED), its failures became rules, and a fresh subagent re-ran it with the skill (GREEN)
until it complied.

**`bsuk-reddit-threads`** (`c72033b`, then `1c40862` and `b105956` from the GREEN runs):

| Baseline failure | Where the skill closes it |
|---|---|
| Old threads used while recent ones existed | Step C and Common mistakes: nothing older than 24 months while 5 recent threads exist; an old one carries `"stale": true` |
| No audit trail of the threads searched | Step E: a `threads` audit list, each with `posted`, `replies` and `score`; Common mistakes forbids `questions` without it |
| Stopping at the first blocked fetch | Step B's ladder table (which rung works per site); `NOT FETCHED` only after the ladder |
| `fact_source` linked by topic, not by answer | "Linking `fact_source`": `bank:<id>` only when the row answers the question |
| The poster's premise carried into the question | Common mistakes: ask the neutral question, never reshape it to fit a bank answer (`b105956`) |
| Questions kept from threads with no UK signal | Common mistakes: a question whose every thread scores 0 for UK signal is dropped (`1c40862`) |

**`bsuk-query-augmentation`** (`4ee6a25`, then `10cd568` and `3aa5e4f`; the RED run was Leeds):

| Baseline failure | Where the skill closes it |
|---|---|
| PAA taken without loading the page, and a Google robot check treated as an obstacle | Step 2: PAA only from a page actually loaded; a robot check is `NOT FETCHED`, never got past |
| FAQ picks swapped by hand (age at collection, lifespan) | Common mistakes: never hand-swap a pick — change the data and rebuild |
| City wording added so an answer reached past its fact | Common mistakes: never invent or localise a city-named question beyond its fact |
| An answer stating a figure the fact does not give (a guarantee length) | Common mistakes: no figure the fact source does not give |
| A topic judged "covered" because a competitor's FAQ mentioned it | Step 3 and Common mistakes: only counted body H2s cover a topic |
| Browser snapshots and logs written into the repo | Working rules and Common mistakes: browser files stay out of the repo |
| The script run in a scratch copy of the repo ("dry run") | Common mistakes: never copy the repo to run the script |
</script>

<script type="text/markdown" data-title="Definition of done — spec §1–§13, as amended by §14">
| § | Section (amended) | Verdict | Evidence |
|---|---|---|---|
| 1 | Decisions | **PASS-WITH-DEVIATION** | All nine decisions built: thread half only (`bsuk-reddit-threads`); DataForSEO first, free fallback, bank always; every builder calls the skill (`805030b`); question file plus gate in `check:all`; the skill calls the connector, the scripts never do; RED/GREEN skills and TDD scripts. **Deviations:** decision 7's "15–20" is effectively 17–20 (§14.13); decision 8's count has a floor of 9 (§14.4) |
| 2 | Components | **PASS-WITH-DEVIATION** | Every new file exists (Summary table); `data/port-manifest.json` 190 rows, `reddit-strategy` re-filed and the ten unrecorded source files named with reasons (`870799a`); `docs/reference/system-registry.md` regenerated, 57 skills; Known Issue 17 closed. **Deviations:** no recorded fixtures under `tests/py/fixtures/queries/` — tests build synthetic data (§14.20); raw files split into `.response.json` and normalised `.json` and competitor HTML cached, gitignored (§14.3, §14.8); two more budget keys (§14.9) |
| 3 | Data flow | **PASS-WITH-DEVIATION** | Preflight → call → record → save → normalise, one preflight per call, shown by the Manchester spend log's three rows; free ladder and `NOT FETCHED` shown by Leeds; merge writes both question files; the gate runs in `check:all`. **Deviations:** Bing is a free browser read, never bought (§14.5); one AI engine (§14.7); response and normalised files (§14.8); exits 0–6, not 0/3/4 (§14.14); the gate waits for the rebuild (§14.15) |
| 4 | The question file | **PASS-WITH-DEVIATION** | `schemas/queries.schema.json`; both files validate; deterministic scoring, dedupe and the fact rule in `scripts/query_augment.py` with 159 tests; every `must_answer` has a real `fact_source`; blocked questions carry `"unverified fact"`. **Deviations:** buyer wording, collapse and scoring as built (§14.12); `fact_source` form (§14.11); schema additions to the example (§14.18) |
| 5 | FAQ rules | **PASS-WITH-DEVIATION** | Both files: 20 picks, top 6 · middle 7 · bottom 7, all 20 fact-backed; at most two per topic per block; the run stops with exit 5 when short. **Deviation:** effective floor 17 (§14.13) |
| 6 | Location section rule | **PASS-WITH-DEVIATION** | Both files record every competitor's URL, Google and Bing position, raw and cleaned count, `blocked` and `outlier`, and `section_target` with `set_by`; Manchester 0 + 3 → 9, Leeds 3 + 3 → 9. **Deviations:** marketplaces count (§14.1); one query per engine (§14.2); headings from saved pages by `--extract-h2` (§14.3); floor 9 (§14.4); frame ids (§14.16); a usable page has 3+ clean H2s (§14.21) |
| 7 | The converted template | **PASS-WITH-DEVIATION** | `docs/reference/location-page-template.md` (`c730a36` and follow-ups) passes the fact lint and the path guard. **Deviation:** the law row is `LEGAL_CLAIM_PLACEHOLDER`, not "not banned" (§14.17) — Known Issue 46 |
| 8 | Spend cap | **PASS-WITH-DEVIATION** | `data/queries/spend.json` three rows, $0.20 of $1; preflight refuses over-budget, bad costs, damaged logs and a half-finished call (`cc2087f`, `cfcb1f0`); cached responses never re-bought. **Deviations:** no cost field, estimates logged (§14.6); per-page-per-day and total budgets (§14.9); only real responses count as cached (§14.10) |
| 9 | Failure handling | **PASS-WITH-DEVIATION** | Leeds exercised the fallback row (`serp_google: fallback`, `ai_engines: NOT FETCHED`, `competitors: fallback`); Manchester's blocked competitor recorded, not counted; short runs exit 5; budget exit 4, tested. **Deviations:** Bing never via DataForSEO (§14.5); fallback files don't block a bought call (§14.10); the short-FAQ floor (§14.13) |
| 10 | The gate | **PASS-WITH-DEVIATION** | `scripts/query_coverage_check.py` in `check:all`; 39 tests, a passing and failing fixture per rule; prints `examined 0 pages (0 not built, 2 awaiting rebuild); 0 problems` on both runs. **Deviations:** gated only once rebuilt; three-block rules on location pages only; extra headings are H2s in `<main>` (§14.15); body sections defined by the frame (§14.16); target includes the floor (§14.4) |
| 11 | Build order | **PASS-WITH-DEVIATION** | Steps 1–8 done in order, commits `c730a36` to `870799a`, with Tasks 7a and 7b inserted after the pilot; step 9's review is approved and this report is written. **Deviations:** the pilot showed Bing cannot come from DataForSEO (§14.5) and set the typical cost from estimates (§14.6). **Outstanding, by instruction:** the merge into `foundation` and the session closer wait for the user |
| 12 | Testing | **PASS-WITH-DEVIATION** | Pytest covers merge, dedupe, scoring, blocks, fact rule, preflight exits, outlier guard and the five gate rules; no live calls; both RED baselines recorded and closed (section above); the fact lint, frontmatter, table lint, path guard, registries and marker gate all green twice. **Deviation:** synthetic data, not recorded fixtures (§14.20) |
| 13 | Out of scope | **PASS** | No city page built and none in `data/facts/rebuilt.json`; the twelve project 4 pages untouched by the gate; no per-city bands; no scheduled refresh. Reddit-modifier pages and the visual-intelligence audit are Known Issues 43 and 44; the project 5 prerequisite is recorded (§14.19, Known Issue 39) |

**Verdict count: 1 PASS · 12 PASS-WITH-DEVIATION · 0 FAIL.**

Every deviation is an amendment in §14 made during execution — a user ruling, a review finding
or a plan refinement — and none weakens a gate. The count reads heavy because this was a spec
written before the pilot: the pilot is what showed that Bing had to be read free, that the
connector reports no cost, and that the ranking pages are all marketplaces with no real
sections, and the amendments are those findings written down.
</script>

    sec.appendChild(body);doc.appendChild(sec);

  });
  document.getElementById('copy-all').addEventListener('click',function(){copy('# BlueStaffyUK Rebuild — Bridge build: Query augmentation gate report\n\n'+all.join('\n\n'),document.getElementById('all-status'));});
