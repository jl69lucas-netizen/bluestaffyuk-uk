<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>headings that step down</title>
<!-- Each H3 at or below its section's H2 and each H4 at or below its H3. A kit component's
     heading sets its own type and is not in the chain: the FAQ question below is 24px and
     is not compared. -->
<style>
  body { margin: 0; font: 17px/1.65 Georgia, serif; }
  main { padding: 0 24px; }
  h2 { font-size: 22px; } h3 { font-size: 18px; } h4 { font-size: 17px; }
  .kit-faq h3 { font-size: 24px; }
</style>
</head><body>
<main>
  <section class="bl-box"><h2>Blue Staffy Puppies for Sale</h2>
    <div class="bl-stub"><h3>What Each Card Tells You</h3><p>Prose.</p></div>
    <div class="kit-faq"><h3>A Question?</h3></div></section>
  <section><h2>Health</h2><h3>Screening</h3><h4>Eyes and Elbows</h4><p>Prose.</p></section>
</main>
</body></html>
