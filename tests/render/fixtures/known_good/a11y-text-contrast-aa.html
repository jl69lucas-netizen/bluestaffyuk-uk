<!doctype html><meta charset=utf-8><title>known-good: the dial index has a light-theme colour</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<style>
  body { margin:0; background:#faf7f4; font:16px/1.5 system-ui; padding:16px; }
  .tdial { background:#fff; padding:12px; border-radius:16px; }
  /* #5d7d6a = 4.62:1 on #fff. Measured in Python, not eyeballed. */
  .ti { color:#5d7d6a; font-size:13px; }
  .tt { color:#2b2018; font-size:13px; }
  /* Large text legitimately clears at 3:1 — the check must honour the WCAG large-text
     branch rather than demanding 4.5 everywhere. #767676 on #fff = 4.54:1 anyway, so use
     a value that only passes BECAUSE it is large: #8a8a8a = 3.13:1 at 26px. */
  .big { color:#8a8a8a; font-size:26px; }
  .over-photo { background-image:linear-gradient(90deg,#fff,#000); color:#888; }
  .over-glass { background:rgba(255,255,255,.5); color:#999; }
  /* Tailwind v4 emits oklab() for opacity modifiers. The check declines to judge a
     translucent foreground (alpha < 1) rather than composite it; the `.solid` link below
     exercises the judged, opaque oklab() path. The old regex parser read "1 0 0 / .85" as
     rgb(1,0,0) and reported ~3.3:1 here. */
  .nav-green { background:#2D6A4F; padding:8px; }
  .nav-green a { color: oklab(1 0 0 / 0.85); font-size:15px; }
  /* Opaque oklab() must still resolve to real channels, not the raw L/a/b numbers read as
     rgb() — opaque white here is a genuine AA pass on forest green (~11.7:1). */
  .nav-green .solid { color: oklab(1 0 0); }
</style>
<nav class="tdial"><ul>
  <li><a><span class="ti">1</span><span class="tt">The Three Pairs</span></a></li>
  <li><a><span class="ti">2</span><span class="tt">What Proven Means</span></a></li>
</ul></nav>
<p class="big">Large text clears at three to one.</p>
<p class="over-photo">Text on a gradient has no single backdrop colour.</p>
<p class="over-glass">Text on a translucent layer composites by paint order.</p>
