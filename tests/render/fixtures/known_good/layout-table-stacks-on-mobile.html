<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a table that stacks</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font: 16px/1.5 system-ui; }
  main { padding: 16px; }
  table { border-collapse: collapse; width: 100%; }
  td, th { padding: 6px 10px; border-bottom: 1px solid #d8d8d8; text-align: left; }
  /* The shipped rules, copied from src/styles/global.css so the fixture is judged against
     the same stack the site resolves — a fixture with its own gentler CSS would pass a
     table the real page would fail. */
  @media (max-width: 640px) {
    .stack-table, .stack-table thead, .stack-table tbody, .stack-table tr,
    .stack-table td, .stack-table th, .stack-table caption { display: block; }
    .stack-table thead { position: absolute; left: -9999px; }
    .stack-table td, .stack-table th { border: 0; padding: 4px 0; }
    .stack-table td[data-label]::before { content: attr(data-label) ": "; font-weight: 600; }
    .stack-table tr { border-bottom: 1px solid #d8d8d8; padding: 8px 0; }
  }
</style>
</head><body>
<main>
  <h1>Delivery</h1>
  <table class="stack-table">
    <caption>Home delivery bands</caption>
    <thead><tr><th scope="col">Band</th><th scope="col">Distance</th><th scope="col">Cost</th></tr></thead>
    <tbody>
      <tr><th scope="row">Near</th><td data-label="Distance">Under 100 miles</td><td data-label="Cost">200</td></tr>
      <tr><th scope="row">Mid</th><td data-label="Distance">100 to 250 miles</td><td data-label="Cost">275</td></tr>
      <tr><th scope="row">Far</th><td data-label="Distance">Over 250 miles</td><td data-label="Cost">350</td></tr>
    </tbody>
  </table>
</main>
</body></html>
