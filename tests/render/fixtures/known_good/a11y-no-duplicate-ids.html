<!doctype html><meta charset=utf-8><title>known-good: every id on the page is unique</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<!--
  Six section ids, a heading id used by aria-labelledby and a form control id used by a
  label's `for` — the three ways a page depends on an id resolving to exactly one element.
  Fixtures are test data, so hex is spelled here; the no-hex rule scans src/.
-->
<style>body{margin:0;font:16px/1.5 system-ui;color:#1B2430;background:#F4F1EA;padding:16px}section{min-height:60px}</style>
<nav aria-labelledby="nav-title">
  <p id="nav-title">On this page</p>
  <a href="#s1">Health</a><a href="#s2">Delivery</a><a href="#s3">Deposit</a>
  <a href="#s4">Puppies</a><a href="#s5">FAQ</a><a href="#s6">Contact</a>
</nav>
<main>
  <section id="s1"><h2>Health</h2></section>
  <section id="s2"><h2>Delivery</h2></section>
  <section id="s3"><h2>Deposit</h2></section>
  <section id="s4"><h2>Puppies</h2></section>
  <section id="s5"><h2>FAQ</h2></section>
  <section id="s6"><h2>Contact</h2>
    <label for="enquiry-name">Your name</label><input id="enquiry-name" name="name">
  </section>
</main>
