<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>sizes that matches its box</title>
<style>
  body { margin: 0; font: 16px/1.5 system-ui; }
  /* A FIXED box at every viewport, so the fixture states one number and the check's own
     resolution is the only variable. The real heroes are fluid; that is what the built pages
     measure. */
  .kit-hero .pic { display: block; width: 300px; height: auto; }
</style>
</head><body>
<div class="kit-hero">
  <img class="pic"
       src="../assets/narrow-400.png"
       srcset="../assets/narrow-400.png 400w, ../assets/wide-1600.png 1600w"
       sizes="300px"
       alt="A blue Staffy puppy sitting on a garden step">
</div>
</body></html>
