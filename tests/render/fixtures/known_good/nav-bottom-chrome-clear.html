<!doctype html><meta charset=utf-8><title>known-good: a fixed bottom bar that reserves its own height</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<!--
  A 64px fixed bottom bar, and `body { padding-bottom: 64px }` reserving exactly that. The
  short final section is the unit that matters: scrollIntoView() on a tall section lands its
  top at the viewport top and can never be under the bar, so a fixture made only of tall
  sections would pass this check with the padding taken away too. The reservation buys the
  document 64px of extra scroll, which is what lifts #s6's top clear of the bar.
  Fixtures are test data, so hex is spelled here; the no-hex rule scans src/.
-->
<style>
  body { margin:0; font:16px/1.5 system-ui; color:#1F3A52; background:#F4F1EA; padding-bottom:64px; }
  nav.jumps { padding:16px; }
  nav.jumps a { display:inline-block; min-height:24px; padding:4px 8px; color:#1F3A52; }
  section { padding:24px 16px; }
  #s1,#s2,#s3,#s4,#s5 { min-height:70vh; }
  #s6 { min-height:0; height:40px; padding:0 16px; }
  .tabbar { position:fixed; left:0; right:0; bottom:0; height:64px; background:#FAF8F3; border-top:1px solid #DAD6CC; display:flex; align-items:center; justify-content:space-around; }
</style>

</nav>
