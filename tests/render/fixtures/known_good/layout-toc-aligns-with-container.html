<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>contents chips on the page's container edge</title>
<!-- The contents list takes the container's own box, so its chips start where the date does.
     A contents list the page hides (the dial's width) is not judged. -->
<style>
  body { margin: 0; font: 17px/1.65 Georgia, serif; }
  .container { max-width: 300px; margin-inline: auto; padding-inline: 24px; }
  .page-body > .page-toc { max-width: 300px; margin-inline: auto; padding-inline: 24px; }
  .toc ul { display: flex; gap: 8px; list-style: none; padding: 0; margin: 0; }
  .hidden { display: none; }
</style>
</head><body>
<main>
  <div class="page-shell"><div class="page-body">
    <div class="container post-date"><p>Last updated: 21 September 2026</p></div>
    <div class="kit-nav page-toc"><nav class="toc"><ul><li><a href="#a">Buy</a></li><li><a href="#b">Guide</a></li></ul></nav></div>
    <div class="kit-nav page-toc hidden"><nav class="toc"><ul><li><a href="#c">Hidden</a></li></ul></nav></div>
  </div></div>
</main>
</body></html>
