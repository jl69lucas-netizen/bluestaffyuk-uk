<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>headings within three lines</title>
<!-- Short headings stay within three lines at every width; a kit component's heading is judged
     by its own checks and is not examined here. -->
<style>
  body { margin: 0; font: 17px/1.65 Georgia, serif; }
  main { padding: 0 24px; max-width: 360px; }
  h2 { font-size: 22px; line-height: 1.18; } h3 { font-size: 18px; line-height: 1.25; }
  .kit-card h3 { font-size: 30px; }
</style>
</head><body>
<main>
  <h2>How to Reach Us</h2>
  <p>Prose.</p>
  <h3>What You Give Us When You Enquire</h3>
  <div class="kit-card"><h3>A Kit Card Heading That Runs On for Many Words Across Many Lines in Its Box</h3></div>
</main>
</body></html>
