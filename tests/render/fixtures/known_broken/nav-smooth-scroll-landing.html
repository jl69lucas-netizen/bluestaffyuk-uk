<!doctype html>
<!--
  Pins the 2026-09-13 flake in `nav-jump-target-lands`, a BLOCKING check.

  /african-grey-parrots-for-sale-near-me/ @1280 failed once, then passed twice on the
  identical dist/, with "1 of 49 in-page links land outside 88-156px ... ROOT CAUSE:
  html{scroll-behavior:smooth} on a 29364px document; first: #mt-dallas@7373px". #mt-dallas
  sits at ~7394px in that document, so the probe measured a page that had barely moved.
  waitForScrollSettle already waits for consecutive equal scrollY reads and a 400ms
  start grace, and it still lost the race, because a smooth fragment scroll hands the
  landing to the browser's animation scheduler. When that scroll starts or finishes is
  not something the page decides.

  The site declares the same rule in `@media (prefers-reduced-motion: no-preference)`,
  reproduced below. It is on every page, so every landing the check measured depended on
  animation timing.

  This fixture is the same shape: a long document, html{scroll-behavior:smooth}, and
  targets whose scroll-margin-top lands them inside the band (112px against a 96px header,
  band 88-156). #s17 is a real defect (scroll-margin-top 20px, so it lands under the
  header). The check must report it, and only it, however the animation is timed.

  The race cannot be made to lose deterministically: an animation that stalls under load is
  exactly what a fixture cannot schedule. So the meta test checks what makes the race
  impossible instead. The capture listener below records the computed root scroll-behavior
  at each click. Every entry must be "auto", and the page must read "smooth" again after
  the check returns, because the checks that run later must see the page as shipped.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>smooth-scroll landing fixture</title>
<style>
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 16px/1.5 system-ui, sans-serif; }
  header { position: sticky; top: 0; height: 96px; background: #2D6A4F; color: #fff; z-index: 50;
           display: flex; flex-wrap: wrap; align-items: center; overflow: hidden; }
  nav a { color: #fff; display: inline-block; min-width: 36px; padding: 2px 4px; font-size: 12px; }
  section { scroll-margin-top: 112px; min-height: 950px; padding: 24px 16px; }
  section.miss { scroll-margin-top: 20px; }
  .tail { height: 1000px; }
</style>
</head>
