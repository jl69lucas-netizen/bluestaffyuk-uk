<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>a misspelled component class</title>
<style>
  body { margin:0; font:16px/1.5 system-ui }
  .bird-card { border:1px solid #e7ddd3; border-radius:20px; padding:16px }
  .bird-name { font-size:18px; margin:0 0 6px }
  .ship-line { color:#6b625a }
</style></head><body>
<div class="bird-card">
  <!-- `.bird-nmae` is a typo: the heading renders unstyled and nothing says so. This
       is the /adoption-cost/ defect, where FAQ text was put in `.faqC-x`, a 16x16
       icon box. -->
  <h2 class="bird-nmae">Roys</h2>
  <p class="shipline">Ships nationwide · $185 airport · $350 home</p>
</div>
</body></html>
