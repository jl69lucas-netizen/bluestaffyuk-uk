  document therefore cannot scroll any further than the end of its own content, so a jump
  to the short final section #s6 leaves that section's top in the 64px the bar is painted
  over. That one deleted declaration is the whole defect, and it is the edit most likely to
  be made by accident — the bar still looks right on every screen that is not scrolled to
  the bottom. Fixtures are test data, so hex is spelled here; the no-hex rule scans src/.
-->
