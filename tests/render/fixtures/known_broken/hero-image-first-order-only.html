<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>photo first in source, second on a phone</title>
<style>
  /* The defect Hero.astro shipped before 2026-09-27: rule 10's source order is right, and the
     unconditional `.pic { order: 2 }` paints the photo under the copy once the grid is one
     column. Only the PAINT half of layout-hero-image-first-mobile can see this. */
  body { margin: 0; font: 16px/1.5 system-ui; }
  .inner { display: grid; grid-template-columns: 1.1fr 1fr; gap: 24px; padding: 24px; align-items: center; }
  .pic { order: 2; display: block; width: 100%; height: auto; aspect-ratio: 4 / 5; background: #dde3ea; }
  .copy { order: 1; }
  .title { font-size: 32px; margin: 0 0 8px; }
  @media (max-width: 900px) { .inner { grid-template-columns: 1fr; } .pic { aspect-ratio: 3 / 2; } }
</style>
</head><body>
<section class="kit-hero" data-hero-layout="split">
  <div class="inner">
    <div class="pic" role="img" aria-label="A blue Staffy puppy"></div>
    <div class="copy"><h1 class="title">Where can I meet a blue Staffy puppy?</h1>
      <p>The photo is first in source and painted second below 900px.</p></div>
  </div>
</section>
</body></html>
