<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>chrome fixture — sticky sidebar is not chrome</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; }

  /* Real top chrome: spans the viewport, pinned from scrollY 0. */
  header { position: sticky; top: 0; height: 96px; background: #2D6A4F; z-index: 50; }

  .cols { display: flex; gap: 24px; padding: 24px; }

  /* NOT chrome: a sticky sidebar in a content column. It pins at top:0 and its box
     touches the viewport top, so a band-grow that only checks vertical adjacency
     absorbs it — on the live site this pulled aside.availB-rail (287px) and
     div.dial-card (672px) into the band, producing "chrome measures 784px" and a
     refusal to judge the page at all. It occupies ~23% of the viewport width. */
  aside { position: sticky; top: 0; width: 300px; height: 600px;
          background: #fff; border: 1px solid #e7ddd3; align-self: flex-start; }

  main { flex: 1; min-height: 6000px; }
</style>
</head>
<body>
  <header></header>
  <div class="cols">
    <aside>Sticky sidebar</aside>
    <main>
      <section id="a">A</section>
      <section id="b">B</section>
    </main>
  </div>
</body>
</html>
