<style>
/* Trust A — Tick run. What comes home with every puppy, written as one running list of ticked
   items that wraps like a sentence, ruled above and below on the bone page: no tiles, no
   icons in roundels, nothing to scan but the words. A short serif lead names who it is for;
   from 1024px the lead sits in a column of its own to the left of the run. */
.mtA{background:var(--color-surface);border-top:1px solid var(--color-border);border-bottom:1px solid var(--color-border)}
.mtA .in{max-width:1200px;margin:0 auto;padding:var(--space-5) var(--space-4);display:grid;gap:var(--space-3)}
.mtA .lead{margin:0;font-family:var(--font-display);font-size:var(--text-lg);line-height:1.3;color:var(--color-brand);max-width:30ch}
.mtA ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-5)}
.mtA li{display:inline-flex;align-items:center;gap:var(--space-2);margin:0;max-width:none;font-size:var(--text-base);line-height:1.35;font-weight:600;color:var(--color-text);min-height:32px}
.mtA svg{width:20px;height:20px;flex:none;color:var(--color-ok)}
@media (max-width:639px){.mtA ul{flex-direction:column;gap:var(--space-1)}}
@media (min-width:1024px){
  .mtA .in{grid-template-columns:minmax(0,17rem) minmax(0,1fr);column-gap:var(--space-8);align-items:center;padding:var(--space-6) var(--space-5)}
  .mtA ul{gap:var(--space-2) var(--space-6)}
}
</style>
<section data-component="trust-strip" data-variant="a" class="mtA">
  <div class="in">
    <p class="lead">Every puppy that comes home to Manchester from our Carlisle litter brings</p>
    <ul>
      <li data-trust-item><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Vet-signed health card</li>
      <li data-trust-item><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>First vaccinations</li>
      <li data-trust-item><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Microchipped</li>
      <li data-trust-item><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Wormed and flea treated</li>
      <li data-trust-item><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>KC registration application form</li>
      <li data-trust-item><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Raised in our home</li>
      <li data-trust-item><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Support after collection</li>
      <li data-trust-item><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>Two-year health guarantee</li>
    </ul>
  </div>
</section>
