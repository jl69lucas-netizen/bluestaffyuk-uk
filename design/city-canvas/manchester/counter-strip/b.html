<style>
/* Counter B — Range sheet. The litter's figures written up as one short sheet on a paper
   card over a soft steel ground: labelled cells first (the six puppies carry their faces
   inline, a small row of portraits beside the figure), then the delivery band drawn as a
   range bar from £200 to £350 in the seam colours, because a band priced by distance is a
   range, not a single figure. Cells stack 2-up on phones and run three across from 800px. */
.mcB{background:var(--color-brand-soft)}
.mcB .in{max-width:1080px;margin:0 auto;padding:var(--space-5) var(--space-4)}
.mcB .sheet{background:var(--color-surface-raised);border:var(--card-border);border-radius:var(--card-radius);box-shadow:var(--shadow-card);padding:var(--space-4)}
.mcB .cells{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-3)}
.mcB .cells li{margin:0;max-width:none;background:var(--counter-bed);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:var(--space-3)}
.mcB .cells .pups{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--space-2) var(--space-4)}
.mcB .lab{display:block;font-size:var(--text-xs);line-height:1.4;font-weight:600;color:var(--color-ink-2)}
.mcB .fig{display:block;font-family:var(--font-display);font-weight:600;font-size:var(--text-xl);line-height:1.2;color:var(--color-brand);white-space:nowrap;font-variant-numeric:lining-nums}
.mcB .faces{display:flex;padding-left:var(--space-2)}
.mcB .faces img{display:block;width:36px;height:36px;border-radius:50%;object-fit:cover;margin-left:calc(-1 * var(--space-2));border:2px solid var(--color-surface-raised);background:var(--color-brand-soft)}
.mcB .range{margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--color-border)}
.mcB .range .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:var(--space-1) var(--space-4)}
.mcB .track{margin:var(--space-3) 0 var(--space-1);height:10px;border-radius:var(--radius-pill);background:var(--seam-gradient)}
.mcB .ends{display:flex;justify-content:space-between;font-size:var(--text-xs);font-weight:600;color:var(--color-ink-2)}
.mcB .note{margin:var(--space-2) 0 0;font-size:var(--text-sm);color:var(--color-ink-2)}
@media (min-width:800px){
  .mcB .in{padding:var(--space-6) var(--space-5)}
  .mcB .sheet{padding:var(--space-5) var(--space-6)}
  .mcB .cells{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr)}
  .mcB .cells .pups{grid-column:auto}
  .mcB .fig{font-size:var(--text-2xl)}
}
</style>
<section data-component="counter-strip" data-variant="b" class="mcB">
  <div class="in">
    <div class="sheet">
      <ul class="cells" aria-label="This litter in figures">
        <li class="pups">
          <span data-figure><span class="lab">Puppies available now</span><span class="fig">6</span></span>
          <span class="faces">
            <img src="/puppies/Roman2.jpg" alt="Roman" width="1080" height="1081">
            <img src="/puppies/Byrd1.jpg" alt="Byrd" width="1080" height="1080">
            <img src="/puppies/Ince1.jpg" alt="Ince" width="1080" height="1079">
            <img src="/puppies/Vennie.jpeg" alt="Vennie" width="1080" height="1080">
            <img src="/puppies/Christa.jpeg" alt="Christa" width="1080" height="1080">
            <img src="/puppies/Cheryl1.jpeg" alt="Cheryl" width="1080" height="1350">
          </span>
        </li>
        <li data-figure><span class="lab">Each of our three boys</span><span class="fig">£1,500</span></li>
        <li data-figure><span class="lab">Each of our three girls</span><span class="fig">£1,700</span></li>
      </ul>
      <div class="range" data-figure>
        <div class="top"><span class="lab">UK home delivery to Manchester, by DEFRA-approved transport</span><span class="fig">£200–£350</span></div>
        <div class="track" aria-hidden="true"></div>
        <div class="ends" aria-hidden="true"><span>£200</span><span>£350</span></div>
        <p class="note">Priced by distance, or collect your puppy from us in Carlisle.</p>
      </div>
    </div>
  </div>
</section>
