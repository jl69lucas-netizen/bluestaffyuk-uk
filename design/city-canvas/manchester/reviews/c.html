<style>
/* Reviews C — Three plates (pool copy of london/reviews/c "Kennel wall", refreshed on LAYOUT).
   Kept from London: a photo that bleeds to the page edge, a bone plate that overlaps it clear
   of the face, the review set on the plate, and a credit on every photo so a parent never
   reads as the reviewer's own dog. Changed: London's one wall held one review under a heading;
   Manchester's three review slots (outline rows 6, 11, 20; no heading) are three plates, and
   the photo changes sides slot by slot: left for the Victoria family, right for Maggie and her
   pups beside Mark J's words, left for Jones beside Rachel L.'s. Below 1024px each photo runs full width
   on top and its plate rises over the foot. Regular density; no stars, no score. */
.rvC{background:var(--color-surface);overflow:hidden}
.rvC .slot{position:relative;margin:0}
.rvC .slot+.slot{margin-top:var(--space-9)}
.rvC .ph{position:relative;margin:0}
.rvC .ph img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;background:var(--color-bone-50)}
.rvC .cr{position:absolute;left:var(--space-3);top:var(--space-3);padding:var(--space-1) var(--space-3);border-radius:var(--radius-pill);background:var(--color-surface-deep);color:var(--color-text-on-inverse);font-size:13px;line-height:1.4}
.rvC .plate{position:relative;margin:calc(-1 * var(--space-8)) var(--space-3) 0;padding:var(--space-5) var(--space-4);background:var(--color-bone-50);box-shadow:inset 0 0 0 1px var(--color-border);border-radius:var(--radius-md)}
.rvC blockquote{margin:0}
.rvC blockquote p{margin:0;font-size:16px;line-height:1.6;color:var(--color-text);text-wrap:pretty}
.rvC .short blockquote p{font-family:var(--font-display);font-weight:600;font-size:20px;line-height:1.4;color:var(--color-brand)}
.rvC .sig{margin:var(--space-3) 0 0;padding-top:var(--space-3);border-top:1px solid var(--color-border);font-size:15px;color:var(--color-text-muted)}
.rvC .sig cite{font-style:normal;font-weight:700;color:var(--color-text)}
@media (min-width:640px) and (max-width:1023px){
  .rvC .ph{max-width:720px;margin:0 auto}
  .rvC .ph img{border-radius:var(--radius-md)}
}
@media (min-width:640px){
  .rvC .ph img{aspect-ratio:2/1}
  .rvC .plate{margin:calc(-1 * var(--space-7)) var(--space-8) 0;padding:var(--space-6)}
  .rvC blockquote p{font-size:17px}
}
@media (min-width:1024px){
  .rvC .slot{display:flex;align-items:center;min-height:400px;max-width:1160px;margin-left:auto;margin-right:auto;padding:var(--space-7) var(--space-6)}
  .rvC .slot+.slot{margin-top:var(--space-6)}
  .rvC .ph{position:absolute;top:0;bottom:0;width:52%}
  .rvC .slot.pl .ph{left:calc(-1 * max(0px,(100vw - 1160px) / 2))}
  .rvC .slot.pr .ph{right:calc(-1 * max(0px,(100vw - 1160px) / 2))}
  .rvC .slot.pl .ph{width:calc(52% + max(0px,(100vw - 1160px) / 2))}
  .rvC .slot.pr .ph{width:calc(52% + max(0px,(100vw - 1160px) / 2))}
  .rvC .ph img{height:100%;aspect-ratio:auto}
  .rvC .cr{top:auto;bottom:var(--space-4)}
  .rvC .slot.pl .cr{left:max(var(--space-4),calc((100vw - 1160px) / 2 + var(--space-4)))}
  .rvC .slot.pr .cr{left:auto;right:max(var(--space-4),calc((100vw - 1160px) / 2 + var(--space-4)))}
  .rvC .slot.pl .plate{margin:0 0 0 auto}
  .rvC .slot.pr .plate{margin:0 auto 0 0}
  .rvC .plate{width:56%;max-width:600px;padding:var(--space-7)}
  .rvC .short blockquote p{font-size:22px}
}
</style>
<section data-component="reviews" data-variant="c" class="rvC">
  <figure class="slot pl" data-review-slot>
    <div class="ph">
      <img src="/images/victoria-family-blue-staffy-manchester.webp" alt="Victoria family with their happy blue Staffy puppy from BlueStaffyUK.uk in Manchester." width="723" height="723" loading="lazy" style="object-position:45% 12%">
    </div>
    <div class="plate">
      <blockquote data-review="0">
        <p>We couldn’t be happier with our beautiful blue Staffy from BlueStaffyUK.uk! From the first enquiry to bringing her home, the process was seamless and incredibly professional. She’s got the most wonderful temperament – playful, loving, and fantastic with our kids. It’s clear she was raised with so much care and early socialisation. She truly is the heart of our family!</p>
      </blockquote>
      <figcaption class="sig"><cite>The Victoria Family</cite>, Manchester, UK</figcaption>
    </div>
  </figure>
  <figure class="slot pr" data-review-slot>
    <div class="ph">
      <img src="/images/maggie-blue-staffy-dam-with-pups.webp" alt="A heartwarming photo of Maggie, a beautiful 2-year-old blue Staffy Dam, lovingly tending to her pups." width="780" height="585" loading="lazy" style="object-position:70% 30%">
      <span class="cr">Photo: Maggie, our dam, with her pups</span>
    </div>
    <div class="plate">
      <blockquote data-review="1">
        <p>After extensive research, we chose BlueStaffyUK.uk, and we’re so glad we did. Our blue Staffy puppy arrived happy and healthy, with all his papers and medical records meticulously organized. Their commitment to ethical breeding and health testing truly shines through. He’s exactly what we wanted: loyal, intelligent, and incredibly affectionate. We highly recommend them if you’re looking to buy a Staffordshire Bull Terrier in the UK.</p>
      </blockquote>
      <figcaption class="sig"><cite>Mark J</cite>, London, UK</figcaption>
    </div>
  </figure>
  <figure class="slot pl short" data-review-slot>
    <div class="ph">
      <img src="/images/jones-magnificent-blue-staffy-sire.webp" alt="A striking portrait of Jones, our magnificent 3-year-old blue Staffordshire Bull Terrier Sire." width="780" height="780" loading="lazy" style="object-position:55% 35%">
      <span class="cr">Photo: Jones, the sire of this litter</span>
    </div>
    <div class="plate">
      <blockquote data-review="2">
        <p>The health checks, the communication, and the home-raised environment — everything was top-notch. I wouldn’t go anywhere else for a Staffy.</p>
      </blockquote>
      <figcaption class="sig"><cite>Rachel L.</cite>, London</figcaption>
    </div>
  </figure>
</section>
