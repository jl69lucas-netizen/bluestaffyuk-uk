<style>
/* Video A — Screening room. A deep-steel band, dark like a cinema before the lights go down:
   the question and its answer centred, then one wide click-to-play screen (a served poster
   shown no wider than its own 780px, a brass play disc in its clear lower-left corner, nothing loaded from YouTube until it is pressed), and under the screen a
   programme line: the caption on the left and, on the right, a small print of Jones, the
   sire, as the section's own photo. Airy: one screen, given room. */
.vdA{background:var(--color-surface-deep);color:var(--color-text-on-inverse)}
.vdA .in{max-width:828px;margin:0 auto;padding:var(--space-8) var(--space-4) var(--space-8)}
.vdA h2{margin:0 0 var(--space-3);font-size:var(--text-2xl);line-height:var(--text-2xl--line-height);color:var(--color-text-on-inverse);text-align:center;text-wrap:balance}
.vdA .lede{margin:0 auto var(--space-6);max-width:56ch;text-align:center;color:var(--color-text-on-inverse)}
.vdA .screen{margin:0}
.vdA .play{position:relative;display:block;width:100%;padding:0;font:inherit;border:0;border-radius:var(--radius-md);background:var(--color-steel-700);cursor:pointer;overflow:hidden}
.vdA .play img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 18%;transition:opacity var(--dur-base) var(--ease-out)}
.vdA .play:hover img{opacity:.88}
.vdA .play:focus-visible{outline:3px solid var(--color-focus-on-inverse);outline-offset:4px}
.vdA .disc{position:absolute;left:var(--space-4);bottom:var(--space-4);display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--color-cta);color:var(--color-cta-ink);box-shadow:var(--shadow-lift);transition:transform var(--dur-fast) var(--ease-out)}
.vdA .play:hover .disc{transform:scale(1.06)}
.vdA .disc svg{width:26px;height:26px;margin-left:4px}
.vdA .prog{display:grid;gap:var(--space-4);margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--color-steel-500)}
.vdA figcaption{margin:0;font-size:var(--text-sm);color:var(--color-text-on-inverse)}
.vdA figcaption b{display:block;font-family:var(--font-display);font-size:var(--text-lg);font-weight:600;margin-bottom:2px}
.vdA .sire{display:grid;grid-template-columns:88px minmax(0,1fr);gap:var(--space-3);align-items:center;margin:0}
.vdA .sire img{display:block;width:88px;height:88px;aspect-ratio:1/1;object-fit:cover;object-position:50% 30%;border-radius:50%;border:2px solid var(--color-brass-200);background:var(--color-steel-700)}
.vdA .sire p{margin:0;font-size:var(--text-sm);color:var(--color-text-on-inverse)}
.vdA .nb{white-space:nowrap}
@media (min-width:768px){
  .vdA .in{padding:var(--space-10) var(--space-6)}
  .vdA .disc{left:var(--space-6);bottom:var(--space-6);width:84px;height:84px}
  .vdA .disc svg{width:34px;height:34px}
  .vdA .prog{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:var(--space-6);align-items:center}
}
@media (min-width:1024px){
  .vdA h2{font-size:var(--text-3xl);line-height:var(--text-3xl--line-height)}
}
</style>
<section data-component="video" data-variant="a" class="vdA" data-video-id="g9iV9RVr_Sk">
  <div class="in">
    <h2>What Does One of Our Litters Look Like on Film?</h2>
    <p class="lede">Press play and you will see puppies from one of our litters on the move, which tells a London family more about a Staffy than any still photo can.</p>
    <figure class="screen">
      <button type="button" class="play" data-play aria-label="Play the video: Staffordshire Bull Terrier puppies — a litter of ours on film">
        <img src="/images/maggie-blue-staffy-dam-with-pups.webp" alt="Maggie, the blue Staffy dam, sitting on a sofa beside two of her blue puppies" width="780" height="585" loading="lazy">
        <span class="disc" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg></span>
      </button>
      <div class="prog">
        <figcaption><b>A Litter of Ours, on Film</b>Puppies from one of our litters. The player loads from YouTube only when you press play. The poster photo is Maggie with two of her puppies.</figcaption>
        <div class="sire">
          <img src="/images/jones-strong-staffy-sire-temperament.webp" alt="Jones, the blue Staffy sire, sitting calmly in front of his crate" width="663" height="660" loading="lazy">
          <p>Jones, the sire, and Maggie, the dam, are the parents of the six available now, both DNA-tested clear of <span class="nb">L-2-HGA and HC-HSF4</span>.</p>
        </div>
      </div>
    </figure>
  </div>
</section>
