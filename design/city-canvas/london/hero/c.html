<style>
/* Hero C — Rail ticket. The photo fills the whole band edge to edge, behind the copy; the
   copy is printed on a bone ticket card laid over its right side, with a Carlisle to London route line, a
   perforation and punched notches. On a phone the photo comes first and the ticket slides
   up over its foot. */
.hbC{position:relative;background:var(--color-steel-100);overflow-x:clip}
.hbC .win{margin:0}
.hbC .win img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;object-position:60% 55%;background:var(--color-steel-100)}
.hbC .ticket{position:relative;margin:calc(-1 * var(--space-8)) var(--space-4) var(--space-5);background:var(--color-bone-50);border-radius:var(--radius-md);box-shadow:var(--shadow-lift);padding:var(--space-4) var(--space-5) var(--space-5);
  -webkit-mask:radial-gradient(circle 11px at 0 64px,transparent 10px,var(--color-ink) 11px) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 64px,transparent 10px,var(--color-ink) 11px) right/51% 100% no-repeat;
  mask:radial-gradient(circle 11px at 0 64px,transparent 10px,var(--color-ink) 11px) left/51% 100% no-repeat,radial-gradient(circle 11px at 100% 64px,transparent 10px,var(--color-ink) 11px) right/51% 100% no-repeat}
.hbC .route{display:flex;align-items:center;gap:var(--space-2);height:48px;margin:0 0 var(--space-4);padding-bottom:var(--space-3);border-bottom:2px dashed var(--color-border);font-size:var(--text-xs);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--color-brand);white-space:nowrap}
.hbC .route svg{flex:0 0 auto;width:32px;height:12px}
@media (max-width:420px){.hbC .route{letter-spacing:.07em}}
.hbC h1{font-size:var(--text-3xl);line-height:var(--text-3xl--line-height);margin:0 0 var(--space-3);text-wrap:balance}
.hbC .lede{margin:0 0 var(--space-4);color:var(--color-ink-2)}
.hbC .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3) var(--space-5)}
.hbC .cta{display:inline-flex;align-items:center;min-height:48px;padding:0 var(--space-6);border-radius:var(--btn-radius);background:var(--color-cta);color:var(--color-cta-ink);font-weight:700;text-decoration:none;transition:background-color var(--dur-fast) var(--ease-out)}
.hbC .cta:hover{background:var(--color-cta-hover)}
.hbC .more{display:inline-flex;align-items:center;min-height:44px;color:var(--color-link);font-weight:600;text-underline-offset:4px}
@media (min-width:640px) and (max-width:1023px){.hbC .win img{aspect-ratio:16/9}.hbC .ticket{max-width:600px;margin-inline:auto}}
@media (min-width:1024px){
  .hbC{height:430px}
  .hbC .win{position:absolute;inset:0}
  .hbC .win img{width:100%;height:100%;aspect-ratio:auto;object-position:50% 62%}
  .hbC .ticket{position:absolute;top:50%;right:max(var(--space-5),calc(50% - 600px));transform:translateY(-50%);width:540px;margin:0;padding:var(--space-5) var(--space-6) var(--space-6)}
}
</style>
<section data-component="hero" data-variant="c" class="hbC">
  <figure class="win">
    <img src="/puppies/Vennie.jpeg" alt="Vennie, a blue and white Staffy girl, curled on a cream fleece with her blue eyes on the camera" width="1080" height="1080" fetchpriority="high">
  </figure>
  <div class="ticket">
    <p class="route"><span>Carlisle</span><svg viewBox="0 0 48 12" preserveAspectRatio="none" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 6h40M36 1l6 5-6 5"/></svg><span>Your London door</span></p>
    <h1>Where Can I Find a Blue Staffy Puppy Near London?</h1>
    <p class="lede">With us: six home-raised puppies in Carlisle, and a £500 deposit that books your viewing and reserves the one you choose.</p>
    <div class="row">
      <a class="cta" href="#puppies">See who is ready</a>
      <a class="more" href="#deposit">How the deposit works</a>
    </div>
  </div>
</section>
