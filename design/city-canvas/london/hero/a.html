<style>
/* Hero A — Broadsheet. An editorial front page: a heavy steel rule over the band, a
   hairline under it, a column rule between copy and photo, and the photo mounted as a
   postcard with its own caption plate. Photo first in source; order moves it right. */
.hbA{background:var(--color-surface);border-top:4px solid var(--color-brand);border-bottom:1px solid var(--color-border)}
.hbA .in{max-width:1200px;margin:0 auto;padding:var(--space-5) var(--space-4) var(--space-7);display:grid;gap:var(--space-5)}
.hbA .pic{margin:0;background:var(--color-surface-raised);padding:var(--space-2) var(--space-2) 0;box-shadow:var(--shadow-card);border-radius:var(--radius-sm)}
.hbA .pic img{display:block;width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;object-position:50% 30%;border-radius:2px;background:var(--color-bone-50)}
.hbA .pic figcaption{display:flex;justify-content:space-between;gap:var(--space-3);font-size:var(--text-xs);line-height:1.4;color:var(--color-ink-2);padding:var(--space-2) var(--space-1) var(--space-3)}
.hbA .pic figcaption b{font-weight:600;color:var(--color-ink)}
.hbA .dateline{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2) var(--space-3);margin:0 0 var(--space-3);font-size:var(--text-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-brand)}
.hbA .dateline span+span{padding-left:var(--space-3);border-left:1px solid var(--color-border)}
.hbA h1{font-size:var(--text-3xl);line-height:var(--text-3xl--line-height);letter-spacing:-.01em;margin:0 0 var(--space-3);max-width:18ch;text-wrap:balance}
.hbA .lede{margin:0 0 var(--space-5);color:var(--color-ink-2);max-width:56ch}
.hbA .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3) var(--space-5)}
.hbA .cta{display:inline-flex;align-items:center;gap:var(--space-2);min-height:48px;padding:0 var(--space-6);border-radius:var(--btn-radius);background:var(--color-cta);color:var(--color-cta-ink);font-weight:700;text-decoration:none;transition:background-color var(--dur-fast) var(--ease-out)}
.hbA .cta:hover{background:var(--color-cta-hover)}
.hbA .cta svg{width:1em;height:1em}
.hbA .more{display:inline-flex;align-items:center;min-height:44px;color:var(--color-link);font-weight:600;text-underline-offset:4px}
@media (min-width:1024px){
  .hbA .in{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:center;gap:0;min-height:390px;padding:var(--space-6) var(--space-5)}
  .hbA .pic{order:2;margin-left:var(--space-7);transform:rotate(1.2deg)}
  .hbA .pic img{aspect-ratio:auto;height:270px}
  .hbA .copy{order:1;padding-right:var(--space-7);border-right:1px solid var(--color-border)}
  .hbA h1{font-size:var(--text-4xl);line-height:var(--text-4xl--line-height)}
}
@media (min-width:640px) and (max-width:1023px){.hbA .pic img{aspect-ratio:16/9;object-position:50% 25%}.hbA h1{max-width:22ch}}
@media (prefers-reduced-motion:reduce){.hbA .pic{transform:none}}
</style>
<section data-component="hero" data-variant="a" class="hbA">
  <div class="in">
    <figure class="pic">
      <img src="/images/ethical-staffy-puppy-london-delivery.webp" alt="A boy holds a blue Staffy puppy against his chest in a back garden" width="540" height="664" fetchpriority="high">
      <figcaption><b>Home delivery to London</b><span>DEFRA-approved transport</span></figcaption>
    </figure>
    <div class="copy">
      <p class="dateline"><span>Carlisle, Cumbria</span><span>Six puppies ready now</span></p>
      <h1>Where Can I Find a Blue Staffy Puppy Near London?</h1>
      <p class="lede">Right here: six Blue Staffy puppies raised in Lisa Bright's home in Carlisle, brought to your London door for £200–£350, priced by distance.</p>
      <div class="row">
        <a class="cta" href="#puppies">Meet the six puppies <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <a class="more" href="#delivery">How London delivery works</a>
      </div>
    </div>
  </div>
</section>
