<style>
/* Counter A — Price slip. A receipt pressed flat into a steel-100 panel sunk in the counter
   bed: no shadow, no raised surface, just a torn top edge, a caps header and the lines read
   top to bottom (how many, a boy, a girl, the deposit, delivery). A running dotted rule
   divides every label from its figure. There is no total: each line stands alone, and the
   header says so. From 1024px the five lines flow into two columns inside the one slip, so
   the strip stays low. Its own bone-50 bed and a steel top rule part it from the hero. */
.csA{background:var(--counter-bed);border-top:1px solid var(--color-border);box-shadow:inset 0 3px 0 var(--color-brand);padding:var(--space-5) var(--space-3) var(--space-6)}
.csA .slip{max-width:600px;margin:0 auto;background:var(--color-brand-soft);padding:var(--space-4) var(--space-4) var(--space-3);
  -webkit-mask:conic-gradient(from 135deg at top,transparent,var(--color-ink) 1deg 89deg,transparent 90deg) top/14px 7px repeat-x,linear-gradient(var(--color-ink),var(--color-ink)) 0 7px/100% calc(100% - 7px) no-repeat;
  mask:conic-gradient(from 135deg at top,transparent,var(--color-ink) 1deg 89deg,transparent 90deg) top/14px 7px repeat-x,linear-gradient(var(--color-ink),var(--color-ink)) 0 7px/100% calc(100% - 7px) no-repeat}
.csA .title{margin:var(--space-2) 0 var(--space-2);padding-bottom:var(--space-2);border-bottom:2px dashed var(--color-steel-300);display:flex;flex-wrap:wrap;justify-content:space-between;gap:var(--space-1) var(--space-3);font-size:var(--text-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-brand)}
.csA .title span+span{color:var(--color-ink);letter-spacing:.04em;text-transform:none;font-weight:600}
.csA dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr)}
.csA .line{display:grid;grid-template-columns:minmax(0,1fr) auto;border-bottom:1px solid var(--color-steel-300)}
.csA .line:last-child{border-bottom:0}
.csA dt{padding:var(--space-2) var(--space-4) var(--space-2) 0;font-size:var(--text-sm);line-height:1.4;color:var(--color-ink)}
.csA dt b{display:block;font-size:var(--text-base);color:var(--color-ink);font-weight:600}
.csA dd{margin:0;box-sizing:border-box;width:calc(5.9em + var(--space-4));padding:var(--space-2) 0 var(--space-2) var(--space-4);border-left:1px dotted var(--color-brand-mid);display:flex;align-items:center;justify-content:flex-end;font-family:var(--font-display);font-weight:700;font-size:var(--text-xl);line-height:1.1;color:var(--color-brand);font-variant-numeric:tabular-nums lining-nums;white-space:nowrap}
@media (min-width:768px){.csA .slip{padding-inline:var(--space-5)}.csA dd{font-size:var(--text-2xl)}}
@media (min-width:1024px){
  .csA{padding:var(--space-3) var(--space-5) var(--space-4)}
  .csA .slip{max-width:1100px;padding:var(--space-3) var(--space-6) var(--space-3)}
  .csA dl{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,auto);grid-auto-flow:column;column-gap:var(--space-8)}
  .csA .line:nth-child(3){border-bottom:0}
  .csA .line:last-child{border-bottom:1px solid var(--color-steel-300)}
  .csA dt{line-height:1.3;padding-block:6px}
  .csA dd{padding-block:6px}
  .csA .title{margin:var(--space-1) 0 var(--space-1)}
  .csA dd{width:calc(5.9em + var(--space-5));font-size:var(--text-xl)}
}
</style>
<section data-component="counter-strip" data-variant="a" class="csA">
  <div class="slip">
    <p class="title"><span>Price slip · Carlisle to London</span><span>Each line stands alone, not a running total</span></p>
    <dl>
      <div class="line"><dt><b>Puppies ready now</b>three boys, three girls</dt><dd data-figure>6</dd></div>
      <div class="line"><dt><b>A boy</b>Roman, Byrd or Ince</dt><dd data-figure>£1,500</dd></div>
      <div class="line"><dt><b>A girl</b>Vennie, Christa or Cheryl</dt><dd data-figure>£1,700</dd></div>
      <div class="line"><dt><b>Deposit</b>books your viewing, reserves your puppy</dt><dd data-figure>£500</dd></div>
      <div class="line"><dt><b>Delivery</b>DEFRA-approved, by distance</dt><dd data-figure>£200–£350</dd></div>
    </dl>
  </div>
</section>
