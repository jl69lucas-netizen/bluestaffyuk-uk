<style>
/* Reviews B — Two London notes. A sunk steel-100 tray (no shadow, no raised surface) that
   opens with a wide section photo across its top (Vennie, one of the six, credited so it never
   reads as a reviewer's dog), then holds the two reviews in data/reviews.json that give London
   as home, one per slot, stacked in a single column like two notes pinned one below the
   other: the second is stepped in from the left so the pair reads as two voices, never as a
   grid. Each note opens with its place as a small caps label and closes on a signature;
   the short review is set large in the display face, the long one in the body face.
   Compact; no stars, no score. */
.rvB{background:var(--color-surface)}
.rvB .in{max-width:960px;margin:0 auto;padding:var(--space-7) var(--space-4)}
.rvB h2{margin:0 0 var(--space-3);font-size:var(--text-2xl);line-height:var(--text-2xl--line-height);text-wrap:balance;max-width:24ch}
.rvB .lede{margin:0 0 var(--space-5);max-width:60ch;color:var(--color-text)}
.rvB .tray{background:var(--color-brand-soft);border-radius:var(--radius-lg);padding:var(--space-4) var(--space-4);display:grid;gap:var(--space-3)}
.rvB .top{margin:0 0 var(--space-2)}
.rvB .top img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;object-position:50% 40%;border-radius:var(--radius-md);background:var(--color-bone-50)}
.rvB .top figcaption{margin-top:var(--space-2);font-size:var(--text-xs);color:var(--color-ink-2)}
.rvB .note{margin:0;padding:var(--space-4) 0}
.rvB .note{border-top:1px solid var(--color-steel-300)}
.rvB .place{margin:0 0 var(--space-2);display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-xs);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--color-brand)}
.rvB .place svg{width:16px;height:16px;flex:none}
.rvB blockquote{margin:0}
.rvB blockquote p{margin:0;font-size:var(--text-base);line-height:1.65;color:var(--color-text)}
.rvB .note:nth-of-type(2) blockquote p{font-family:var(--font-display);font-weight:600;font-size:var(--text-xl);line-height:1.35;color:var(--color-brand)}
.rvB .sig{margin:var(--space-3) 0 0;font-size:var(--text-sm);color:var(--color-ink-2)}
.rvB .sig cite{font-style:normal;font-weight:700;color:var(--color-brand)}
@media (min-width:768px){
  .rvB .in{padding:var(--space-9) var(--space-6)}
  .rvB .tray{padding:var(--space-5) var(--space-7)}
  .rvB .top img{aspect-ratio:21/9}
  .rvB .note:last-child{margin-left:18%}
}
@media (min-width:1024px){
  .rvB h2{font-size:var(--text-3xl);line-height:var(--text-3xl--line-height)}
  .rvB .note:nth-of-type(2) blockquote p{font-size:var(--text-2xl);line-height:1.3}
}
</style>
<section data-component="reviews" data-variant="b" class="rvB">
  <div class="in">
    <h2>What Do London Owners Tell Us About Buying From Us?</h2>
    <p class="lede">Two of the reviews we hold come from owners who gave London as home, and we print both here word for word, one to a slot, with nothing trimmed.</p>
    <div class="tray">
      <figure class="top">
        <img src="/puppies/Vennie.jpeg" alt="Vennie, a white Staffy girl with blue patches, curled on a sheepskin rug" width="1080" height="1080" loading="lazy">
        <figcaption>Photo: Vennie, one of the six available now.</figcaption>
      </figure>
      <figure class="note" data-review-slot>
        <p class="place"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>London</p>
        <blockquote data-review="2">
          <p>The health checks, the communication, and the home-raised environment — everything was top-notch. I wouldn’t go anywhere else for a Staffy.</p>
        </blockquote>
        <figcaption class="sig"><cite>Rachel L.</cite>, London</figcaption>
      </figure>
      <figure class="note" data-review-slot>
        <p class="place"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>London, UK</p>
        <blockquote data-review="1">
          <p>After extensive research, we chose BlueStaffyUK.uk, and we’re so glad we did. Our blue Staffy puppy arrived happy and healthy, with all his papers and medical records meticulously organized. Their commitment to ethical breeding and health testing truly shines through. He’s exactly what we wanted: loyal, intelligent, and incredibly affectionate. We highly recommend them if you’re looking to buy a Staffordshire Bull Terrier in the UK.</p>
        </blockquote>
        <figcaption class="sig"><cite>Mark J</cite>, London, UK</figcaption>
      </figure>
    </div>
  </div>
</section>
